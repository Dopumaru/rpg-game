<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<style>

  }

<script>
'use strict';
/* ============================================================
   CRÔNICAS DE PIXEL — um RPG em pixels
   Classes, níveis, progressão de status, combate por turnos.
   ============================================================ */

// ---------- Constantes ----------
const VW = 320, VH = 180, TILE = 16;
const cv = document.getElementById('screen');
const mainCtx = cv.getContext('2d');
// camada de texto em resolução cheia (texto nítido sobre a arte em pixels)
// Tudo é desenhado num único buffer em RESOLUÇÃO CHEIA, com as coordenadas
// lógicas de sempre (320×180) aplicadas por transform. Assim painéis, barras,
// degradês e texto saem nítidos no tamanho real da tela, enquanto os sprites
// em pixel art continuam ampliados por vizinho mais próximo — o visual híbrido
// 2D/3D em que o pixel é escolha, não limitação.
let SCALE = 3;
const buf = document.createElement('canvas');
const ctx = buf.getContext('2d');
function resizeScreen() {
  const availW = window.innerWidth, availH = window.innerHeight - 30;
  // escala inteira para a arte em pixels continuar alinhada
  SCALE = Math.max(2, Math.min(6, Math.floor(Math.min(availW / VW, availH / VH))));
  cv.width = VW * SCALE;
  cv.height = VH * SCALE;
  buf.width = cv.width;
  buf.height = cv.height;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const fit = Math.max(1, Math.min(availW / VW, availH / VH));
  cv.style.width = Math.round(VW * fit) + 'px';
  cv.style.height = Math.round(VH * fit) + 'px';
  const cvGl = document.getElementById('gl');
  if (cvGl) {
    cvGl.style.width = cv.style.width;
    cvGl.style.height = cv.style.height;
  }
  mainCtx.imageSmoothingEnabled = false;
  // R3 é declarado bem depois; na primeira chamada ainda não existe
  try { if (R3.ok) R3.redimensiona(); } catch (e) {}
}
window.addEventListener('resize', resizeScreen);
resizeScreen();
// caixas que cobrem outra tela: agora é um fillRect comum, porque não há mais
// duas camadas para sincronizar
function coverRect(x, y, w, h, fill) {
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
}

// ---------- Utilidades ----------
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
// hash determinístico p/ variação de tiles
function hash2(x, y) {
  // os dois deslocamentos precisam ser lógicos (>>>), não aritméticos (>>):
  // h pode ser negativo (por causa do |0), e XORar um valor com seu próprio
  // deslocamento aritmético sempre cancela o bit 31 (o sinal se preserva no
  // deslocamento e sobrevive ao XOR) — o resultado nunca passava de 0.5, então
  // todo limiar de densidade >0.5 no mapa (florestas, sobretudo) sempre dava
  // verdadeiro, virando parede sólida em vez de esparsa
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

// ---------- Entrada ----------
const keys = {};
const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  W: 'up', S: 'down', A: 'left', D: 'right',
  z: 'ok', Z: 'ok', Enter: 'ok', ' ': 'ok',
  x: 'back', X: 'back', Escape: 'back',
  c: 'menu', C: 'menu', n: 'mute', N: 'mute',
  m: 'mapa', M: 'mapa',
  j: 'log', J: 'log',
  q: 'alt', Q: 'alt',
  t: 'vendertudo', T: 'vendertudo',
  Shift: 'run'
};
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (k) {
    e.preventDefault();
    // Fila ordenada de toques: nada se perde quando vários caem no mesmo
    // quadro, e a ORDEM é respeitada — apertar ↓↓↓ e Z depressa não faz o Z
    // valer antes das setas.
    if (!keys[k] && filaToques.length < 10) filaToques.push({ k, idade: 0 });
    keys[k] = true;
    AU.init();
    if (k === 'mute') { AU.muted = !AU.muted; toast(AU.muted ? 'Som desligado' : 'Som ligado'); }
  }
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
// só consome se for o toque mais antigo pendente, para manter a ordem
function tap(k) {
  if (!filaToques.length || filaToques[0].k !== k) return false;
  filaToques.shift();
  return true;
}
// espia o próximo toque sem consumir
function proxToque() { return filaToques.length ? filaToques[0].k : null; }
let filaToques = [];
// consulta sem consumir (para distinguir esquerda/direita no mesmo quadro)
let ultimaDir = null;
function tap2(k) { return ultimaDir === k; }

// ---------- Áudio (WebAudio chiptune) ----------
// famílias de youkai por som de combate (hit/crit/hurt) — o resto dos
// tipos (goblin, rokuro) fica no som genérico padrão, sem entrada aqui
const MOB_FAMILY = {
  slime: 'slime', reislime: 'slime',
  esqueleto: 'osso', zumbi: 'osso', necromante: 'osso',
  fantasma: 'espirito', elemental: 'espirito', yukionna: 'espirito', yamauba: 'espirito', nue: 'espirito',
  lobo: 'fera', morcego: 'fera', harpia: 'fera', aranha: 'fera', aranharainha: 'fera', tenguveterano: 'fera',
  golem: 'metal', orc: 'metal', onigeneral: 'metal', tsuchigumo: 'metal', dragao: 'metal', amanojaku: 'metal'
};
// cada entrada é uma lista de chamadas a tone(freq,dur,type,vol,slide) —
// mesmo formato/duração dos sons genéricos, só timbre e frequência mudam
const FAMILY_TONE = {
  slime:    { hit: [[150, 0.14, 'sine', 0.07, -50]], crit: [[220, 0.18, 'sine', 0.09, -80], [110, 0.22, 'triangle', 0.06, -40]], hurt: [[130, 0.2, 'sine', 0.08, -40]] },
  osso:     { hit: [[280, 0.07, 'square', 0.07, -10]], crit: [[340, 0.09, 'square', 0.09, -10], [200, 0.1, 'square', 0.06, 0]], hurt: [[220, 0.09, 'square', 0.08, -10]] },
  espirito: { hit: [[320, 0.22, 'sine', 0.06, 30]], crit: [[420, 0.2, 'sine', 0.08, 50], [260, 0.24, 'sine', 0.05, 20]], hurt: [[300, 0.22, 'sine', 0.07, 20]] },
  fera:     { hit: [[150, 0.13, 'sawtooth', 0.09, -150]], crit: [[210, 0.17, 'sawtooth', 0.11, -190], [110, 0.2, 'square', 0.07, -70]], hurt: [[140, 0.16, 'sawtooth', 0.1, -110]] },
  metal:    { hit: [[340, 0.09, 'square', 0.08, -20]], crit: [[420, 0.1, 'square', 0.1, -15], [240, 0.12, 'square', 0.07, -10]], hurt: [[260, 0.1, 'square', 0.08, -15]] }
};
const AU = {
  ctx: null, muted: false, musicTimer: 0, musicStep: 0, track: null,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } },
  tone(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    if (!this.ctx || this.muted || SETTINGS.volume <= 0) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol * SETTINGS.volume, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  // hit/crit/hurt variam por família de youkai (ver MOB_FAMILY/FAMILY_TONE);
  // sem família mapeada (ou fora de batalha), cai no som genérico de sempre
  sfx(name, mobType) {
    const fam = mobType && MOB_FAMILY[mobType];
    const ft = fam && FAMILY_TONE[fam] && FAMILY_TONE[fam][name];
    if (ft) { for (const t of ft) this.tone(...t); return; }
    switch (name) {
      case 'menu':    this.tone(660, 0.05, 'square', 0.04); break;
      case 'ok':      this.tone(784, 0.06, 'square', 0.05); this.tone(1046, 0.08, 'square', 0.04); break;
      case 'back':    this.tone(392, 0.07, 'square', 0.04); break;
      case 'hit':     this.tone(180, 0.12, 'sawtooth', 0.08, -120); break;
      case 'crit':    this.tone(240, 0.16, 'sawtooth', 0.1, -180); this.tone(120, 0.2, 'square', 0.07, -60); break;
      case 'hurt':    this.tone(140, 0.18, 'sawtooth', 0.09, -90); break;
      case 'heal':    this.tone(523, 0.09, 'triangle', 0.06); setTimeout(() => this.tone(784, 0.12, 'triangle', 0.06), 90); break;
      case 'magic':   this.tone(880, 0.2, 'sine', 0.06, 500); this.tone(440, 0.15, 'triangle', 0.05, 300); break;
      case 'coin':    this.tone(988, 0.06, 'square', 0.05); setTimeout(() => this.tone(1319, 0.1, 'square', 0.05), 60); break;
      case 'level':   [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.14, 'square', 0.06), i * 100)); break;
      case 'battle':  this.tone(220, 0.3, 'sawtooth', 0.07, 400); break;
      case 'flee':    this.tone(600, 0.2, 'triangle', 0.05, -300); break;
      case 'die':     [392, 330, 262, 196].forEach((f, i) => setTimeout(() => this.tone(f, 0.2, 'triangle', 0.06), i * 160)); break;
      case 'victory': [659, 659, 659, 880].forEach((f, i) => setTimeout(() => this.tone(f, i === 3 ? 0.4 : 0.12, 'square', 0.06), i * 130)); break;
      // entrada de chefe: estilo anime — golpe agudo, soco grave descendente, rumor sustentado
      case 'boss':
        this.tone(880, 0.08, 'square', 0.08);
        setTimeout(() => this.tone(220, 0.35, 'sawtooth', 0.11, -60), 90);
        setTimeout(() => this.tone(110, 0.6, 'sawtooth', 0.1, -30), 260);
        break;
      case 'chest':   [523, 659, 784].forEach((f, i) => setTimeout(() => this.tone(f, 0.1, 'square', 0.05), i * 70)); break;
      // conquista: fanfarra + brilho — usado por marcos de pets e pela
      // conclusão da missão principal, distinto do 'level' comum
      case 'conquista':
        [784, 988, 1319].forEach((f, i) => setTimeout(() => this.tone(f, 0.12, 'triangle', 0.07), i * 90));
        setTimeout(() => [1568, 1396, 1245, 1109, 988].forEach((f, i) => setTimeout(() => this.tone(f, 0.08, 'sine', 0.05), i * 40)), 300);
        break;
    }
  },
  // trilhas: [semitom midi ou 0=pausa]
  // Escala hirajoshi (D F G A C) — sonoridade tradicional japonesa
  WORLD: { notes: [62, 65, 67, 69, 72, 69, 67, 65, 62, 65, 69, 67, 65, 62, 60, 62], step: 0.32, type: 'triangle', vol: 0.030, bass: [50, 0, 45, 0] },
  // Escala in-sen, tensa e rápida para o combate
  BATTLE: { notes: [62, 63, 67, 62, 69, 67, 63, 62, 67, 69, 70, 69, 67, 63, 62, 60], step: 0.15, type: 'square', vol: 0.028, bass: [50, 50, 46, 48] },
  // Kumoi esparsa e sombria para a caverna
  CAVE: { notes: [62, 0, 63, 0, 67, 0, 69, 0, 67, 0, 63, 0, 62, 0, 58, 0], step: 0.36, type: 'triangle', vol: 0.028, bass: [50, 0, 46, 0] },
  // registro grave e agressivo, mais rápido que BATTLE — só toca contra chefes
  BOSS: { notes: [50, 50, 57, 55, 58, 57, 53, 50, 55, 58, 62, 58, 57, 53, 50, 48], step: 0.13, type: 'sawtooth', vol: 0.032, bass: [38, 38, 34, 36] },
  setTrack(t) { if (this.track !== t) { this.track = t; this.musicStep = 0; this.musicTimer = 0; } },
  update(dt) {
    if (!this.ctx || this.muted || !this.track || !SETTINGS.musica) return;
    this.musicTimer -= dt;
    if (this.musicTimer <= 0) {
      const tr = this.track;
      this.musicTimer = tr.step;
      const n = tr.notes[this.musicStep % tr.notes.length];
      if (n) this.tone(440 * Math.pow(2, (n - 69) / 12), tr.step * 0.9, tr.type, tr.vol);
      const b = tr.bass[Math.floor(this.musicStep / 4) % tr.bass.length];
      if (b && this.musicStep % 2 === 0) this.tone(440 * Math.pow(2, (b - 69) / 12), tr.step * 0.8, 'triangle', tr.vol * 0.9);
      this.musicStep++;
    }
  }
};
// trilhas por região do overworld — Vila Sakuramura fica de fora (usa
// AU.WORLD, o tema padrão, já que é a vila natal do jogador); as outras 6
// regiões marcadas em REGIONS (world.js) ganham trilha própria, trocada
// em updateWorld() no mesmo ponto que já detecta a troca de região pro toast
const REGION_TRACKS = {

  'Bosque de Bambu': { notes: [69, 0, 72, 0, 74, 72, 69, 0, 67, 0, 69, 72, 69, 0, 67, 65], step: 0.34, type: 'triangle', vol: 0.026, bass: [45, 0, 50, 0] },
  'Templo Abandonado': { notes: [58, 0, 0, 60, 0, 58, 0, 55, 0, 0, 58, 0, 60, 0, 58, 0], step: 0.4, type: 'triangle', vol: 0.026, bass: [43, 0, 38, 0] },
  'Floresta de Aokigahara': { notes: [61, 0, 0, 0, 63, 0, 61, 0, 0, 58, 0, 61, 0, 0, 0, 60], step: 0.42, type: 'sine', vol: 0.024, bass: [37, 0, 0, 39] },
  'Planalto do Norte': { notes: [69, 72, 74, 76, 74, 72, 69, 67, 69, 72, 74, 72, 69, 67, 65, 67], step: 0.26, type: 'triangle', vol: 0.030, bass: [45, 0, 50, 0] },
  'Campos de Arroz': { notes: [64, 67, 69, 67, 64, 62, 64, 67, 69, 72, 69, 67, 64, 62, 60, 62], step: 0.30, type: 'triangle', vol: 0.028, bass: [40, 0, 45, 0] }
};

// ---------- Opções (persistidas à parte do save do personagem — valem
// mesmo antes de começar um jogo, e sobrevivem a Novo Jogo/Continuar) ----------
const SETTINGS_KEY = 'forged_legend_settings_v1';
const SETTINGS = { brilho: 1, volume: 1, particulas: true, musica: true };
function aplicaBrilho() { cv.style.filter = 'brightness(' + SETTINGS.brilho + ')'; }

  try {
    const d = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (d) Object.assign(SETTINGS, d);

}

// ciclo de caminhada: neutro → passo A → neutro → passo B
const WALK_CYCLE = ['N', 'A', 'N', 'B'];

// + cabelo + peitoral + elmo + arma equipada. A arma define a CLASSE; o resto

  { name: 'Clara',   S: '#f8d0a8', s: '#e0a878', b: '#f0a0a0' },

  { name: 'Castanho', I: '#7a4a2a' }, { name: 'Azul', I: '#3a6ad0' },
  { name: 'Verde',    I: '#3a9a5a' }, { name: 'Âmbar', I: '#c08a20' },
  { name: 'Cinza',    I: '#6a7a8a' }, { name: 'Rubro', I: '#a83a3a' }

// teto da mochila de pets — só vale para fontes de sorte (drop de mob,
// baú, pesca, mascate). Fontes garantidas (chefe, missão, encantamento,
// marco de progresso) usam awardPet() direto e ignoram o teto de
// propósito, pra nunca travar o jogador fora de um pet ligado à história.
const PET_CAP = 20;
// entrega um pet ao jogador com feedback visual; ignora se ele já tem
function awardPet(id) {
  if (!id || !PETS[id] || !P.pets || P.pets.includes(id)) return false;
  P.pets.push(id);
  if (!P.activePet) P.activePet = id;
  toast('Novo companheiro: ' + PETS[id].name + '!');
  burstScreen(VW / 2, VH / 2, 28, {
    color: [RARITY[PETS[id].rar].color, '#fff0a0', '#ffffff'], spdMax: 100, lifeMax: 1, size: 2, drag: 2.4
  });
  AU.sfx('conquista');
  saveGame();
  return true;
}
// mesma coisa, mas para fontes de sorte: se a mochila de pets já está
// no teto, avisa em vez de dar silenciosamente
function awardPetChance(id) {
  if (!id || !PETS[id] || !P.pets || P.pets.includes(id)) return false;
  if (P.pets.length >= PET_CAP) { toast('Mochila de pets cheia — um filhote fugiu!'); AU.sfx('back'); return false; }
  return awardPet(id);
}

  if (G.stats.kills >= 30) awardPet('ishiko');
  if (G.flags.reislime && G.flags.necromante && G.flags.dragao) awardPet('genbu');
  if (SLOTS.every(s => P.equip[s] && RAR_KEYS.indexOf(EQUIP[P.equip[s]].rar) >= RAR_KEYS.indexOf('epico'))) awardPet('kotodama');
}

function weaponType() { const w = P.equip.arma; return w ? EQUIP[w].wtype : null; }

// ---------- Encantamento ----------
const ENCH_MAX = 5;
function enchLvl(id) { return (P.ench && P.ench[id]) || 0; }
function enchCost(id) { return (RAR_KEYS.indexOf(EQUIP[id].rar) + 1) * (enchLvl(id) + 1) * 4; }
// a partir de +3 o encanto também pede material de forja
function enchMatCost(id) {
  const l = enchLvl(id);
  if (l < 2) return null;
  if (l === 2) return { mat: MAT_BY_SLOT[EQUIP[id].slot] || 'ferro', n: 2 };
  if (l === 3) return { mat: 'jade', n: 2 };
  return { mat: 'escama', n: 1 };
}
function matQty(k) { return (P.mats && P.mats[k]) || 0; }
function addMats(m) {
  if (!P.mats) P.mats = emptyMats();
  for (const [k, v] of Object.entries(m || {})) P.mats[k] = (P.mats[k] || 0) + v;
}
// ---------- Desmontar equipamento ----------
// devolve fragmentos + materiais; encantos investidos voltam em parte
function dismantleYield(id) {
  const eq = EQUIP[id];
  const ri = RAR_KEYS.indexOf(eq.rar);
  const l = enchLvl(id);
  const mats = {};
  const prim = MAT_BY_SLOT[eq.slot] || 'ferro';
  mats[prim] = 1 + ri;
  if (ri >= 2) mats.jade = (mats.jade || 0) + (ri - 1);
  if (ri >= 4) mats.escama = (mats.escama || 0) + 1;
  return { frags: [1, 3, 6, 12, 24][ri] + l * 3, mats };
}
function matsText(m) {
  return Object.entries(m).filter(([, v]) => v > 0).map(([k, v]) => MATS[k].short + ' x' + v).join(' · ');
}
function eqName(id) { const l = enchLvl(id); return EQUIP[id].name + (l ? ' +' + l : ''); }
// bônus do item multiplicado por 1 + 0.15 por nível de encantamento
function enchBonus(id) {
  const f = 1 + 0.15 * enchLvl(id);
  const out = {};
  for (const [k, v] of Object.entries(EQUIP[id].bonus)) {
    out[k] = k === 'crit' ? v * f : Math.ceil(v * f);
  }
  return out;
}

// status efetivos = base (pontos) + equipamentos (com encantos) + bônus de conjunto
function eff() {
  const e = { atk: P.atk, def: P.def, mag: P.mag, spd: P.spd, crit: P.crit, maxHp: P.maxHp, maxMp: P.maxMp };
  for (const slot of SLOTS) {
    const id = P.equip[slot];
    if (!id) continue;
    const b = enchBonus(id);
    if (b.atk) e.atk += b.atk;
    if (b.def) e.def += b.def;
    if (b.mag) e.mag += b.mag;
    if (b.spd) e.spd += b.spd;
    if (b.crit) e.crit += b.crit;
    if (b.hp) e.maxHp += b.hp;
    if (b.mp) e.maxMp += b.mp;
  }
  // bônus passivo do pet ativo
  if (P.activePet && PETS[P.activePet]) {
    const b = PETS[P.activePet].passive;
    if (b.atk) e.atk += b.atk;
    if (b.def) e.def += b.def;
    if (b.mag) e.mag += b.mag;
    if (b.spd) e.spd += b.spd;
    if (b.crit) e.crit += b.crit;
    if (b.hp) e.maxHp += b.hp;
    if (b.mp) e.maxMp += b.mp;
  }
  if (setActive()) {
    const t = weaponType();
    if (t === 'espada') { e.atk = Math.round(e.atk * 1.15); e.def = Math.round(e.def * 1.10); }
    if (t === 'cajado') { e.mag = Math.round(e.mag * 1.15); e.maxMp = Math.round(e.maxMp * 1.10); }
    if (t === 'adaga')  { e.atk = Math.round(e.atk * 1.08); e.spd += 2; e.crit += 0.05; }
    if (t === 'arco')   { e.atk = Math.round(e.atk * 1.12); e.spd += 3; }
  }
  return e;
}
function clampVitals() {
  const e = eff();
  P.hp = Math.min(P.hp, e.maxHp);
  P.mp = Math.min(P.mp, e.maxMp);
}
function equipFromInv(idx) {
  const id = P.equipInv[idx];
  if (!id) return;
  const slot = EQUIP[id].slot;
  const old = P.equip[slot];
  P.equip[slot] = id;
  P.equipInv.splice(idx, 1);
  if (old) P.equipInv.push(old);
  clampVitals();
  spriteCache.clear();   // o visual acompanha o equipamento
  checaMarcosPets();
  marcaTutorial('equipar');
}

function gainXP(amt) {
  P.xp += amt;
  const ups = [];
  while (P.xp >= XP_NEXT(P.lvl)) {
    P.xp -= XP_NEXT(P.lvl);
    P.lvl++;
    P.maxHp += 4; P.maxMp += 2;      // crescimento básico
    P.pts += PTS_PER_LEVEL;          // pontos livres para distribuir
    const e = eff();
    P.hp = e.maxHp; P.mp = e.maxMp;  // cura total ao subir
    ups.push(P.lvl);
    // técnicas que este nível libera para a arma equipada
    for (const id of learnableNow(P.lvl)) {
      if (curSkills().length < MAX_SKILLS) {
        equipSkill(id);
        ups.newSkill = SKILLS[id].name;
      } else {
        // sem espaço: entra na fila para o jogador escolher o que esquecer
        G.learnQueue.push(id);
      }
    }
  }
  return ups;
}

const SAVE_KEY = 'cronicas_pixel_save_v2';
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      p: { ...P }, flags: G.flags, chests: G.chests, stats: G.stats, victoryShown: G.victoryShown
    }));
  } catch (e) {}
}
function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d || !d.p || !d.p.equip) return false;
    P = d.p;
    // compatibilidade com saves antigos
    if (P.frags === undefined) P.frags = 0;
    if (!P.mats) P.mats = emptyMats();
    else for (const k of MAT_KEYS) if (P.mats[k] === undefined) P.mats[k] = 0;
    if (!P.ench) P.ench = {};
    if (!P.pets) { P.pets = []; P.activePet = null; }
    if (!P.quests) P.quests = { ativas: {}, feitas: [], mainFlags: {}, mainPaid: {} };
    if (!P.quests.mainFlags) P.quests.mainFlags = {};
    if (!P.quests.mainPaid) P.quests.mainPaid = {};
    if (!P.mercSeed) P.mercSeed = {};
    if (!P.varas) { P.varas = ['junco']; P.vara = 'junco'; }
    if (!P.peixes) P.peixes = [];
    if (!P.look) P.look = defaultLook();
    if (P.look.barba === undefined) P.look.barba = 0;
    if (!P.skillSets) {
      // save antigo: monta o conjunto de cada caminho pelo nível alcançado
      P.skillSets = {};
      for (const wt2 of Object.keys(WEAPON_SKILLS)) {
        P.skillSets[wt2] = WEAPON_SKILLS[wt2].filter(([, l]) => P.lvl >= l)
          .slice(0, MAX_SKILLS).map(([id]) => id);
      }
      delete P.skills; delete P.known;
    }
    if (P.equip.botas === undefined) P.equip.botas = null;
    if (P.equip.luvas === undefined) P.equip.luvas = null;
    for (const k of Object.keys(ITEMS)) if (P.items[k] === undefined) P.items[k] = 0;
    if (!P.equipInv.includes('arc1') && P.equip.arma !== 'arc1' && !Object.keys(P.ench).some(k => k.startsWith('arc'))) {
      // saves antigos não tinham arco inicial
      if (P.equipInv.length < 18) P.equipInv.push('arc1');
    }
    G.flags = d.flags || { reislime: false, necromante: false, dragao: false, amanojaku: false, yamauba: false, tsuchigumo: false, aranharainha: false, tenguveterano: false, onigeneral: false };
    G.chests = d.chests || {};
    G.stats = d.stats || { kills: 0, battles: 0 };
    G.victoryShown = !!d.victoryShown;
    enterMap(P.mapName, P.x, P.y);
    G.state = 'world';
    return true;
  } catch (e) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }



// ---------- Partículas ----------
// Sistema leve: partículas do mundo (em coordenadas do mapa) e de tela (batalha/UI)
function spawnParticle(p) {
  if (!SETTINGS.particulas) return;
  G.parts.push(Object.assign({
    x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 0.5, t: 0,
    size: 1, color: '#fff', fade: true, screen: false, shrink: false
  }, p));
}
function burst(x, y, n, opts) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(opts.spdMin || 20, opts.spdMax || 60);
    spawnParticle(Object.assign({}, opts, {
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (opts.lift || 0),
      color: Array.isArray(opts.color) ? pick(opts.color) : opts.color,
      life: rnd(opts.lifeMin || 0.3, opts.lifeMax || 0.7)
    }));
  }
}
// explosão em coordenadas de tela (usada na batalha e na UI)
function burstScreen(x, y, n, opts) {
  burst(x, y, n, Object.assign({ screen: true }, opts));
}
function updateParticles(dt) {
  for (const p of G.parts) {
    p.t += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.g * dt;
    if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
  }
  G.parts = G.parts.filter(p => p.t < p.life);
  if (G.parts.length > 260) G.parts.splice(0, G.parts.length - 260);
}
function drawParticles(screenLayer) {
  for (const p of G.parts) {
    if (!!p.screen !== !!screenLayer) continue;
    const k = 1 - p.t / p.life;
    // entra suave (evita o "pipoco" de ponto sólido no primeiro quadro) e
    // sai suave como antes
    const fadeIn = p.fade ? clamp(p.t / Math.min(0.15, p.life * 0.3), 0, 1) : 1;
    const fadeOut = p.fade ? clamp(k * 1.4, 0, 1) : 1;
    ctx.globalAlpha = fadeIn * fadeOut;
    const s = p.shrink ? Math.max(1, Math.round(p.size * k)) : p.size;
    ctx.fillStyle = p.color;
    let px, py;
    if (p.screen) { px = p.x; py = p.y; }
    else if (R3.ligado) {
      const q = R3.projeta(p.x / TILE, 0.5 + (p.h || 0.35), p.y / TILE);
      if (q.atras) continue;
      px = q.x; py = q.y;
    } else { px = p.x - G.camX; py = p.y - G.camY; }
    ctx.fillRect(Math.round(px), Math.round(py), s, s);
  }
  ctx.globalAlpha = 1;
}

// ---------- Fade / efeitos ----------
function fadeTo(cb) {
  if (G.fadeDir !== 0) return;
  G.fadeDir = 1; G.fadeCb = cb; G.fadeT = 0;
}
// suaviza a curva (ease-in-out) sem mudar a duração real da transição —
// G.fadeT é o progresso linear (o que decide quando o callback dispara),
// G.fade é só o alfa desenhado, derivado dele
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function updateFade(dt) {
  if (G.fadeDir === 1) {
    G.fadeT = Math.min(1, (G.fadeT || 0) + dt * 3);
    G.fade = easeInOutCubic(G.fadeT);
    if (G.fadeT >= 1) { if (G.fadeCb) G.fadeCb(); G.fadeCb = null; G.fadeDir = -1; G.fadeT = 0; }
  } else if (G.fadeDir === -1) {
    G.fadeT = Math.min(1, (G.fadeT || 0) + dt * 3);
    G.fade = 1 - easeInOutCubic(G.fadeT);
    if (G.fadeT >= 1) { G.fade = 0; G.fadeDir = 0; }
  }
}
// telas de UI (menu, loja, altar, diálogos) ganham um véu curto ao abrir,
// em vez de aparecer instantaneamente — puramente visual, não atrasa a
// troca de estado em si (G.state já mudou no mesmo frame do input)
const VEIL_STATES = new Set(['menu', 'shop', 'enchant', 'confirm', 'quest', 'learn', 'questlog', 'options']);
const VEIL_DUR = 0.18;
function drawStateVeil() {
  if (!VEIL_STATES.has(G.state) || G.stateT >= VEIL_DUR) return;
  const k = 1 - easeInOutCubic(clamp(G.stateT / VEIL_DUR, 0, 1));
  ctx.fillStyle = 'rgba(6,4,12,' + (k * 0.55) + ')';
  ctx.fillRect(0, 0, VW, VH);
}
function addFloater(x, y, txt, color) {
  G.floaters.push({ x, y, txt, color, t: 0 });
}
function toast(txt) { G.toasts.push({ txt, t: 0 }); }
function showMsg(txt) { G.msgQueue.push(txt); G.msgChar = 0; }

// espécie predominante por região do mapa (com variação para não ficar uniforme)
function treeSpecies(tx, ty) {
  const r = hash2(tx * 31 + 7, ty * 17 + 3);
  // Bosque de Bambu (oeste, sul do rio): bambu com alguns pinheiros
  if (tx <= 30 && ty >= 30) return r < 0.78 ? 1 : 2;
  // Floresta de Aokigahara (leste): pinheiros densos e escuros
  if (tx >= 54 && ty >= 32) return r < 0.8 ? 2 : 1;
  // Planalto do Norte: pinheiros de montanha
  if (ty <= 28) return r < 0.6 ? 2 : (r < 0.85 ? 0 : 1);
  // Campos e vilas: sakura em flor
  return r < 0.72 ? 0 : (r < 0.9 ? 2 : 1);
}

// ---------- Desenho: mundo ----------
function desenhaPersonagens2D(sx, sy) {

  // sombra elíptica reutilizável
  const shadow = (cx, cy, rx, alpha) => {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, Math.max(1.5, rx * 0.38), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  };

  // pet seguidor (atrás das entidades)
  if (P.activePet && G.petX !== undefined) {
    const spr = petSprite(P.activePet);
    const pex = Math.round(G.petX - sx) + 2, pey = Math.round(G.petY - sy) + 2;
    const pbob = Math.round(Math.sin(G.time * 4) * 1.5);
    shadow(pex + 6, pey + 12, 5, 0.22);
    ctx.drawImage(spr, pex, pey - pbob);
  }

  for (const n of (G.npcs || [])) {
    const nx = Math.round(n.x) - sx, ny = Math.round(n.y) - sy;
    if (nx < -24 || ny < -24 || nx > VW + 24 || ny > VH + 24) continue;
    shadow(nx + 8, ny + 15, 5.5, 0.26);
    ctx.drawImage(npcSprite(n, n.dir, n.frame), nx, ny - 4);
    const d = Math.hypot(n.x - P.x, n.y - P.y);
    if (d < TILE * 7) desenhaMarcaNPC(n, nx + 8, ny - 8, d);
  }
  // entidades ordenadas por y (profundidade)
  const ents = [...G.entities, P].sort((a, b) => a.y - b.y);
  for (const e of ents) {
    const ex = Math.round(e.x) - sx, ey = Math.round(e.y) - sy;
    if (ex < -24 || ey < -24 || ex > VW + 24 || ey > VH + 24) continue;
    if (e === P) {
      // respiração quando parado; leve inclinação ao correr
      const idleBob = P.moving ? 0 : Math.round(Math.sin(G.time * 2.2) * 0.5);
      shadow(ex + 8, ey + 15, P.moving ? 6 : 5.5, 0.28);
      ctx.drawImage(heroSprite(curClass(), P.dir, P.frame), ex, ey - 4 + idleBob);
    } else {
      const bob = e.type === 'morcego' ? Math.round(Math.sin(e.animT * 6) * 2)
        : e.isBoss ? Math.round(Math.sin(e.animT * 2) * 1.5)
        : (Math.floor(e.animT * 4) % 2);
      shadow(ex + 8, ey + 15, e.isBoss ? 9 : 6, 0.28);
      // chefes pulsam com uma aura
      if (e.isBoss) {
        const aura = 0.12 + Math.sin(G.time * 3) * 0.06;
        ctx.globalAlpha = aura;
        ctx.fillStyle = e.type === 'dragao' ? '#e05050' : e.type === 'necromante' ? '#b06ae8' : '#4ec065';
        ctx.beginPath();
        ctx.ellipse(ex + 8, ey + 8, 16, 14, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.drawImage(enemySprite(e.type), ex, ey - (e.isBoss ? 6 : 0) - bob);
      // indicador de nível para inimigos próximos
      const dist = Math.hypot(e.x - P.x, e.y - P.y);
      if (dist < TILE * 5.5) {
        const alerta = dist < TILE * 4.5;
        ctx.globalAlpha = alerta ? 1 : 0.65;
        ctx.fillStyle = e.lvl > P.lvl + 1 ? '#ff6a5a' : (e.lvl < P.lvl ? '#8a8a9a' : '#e8e060');
        ctx.font = '7px monospace';
        ctx.fillText('Nv' + e.lvl, ex + 1, ey - 2);
        ctx.globalAlpha = 1;
        // "!" quando o inimigo está perseguindo
        if (alerta) {
          ctx.fillStyle = '#ff5a5a';
          ctx.font = 'bold 8px monospace';
          ctx.fillText('!', ex + 18, ey - 2 + Math.round(Math.sin(G.time * 8) * 1));
        }
      }
    }
  }
}


// telas que aparecem por cima do mundo 3D; as demais (título, criação,
// game over) são puramente 2D e escondem a cena
const ESTADOS_3D = new Set(['world', 'menu', 'shop', 'enchant', 'learn', 'confirm', 'quest', 'questlog', 'battle', 'pescando', 'peixaria']);
// 'options' pode abrir tanto do mundo (cena 3D deve continuar atrás) quanto
// do título (sem cena nenhuma pra mostrar) — depende de onde veio, então não
// dá pra ser um estado fixo no set acima
function estado3DAtivo() { return ESTADOS_3D.has(G.state) || (G.state === 'options' && G.optFrom && G.optFrom !== 'title'); }
// marcador flutuante do NPC: ◈ missão nova, ✓ pronta para entregar, $ mascate
function desenhaMarcaNPC(n, sx, sy, dist) {
  let marca = null, cor = '#a89ac0';
  if (n.tipo === 'quest') {
    const pronta = questAtivas().some(id => QUESTS[id].npc === n.id && questCompleta(id));
    const nova = questOferecida(n.id);
    if (pronta) { marca = '✓'; cor = '#ffd94e'; }
    else if (nova && P.lvl >= QUESTS[nova].nivel) { marca = '◈'; cor = '#6ee86e'; }
    else marca = '·';
  } else if (n.tipo === 'viajante') { marca = '$'; cor = '#ffd94e'; }
  const flut = Math.round(Math.sin(G.time * 3 + n.x) * 1.5);
  ctx.textAlign = 'center';
  if (marca && marca !== '·') {
    ctx.font = 'bold 9px monospace';
    ctx.fillStyle = cor;
    ctx.fillText(marca, Math.round(sx), Math.round(sy) + flut);
  }
  if (dist < TILE * 1.6) {
    ctx.font = '7px monospace';
    ctx.fillStyle = '#e8e0f0';
    ctx.fillText(n.nome, Math.round(sx), Math.round(sy) + 12);
    ctx.fillStyle = '#8a7ab0';
    ctx.fillText('Z falar', Math.round(sx), Math.round(sy) + 20);
  }
  ctx.textAlign = 'left';
}

// Extraído para render3d/render3d.js (R3, MODELOS3, GEOS, geo3,
// escala2x/4x, desenhaMundo3D, arena de batalha em 3D).

function drawWorld(noHud) {
  const m = G.map;
  const sx = G.camX, sy = G.camY;
  if (R3.ligado) { desenhaMundo3D(m); }
  else {
    const tx0 = Math.floor(sx / TILE), ty0 = Math.floor(sy / TILE);
    ctx.fillStyle = m.name === 'cave' ? '#221e2e' : '#3f7a3a';
    ctx.fillRect(0, 0, VW, VH);
    for (let ty = ty0; ty <= ty0 + Math.ceil(VH / TILE); ty++) {
      for (let tx = tx0; tx <= tx0 + Math.ceil(VW / TILE); tx++) {
        const t = tileAt(m, tx, ty);
        drawTile(t, tx * TILE - sx, ty * TILE - sy, tx, ty, m);
      }
    }
    desenhaPersonagens2D(sx, sy);
  }
  // partículas na frente dos personagens
  drawParticles(false);

  // atmosfera por região: escurecimento e tinta de cor (no 3D quem faz isso
  // são a névoa e a luz da cena)
  if (R3.ligado) { /* névoa 3D */ }
  else if (m.name === 'cave') {
    const grd = ctx.createRadialGradient(VW / 2, VH / 2, 46, VW / 2, VH / 2, 190);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(4,2,16,0.62)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, VW, VH);
  } else if (!R3.ligado && G.region === 'Templo Abandonado') {
    ctx.fillStyle = 'rgba(50,35,80,0.34)';
    ctx.fillRect(0, 0, VW, VH);
    const grd = ctx.createRadialGradient(VW / 2, VH / 2, 60, VW / 2, VH / 2, 200);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(20,10,40,0.4)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);
  } else if (!R3.ligado && (G.region === 'Bosque de Bambu' || G.region === 'Floresta de Aokigahara')) {
    ctx.fillStyle = 'rgba(20,60,30,0.16)';
    ctx.fillRect(0, 0, VW, VH);
    const grd = ctx.createRadialGradient(VW / 2, VH / 2, 70, VW / 2, VH / 2, 200);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(6,24,10,0.35)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);
  }
  if (!noHud) { drawWorldHUD(); drawQuestHUD(); drawSetaGuia(); drawMainQuestHUD(); }
}

function barRect(x, y, w, h, pct, fg, bg) {
  ctx.fillStyle = '#0e0c16';
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = bg || '#3a3448';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fg;
  ctx.fillRect(x, y, Math.round(w * clamp(pct, 0, 1)), h);
}

function drawWorldHUD() {
  // painel
  ctx.fillStyle = 'rgba(12,10,20,0.82)';
  ctx.fillRect(3, 3, 96, 46);
  ctx.strokeStyle = '#5a4a8a'; ctx.lineWidth = 1;
  ctx.strokeRect(3.5, 3.5, 95, 45);
  const E = eff();
  ctx.font = '7px monospace';
  ctx.fillStyle = '#e8e0f0';
  ctx.fillText(className() + '  Nv.' + P.lvl, 8, 12);
  barRect(8, 16, 62, 4, P.hp / E.maxHp, P.hp / E.maxHp < 0.3 ? '#e05050' : '#50c060');
  ctx.fillStyle = '#cfc8e0'; ctx.fillText(P.hp + '/' + E.maxHp, 73, 21);
  barRect(8, 24, 62, 3, P.mp / E.maxMp, '#5080e0');
  ctx.fillStyle = '#cfc8e0'; ctx.fillText('' + P.mp, 73, 28);
  // barra de XP sempre visível — mais grossa que antes (era só um traço de
  // 2px) e com o valor numérico, no mesmo padrão de HP/MP
  barRect(8, 33, 62, 4, P.xp / XP_NEXT(P.lvl), '#e8c050');
  ctx.fillStyle = '#b8a8d8'; ctx.fillText(P.xp + '/' + XP_NEXT(P.lvl), 73, 38);
  ctx.fillStyle = '#ffd94e';
  ctx.fillText('$' + P.gold, 8, 46);
  if (P.pts > 0) {
    // aviso discreto de pontos disponíveis: pulsa de leve pra chamar
    // atenção sem virar um alerta grande na tela
    const pulse = 0.55 + Math.sin(G.time * 4) * 0.35;
    ctx.fillStyle = 'rgba(110,232,110,' + pulse.toFixed(2) + ')';
    ctx.fillText('+' + P.pts + ' pts (C)', 40, 46);
  }
  // HP baixo: vinheta
  if (P.hp / E.maxHp < 0.25) {
    const a = 0.15 + Math.sin(G.time * 6) * 0.08;
    ctx.fillStyle = 'rgba(200,30,30,' + a + ')';
    ctx.fillRect(0, 0, VW, 3); ctx.fillRect(0, VH - 3, VW, 3);
    ctx.fillRect(0, 0, 3, VH); ctx.fillRect(VW - 3, 0, 3, VH);
  }
}

// ---------- Animações de combate e tela de batalha ----------
// Extraído para battle/battle.js (motor de batalha completo: técnicas,
// turnos, dano, animações e desenho da tela de combate).

// ---------- Telas de UI e pesca ----------
// Extraído para ui/screens.js (título, menu de pausa/equipamento,
// criação de personagem, aprender técnica, game over, vitória,
// diálogo, confirmação genérica, pesca e mapa interativo).

// ---------- Loop principal ----------
let lastT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  G.time += dt;
  if (G.state !== G._prevState) { G.stateT = 0; G._prevState = G.state; }
  else G.stateT = (G.stateT || 0) + dt;
  if (P) updateMainQuest();
  AU.update(dt);
  updateFade(dt);

  // update
  if (G.fadeDir === 0 || G.fade < 1) {
    if (G.msgQueue.length && (G.state === 'world')) {
      updateDialog();
    } else {
      switch (G.state) {
        case 'title': updateTitle(); break;
        case 'codex': updateCodex(); break;
        case 'world': if (G.fadeDir === 0) updateWorld(dt); break;
        case 'battle': updateBattle(dt); break;
        case 'menu': updatePauseMenu(); break;
        case 'shop': updateShop(); break;
        case 'enchant': updateEnchant(); break;
        case 'confirm': updateConfirm(); break;
        case 'quest': updateQuestOferta(); break;
        case 'questlog': updateQuestLog(); break;
        case 'options': updateOptions(); break;
        case 'pescando': updatePesca(dt); break;
        case 'peixaria': updatePeixaria(); break;
        case 'mapa': updateMapa(); break;
        case 'learn': updateLearn(); break;
        case 'create': updateCreate(); break;
        case 'intro': updateIntro(dt); break;
        case 'gameover': updateGameOver(); break;
        case 'victory': updateVictory(); break;
      }
    }
  }
  if (G.battleFlash > 0) G.battleFlash = Math.max(0, G.battleFlash - dt * 3.2);
  // partículas e ambiente
  updateParticles(dt);
  if (G.state === 'world' && G.map) { updateAmbient(dt); updateNPCs(dt); }

  // floaters
  for (const f of G.floaters) f.t += dt;
  G.floaters = G.floaters.filter(f => f.t < 1.2);
  for (const t of G.toasts) t.t += dt;
  G.toasts = G.toasts.filter(t => t.t < 2);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);

  // draw
  if (R3.ok) R3.mostra(estado3DAtivo());
  ctx.save();
  if (G.shake > 0.5) ctx.translate(irnd(-G.shake, G.shake) * 0.5, irnd(-G.shake, G.shake) * 0.5);
  switch (G.state) {
    case 'title': drawTitle(); break;
    case 'codex': drawCodex(); break;
    case 'world': drawWorld(); break;
    case 'battle': drawBattle(); break;
    case 'menu': drawPauseMenu(); break;
    case 'shop': drawShop(); break;
    case 'enchant': drawEnchant(); break;
    case 'confirm': drawConfirm(); break;
    case 'quest': drawQuestOferta(); break;
    case 'questlog': drawQuestLog(); break;
    case 'options': drawOptions(); break;
    case 'pescando': drawPesca(); break;
    case 'peixaria': drawPeixaria(); break;
    case 'mapa': drawMapa(); break;
    case 'learn': drawLearn(); break;
    case 'create': drawCreate(); break;
    case 'intro': drawIntro(); break;
    case 'gameover': drawGameOver(); break;
    case 'victory': drawVictory(); break;
  }
  // floaters do mundo
  if (G.state === 'world' || G.state === 'menu') {
    for (const f of G.floaters) {
      ctx.font = 'bold 8px monospace';
      ctx.globalAlpha = f.t > 0.8 ? (1.2 - f.t) / 0.4 : 1;
      ctx.fillStyle = '#0e0c16';
      ctx.fillText(f.txt, f.x - G.camX + 1, f.y - G.camY - f.t * 18 + 1);
      ctx.fillStyle = f.color;
      ctx.fillText(f.txt, f.x - G.camX, f.y - G.camY - f.t * 18);
      ctx.globalAlpha = 1;
    }
  }
  if (G.msgQueue.length && G.state === 'world') drawDialog();
  drawStateVeil();
  // toasts
  if (G.state !== 'battle') G.toasts.forEach((t, i) => {
    ctx.font = '7px monospace';
    ctx.globalAlpha = t.t > 1.5 ? (2 - t.t) / 0.5 : 1;
    ctx.fillStyle = 'rgba(12,10,22,0.9)';
    const tw = ctx.measureText(t.txt).width;
    ctx.fillRect(VW / 2 - tw / 2 - 4, 6 + i * 14, tw + 8, 11);
    ctx.fillStyle = '#f0e8f8';
    ctx.fillText(t.txt, VW / 2 - tw / 2, 14 + i * 14);
    ctx.globalAlpha = 1;
  });
  ctx.restore();

  if (G.fade > 0) {
    ctx.fillStyle = 'rgba(6,4,12,' + G.fade + ')';
    ctx.fillRect(0, 0, VW, VH);
  }

  // blit para tela
  mainCtx.imageSmoothingEnabled = false;
  mainCtx.clearRect(0, 0, cv.width, cv.height);
  mainCtx.drawImage(buf, 0, 0);

  // toques que ninguém consumiu envelhecem e caem fora, para uma tecla que a
  // tela atual ignora não travar a fila
  for (const e of filaToques) e.idade++;
  filaToques = filaToques.filter(e => e.idade < 8);
  requestAnimationFrame(frame);
}
loadSettings();
// Liga a cena 3D. Se o navegador não tiver WebGL, o jogo segue no
// renderizador 2D original sem perder nada.
if (!R3.init()) console.warn('WebGL indisponível: usando o renderizador 2D');
requestAnimationFrame(frame);

// ---------- Hooks de depuração/teste (não usados no jogo normal) ----------
window.DBG = {
  get G() { return G; },
  get P() { return P; },
  start() {
    P = newPlayer();
    MAPS.overworld = genOverworld(); MAPS.cave = genCave();
    enterMap('overworld', START.x, START.y);
    G.state = 'world';
  },
  teleport(tx, ty) { P.x = tx * TILE; P.y = ty * TILE; },
  battle(type, lvl) {
    const e = makeEntity(type || 'slime', P.x + 20, P.y, lvl || 1, ENEMIES[type] && ENEMIES[type].boss);
    G.entities.push(e);
    startBattle(e);
  },
  addXP(n) { return gainXP(n); },
  addFrags(n) { P.frags += n; },
  addMats(m) { addMats(m); },
  mats() { return P.mats; },
  matCatalog() { return MATS; },
  dismantleYield(id) { return dismantleYield(id); },
  dismantle(idx) { return dismantleFromInv(idx); },
  enchLvl(id) { return enchLvl(id); },
  enchCost(id) { return enchCost(id); },
  enchMatCost(id) { return enchMatCost(id); },
  canEnchant(id) { return canEnchant(id); },
  altarList() { return altarList(); },
  setAltarMode(m) { G.altarMode = m; G.menuIdx = 0; },
  enemies() { return ENEMIES; },
  rollMats(type, lvl) { return rollMats(type, lvl); },
  givePet(id) { if (!P.pets.includes(id)) P.pets.push(id); },
  setPet(id) { P.activePet = id; clampVitals(); },
  eff() { return eff(); },
  equip(idx) { equipFromInv(idx); },
  giveEquip(id) { return addEquipToInv(id); },
  loot(type) { return rollLoot(type); },
  shopStock(id) { return SHOP_STOCK[id]; },
  items() { return ITEMS; },
  tileCache() { return tileVarCache.size; },
  actions() { return battleActions(); },
  clearSprites() { spriteCache.clear(); },
  save() { saveGame(); },
  curSkills() { return curSkills(); },
  setSkills(arr) { const t = weaponType(); if (t) P.skillSets[t] = arr.slice(); },
  battleSprite(c,p) { return battleSprite(c,p); },
  skills() { return SKILLS; },
  weaponSkills() { return WEAPON_SKILLS; },
  heroSprite(cls, dir, frame) { return heroSprite(cls, dir, frame); },
  pets() { return PETS; },
  equipCatalog() { return EQUIP; },
  applyEnemyHit(b) { return applyEnemyHit(b); },
  clearEnemies() { G.entities = G.entities.filter(e => e.isBoss); G.spawnTimer = 60; },
  clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
  r3() { return { ok: R3.ok, ligado: R3.ligado, mapa: R3.mapaNome,
    malhas: R3.grupoMapa ? R3.grupoMapa.children.length : 0,
    billboards: [...R3.bill.keys()].filter(k => R3.bill.get(k).visible),
    chamadas: R3.rend ? R3.rend.info.render.calls : 0,
    triangulos: R3.rend ? R3.rend.info.render.triangles : 0,
    cam: R3.cam ? [+R3.cam.position.x.toFixed(2), +R3.cam.position.y.toFixed(2), +R3.cam.position.z.toFixed(2)] : null }; },
  r3Zoom(f) { R3.zoom = f; R3.aplicaZoom(f); },
  r3Inc(v) { R3.inc = v; },
  r3Force2D(v) { R3.forcado2D = v; if (v) R3.mostra(false); },
  filaVazia() { return filaToques.length === 0; },
  npcs() { return G.npcs; },
  npcPerto() { return npcPerto(); },
  quests() { return QUESTS; },
  questAtivas() { return P.quests.ativas; },
  questFeitas() { return P.quests.feitas; },
  questOferecida(id) { return questOferecida(id); },
  aceitaQuest(id) { aceitaQuest(id); },
  desistirQuest(id) { desistirQuest(id); },
  questMatou(t) { questMatou(t); },
  mainQuest() { return MAIN_QUEST_STEPS.map(s => ({ id: s.id, nome: s.nome, done: mainStepDone(s.id) })); },
  marcaTutorial(id) { marcaTutorial(id); },
  // marca todos os passos do tutorial como já pagos, sem conceder ouro/XP —
  // usado pelo harness de testes pra isolar checks de recompensa (ex.:
  // "entregar a missão paga ouro") do sistema de tutorial, que também paga
  // ouro em segundo plano conforme o jogador usa cada sistema do jogo
  skipTutorial() { for (const s of MAIN_QUEST_STEPS) P.quests.mainPaid[s.id] = true; },
  skipIntro() { skipIntro(); },
  questFoco() { return questFoco(); },
  alvoDaQuest(id) { return alvoDaQuest(id); },
  estoqueMascate(id) { const n = G.npcs.find(v => v.id === id); return n ? estoqueMascate(n) : null; },
  precoMascate(s2, m) { return precoMascate(shopEntryBase(s2), m); },
  shopEntry(s2) { return shopEntry(s2); },
  irPara(id) { const n = G.npcs.find(v => v.id === id); if (n) { P.x = n.x; P.y = n.y + TILE; P.dir = 'up'; } return !!n; },
  varas() { return VARAS; },
  peixes() { return PEIXES; },
  meusPeixes() { return P.peixes; },
  minhasVaras() { return P.varas; },
  comprarVara(id) { return comprarVara(id); },
  equiparVara(id) { P.vara = id; },
  iniciaPesca() { iniciaPesca(); },
  rollPeixe(tier) { return rollPeixe(tier); },
  pescaFisgar() {
    if (G.pesca && G.pesca.fase === 'espera') iniciaFisgada(G.pesca);
  },
  pescaEstado() { return G.pesca; },
  // hooks só de teste: resolvem a fisgada (vitória ou fuga) na hora, sem
  // depender da barra de habilidade real nem do relógio real (o ambiente de
  // teste roda WebGL por software e pode ficar bem lento/instável pra jogar
  // o minigame de verdade de forma determinística)
  pescaVence() {
    if (!G.pesca || G.pesca.fase !== 'fisgada') return false;
    G.pesca.progresso = 1;
    updatePesca(0);
    return true;
  },
  pescaExpira() {
    if (!G.pesca) return false;
    toast('O peixe fugiu...');
    AU.sfx('back');
    G.pesca = null; G.state = 'world';
    return true;
  },
  regioes() { return REGIONS; },
  regiaoInfo(nome) { return infoDaRegiao(nome); },
  lagos() { return LAGOS; },
  mapaMouse(x, y) { return regiaoNoMapa(x, y); }
};
</script>
