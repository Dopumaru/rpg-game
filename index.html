    px(g, '#c0392b', 0, 3, TILE, 3);
    px(g, '#e05548', 0, 3, TILE, 1);
    // ponta erguida nas extremidades
    if (half === 0) { px(g, '#c0392b', 0, 1, 4, 2); px(g, '#e05548', 0, 1, 4, 1); }
    else { px(g, '#c0392b', 12, 1, 4, 2); px(g, '#e05548', 12, 1, 4, 1); }
    // nuki (travessa inferior)
    px(g, '#8f2f28', 0, 10, TILE, 3);
    px(g, '#c0392b', 0, 10, TILE, 2);
    px(g, '#e05548', 0, 10, TILE, 1);
    // pilares descendo
    const cx = half === 0 ? 3 : 10;
    px(g, '#8f2f28', cx, 7, 3, 9);
    px(g, '#c0392b', cx, 7, 2, 9);
    px(g, '#e05548', cx, 7, 1, 9);
  });
}
function bakeToriiBase(half) {
  return bakeTile('toriiB' + half, g => {
    g.drawImage(bakeGrass(3), 0, 0);
    const cx = half === 0 ? 3 : 10;
    px(g, '#8f2f28', cx, 0, 3, 14);
    px(g, '#c0392b', cx, 0, 2, 14);
    px(g, '#e05548', cx, 0, 1, 14);
    // base de pedra
    px(g, '#6e6e78', cx - 1, 13, 5, 3);
    px(g, '#8a8a94', cx - 1, 13, 5, 1);
  });
}
// --- lanterna de pedra (toro) ---
function bakeLantern() {
  return bakeTile('lantern', g => {
    g.drawImage(bakeGrass(1), 0, 0);
    px(g, '#4a4a52', 5, 13, 6, 3);
    px(g, '#6e6e78', 6, 10, 4, 4);
    px(g, '#8a8a94', 4, 6, 8, 5);
    px(g, '#3a3a42', 5, 7, 6, 3);
    px(g, '#ffd98a', 6, 8, 4, 2);
    px(g, '#fff0c0', 7, 8, 2, 1);
    px(g, '#6e6e78', 3, 4, 10, 2);
    px(g, '#8a8a94', 3, 4, 10, 1);
    px(g, '#6e6e78', 6, 2, 4, 2);
  });
}
// --- piso de pedra do templo ---
function bakeTemplePath(v) {
  return bakeTile('tpath' + v, g => {
    px(g, '#9a9384', 0, 0, TILE, TILE);
    const r = seeded(v * 71 + 23);
    for (let i = 0; i < 6; i++) px(g, '#8a8375', Math.floor(r() * 14), Math.floor(r() * 15), 2, 1);
    px(g, '#7d7668', 0, 7, TILE, 1);
    px(g, '#7d7668', 7, 0, 1, TILE);
    px(g, '#a9a294', 0, 0, TILE, 1);
    px(g, '#a9a294', 0, 8, TILE, 1);
  });
}

// espécie predominante por região do mapa (com variação para não ficar uniforme)
function treeSpecies(tx, ty) {
  const r = hash2(tx * 31 + 7, ty * 17 + 3);
  // Bosque de Bambu (oeste, sul do rio): bambu com alguns pinheiros
  if (tx <= 30 && ty >= 30) return r < 0.78 ? 1 : 2;
  // Floresta de Aokigahara (leste): pinheiros densos e escuros
  if (tx >= 54 && ty >= 32) return r < 0.8 ? 2 : 1;
  // Planalto do Norte: pinheiros de montanha
  if (ty <= 28) return r < 0.6 ? 2 : (r < 0.85 ? 0 : 1);
  // Campos e vilas: sakura em flor
  return r < 0.72 ? 0 : (r < 0.9 ? 2 : 1);
}

// tiles animados/dinâmicos ficam em funções de desenho direto
function drawWaterTile(g0, x, y, tx, ty, map) {
  const v = hash2(tx, ty);
  const ph = (G.time * 1.6 + v * 3) % 2;
  ctx.fillStyle = ph < 1 ? '#2a5a9a' : '#2e62a6';
  ctx.fillRect(x, y, TILE, TILE);
  // ondas
  ctx.fillStyle = '#3d72b6';
  const w1 = Math.floor((G.time * 8 + tx * 5 + ty * 3) % 16);
  ctx.fillRect(x + w1 % 12 + 1, y + 4, 4, 1);
  ctx.fillRect(x + (w1 + 7) % 12 + 2, y + 10, 3, 1);
  if (v < 0.35) { ctx.fillStyle = '#5a92d6'; ctx.fillRect(x + (w1 + 3) % 11 + 2, y + 7, 3, 1); }
  // espuma nas margens (autotile simples contra tiles não-água)
  const isW = (ax, ay) => tileAt(map, ax, ay) === 2;
  ctx.fillStyle = '#8ec2ea';
  if (!isW(tx, ty - 1)) ctx.fillRect(x, y, TILE, 1);
  if (!isW(tx, ty + 1)) ctx.fillRect(x, y + TILE - 1, TILE, 1);
  if (!isW(tx - 1, ty)) ctx.fillRect(x, y, 1, TILE);
  if (!isW(tx + 1, ty)) ctx.fillRect(x + TILE - 1, y, 1, TILE);
}
function drawFountainTile(x, y) {
  ctx.fillStyle = '#b09a6a'; ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#8e8ea2'; ctx.fillRect(x + 1, y + 1, 14, 14);
  ctx.fillStyle = '#6e6e82'; ctx.fillRect(x + 1, y + 1, 14, 1);
  const ph = Math.floor(G.time * 3) % 2;
  ctx.fillStyle = ph ? '#4a82c6' : '#5a92d6'; ctx.fillRect(x + 3, y + 3, 10, 10);
  ctx.fillStyle = '#8ec6f0'; ctx.fillRect(x + 6 + (ph ? 1 : 0), y + 5, 3, 3);
  ctx.fillStyle = '#c6e2f8'; ctx.fillRect(x + 7, y + 7, 2, 2);
  // jato central
  const jy = Math.floor(Math.sin(G.time * 4) * 1.5);
  ctx.fillStyle = '#d8eeff'; ctx.fillRect(x + 7, y + 2 + jy, 2, 3);
}
function drawAltarTile(x, y) {
  ctx.fillStyle = '#3f7a3a'; ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#4a4458'; ctx.fillRect(x + 2, y + 10, 12, 5);
  ctx.fillStyle = '#5c5c6e'; ctx.fillRect(x + 3, y + 9, 10, 5);
  ctx.fillStyle = '#8e8ea2'; ctx.fillRect(x + 4, y + 8, 8, 2);
  const fl = Math.sin(G.time * 3) * 1.5;
  const cy = y + 2 + Math.round(fl);
  ctx.fillStyle = 'rgba(176,106,232,0.25)'; ctx.fillRect(x + 4, cy + 1, 8, 8);
  ctx.fillStyle = '#8a3ac8'; ctx.fillRect(x + 6, cy, 4, 6);
  ctx.fillStyle = '#b06ae8'; ctx.fillRect(x + 6, cy + 1, 3, 4);
  ctx.fillStyle = '#e0b8ff'; ctx.fillRect(x + 7, cy + 2, 1, 2);
}
function drawCaveExitTile(x, y) {
  ctx.drawImage(bakeCaveFloor(0), x, y);
  const gl = 0.6 + Math.sin(G.time * 2) * 0.2;
  ctx.fillStyle = '#7a8ac0'; ctx.fillRect(x + 3, y + 3, 10, 10);
  ctx.globalAlpha = gl;
  ctx.fillStyle = '#aabce0'; ctx.fillRect(x + 4, y + 4, 8, 8);
  ctx.fillStyle = '#dce6ff'; ctx.fillRect(x + 6, y + 6, 4, 4);
  ctx.globalAlpha = 1;
}

function drawTile(t, x, y, tx, ty, map) {
  const v = hash2(tx, ty);
  switch (t) {
    case 0:  ctx.drawImage(bakeGrass(Math.floor(v * 6) % 6), x, y); break;
    case 1:  ctx.drawImage(bakeTree(treeSpecies(tx, ty), Math.floor(v * 6) % 6), x, y); break;
    case 2:  drawWaterTile(null, x, y, tx, ty, map); break;
    case 3:  ctx.drawImage(bakeDirt(Math.floor(v * 4) % 4), x, y); break;
    case 4:  ctx.drawImage(bakeFlower(Math.floor(v * 4) % 4), x, y); break;
    case 5:  ctx.drawImage(bakeStoneWall(0), x, y); break;
    case 6:  ctx.drawImage(bakeDirt(2), x, y); break;
    case 7:  ctx.drawImage(bakeBridge(), x, y); break;
    case 8:  ctx.drawImage(bakeMountain(Math.floor(hash2(tx * 13 + 2, ty * 29 + 7) * 3) % 3), x, y); break;
    case 9:  ctx.drawImage(bakeCaveFloor(Math.floor(hash2(tx * 37 + 1, ty * 19 + 9) * 4) % 4), x, y); break;
    case 10: ctx.drawImage(bakeCaveWall(Math.floor(hash2(tx * 23 + 5, ty * 41 + 11) * 8) % 8), x, y); break;
    case 11: ctx.drawImage(bakeCaveMouth(), x, y); break;
    case 12: drawCaveExitTile(x, y); break;
    case 13: drawFountainTile(x, y); break;
    case 14: ctx.drawImage(bakeShop(), x, y); break;
    case 15: ctx.drawImage(bakeSign(), x, y); break;
    case 16: ctx.drawImage(bakeChest(false, map.name === 'cave'), x, y); break;
    case 17: ctx.drawImage(bakeChest(true, map.name === 'cave'), x, y); break;
    case 18: ctx.drawImage(bakeRoof(), x, y); break;
    case 19: ctx.drawImage(bakeDoor(), x, y); break;
    case 20: ctx.drawImage(bakeGrave(Math.floor(v * 3) + 1), x, y); break;
    case 21: drawAltarTile(x, y); break;
    case 22: ctx.drawImage(bakeBush(Math.floor(v * 2)), x, y); break;
    case 23: ctx.drawImage(bakeRock(Math.floor(v * 4) % 4), x, y); break;
    case 24: ctx.drawImage(bakeMushroom(Math.floor(v * 2), map.name === 'cave'), x, y); break;
    case 25: ctx.drawImage(bakeToriiTop(0), x, y); break;
    case 26: ctx.drawImage(bakeToriiTop(1), x, y); break;
    case 29: ctx.drawImage(bakeToriiBase(0), x, y); break;
    case 30: ctx.drawImage(bakeToriiBase(1), x, y); break;
    case 27: ctx.drawImage(bakeLantern(), x, y); break;
    case 28: ctx.drawImage(bakeTemplePath(Math.floor(v * 3) % 3), x, y); break;
  }
}

// ---------- Desenho: mundo ----------
function drawWorld(noHud) {
  const m = G.map;
  const sx = G.camX, sy = G.camY;
  const tx0 = Math.floor(sx / TILE), ty0 = Math.floor(sy / TILE);
  ctx.fillStyle = m.name === 'cave' ? '#221e2e' : '#3f7a3a';
  ctx.fillRect(0, 0, VW, VH);
  for (let ty = ty0; ty <= ty0 + Math.ceil(VH / TILE); ty++) {
    for (let tx = tx0; tx <= tx0 + Math.ceil(VW / TILE); tx++) {
      const t = tileAt(m, tx, ty);
      drawTile(t, tx * TILE - sx, ty * TILE - sy, tx, ty, m);
    }
  }
  // partículas do mundo que ficam atrás dos personagens (poeira, névoa)
  drawParticles(false);

  // sombra elíptica reutilizável
  const shadow = (cx, cy, rx, alpha) => {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, Math.max(1.5, rx * 0.38), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  };

  // pet seguidor (atrás das entidades)
  if (P.activePet && G.petX !== undefined) {
    const spr = petSprite(P.activePet);
    const pex = Math.round(G.petX - sx) + 2, pey = Math.round(G.petY - sy) + 2;
    const pbob = Math.round(Math.sin(G.time * 4) * 1.5);
    shadow(pex + 6, pey + 12, 5, 0.22);
    ctx.drawImage(spr, pex, pey - pbob);
  }

  // entidades ordenadas por y (profundidade)
  const ents = [...G.entities, P].sort((a, b) => a.y - b.y);
  for (const e of ents) {
    const ex = Math.round(e.x) - sx, ey = Math.round(e.y) - sy;
    if (ex < -24 || ey < -24 || ex > VW + 24 || ey > VH + 24) continue;
    if (e === P) {
      // respiração quando parado; leve inclinação ao correr
      const idleBob = P.moving ? 0 : Math.round(Math.sin(G.time * 2.2) * 0.5);
      shadow(ex + 8, ey + 15, P.moving ? 6 : 5.5, 0.28);
      ctx.drawImage(heroSprite(curClass(), P.dir, P.frame), ex, ey - 4 + idleBob);
    } else {
      const bob = e.type === 'morcego' ? Math.round(Math.sin(e.animT * 6) * 2)
        : e.isBoss ? Math.round(Math.sin(e.animT * 2) * 1.5)
        : (Math.floor(e.animT * 4) % 2);
      shadow(ex + 8, ey + 15, e.isBoss ? 9 : 6, 0.28);
      // chefes pulsam com uma aura
      if (e.isBoss) {
        const aura = 0.12 + Math.sin(G.time * 3) * 0.06;
        ctx.globalAlpha = aura;
        ctx.fillStyle = e.type === 'dragao' ? '#e05050' : e.type === 'necromante' ? '#b06ae8' : '#4ec065';
        ctx.beginPath();
        ctx.ellipse(ex + 8, ey + 8, 16, 14, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.drawImage(enemySprite(e.type), ex, ey - (e.isBoss ? 6 : 0) - bob);
      // indicador de nível para inimigos próximos
      const dist = Math.hypot(e.x - P.x, e.y - P.y);
      if (dist < TILE * 5.5) {
        const alerta = dist < TILE * 4.5;
        ctx.globalAlpha = alerta ? 1 : 0.65;
        ctx.fillStyle = e.lvl > P.lvl + 1 ? '#ff6a5a' : (e.lvl < P.lvl ? '#8a8a9a' : '#e8e060');
        ctx.font = '7px monospace';
        ctx.fillText('Nv' + e.lvl, ex + 1, ey - 2);
        ctx.globalAlpha = 1;
        // "!" quando o inimigo está perseguindo
        if (alerta) {
          ctx.fillStyle = '#ff5a5a';
          ctx.font = 'bold 8px monospace';
          ctx.fillText('!', ex + 18, ey - 2 + Math.round(Math.sin(G.time * 8) * 1));
        }
      }
    }
  }
  // partículas na frente dos personagens
  drawParticles(false);

  // atmosfera por região: escurecimento e tinta de cor
  if (m.name === 'cave') {
    const grd = ctx.createRadialGradient(VW / 2, VH / 2, 46, VW / 2, VH / 2, 190);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(4,2,16,0.62)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, VW, VH);
  } else if (G.region === 'Templo Abandonado') {
    ctx.fillStyle = 'rgba(50,35,80,0.34)';
    ctx.fillRect(0, 0, VW, VH);
    const grd = ctx.createRadialGradient(VW / 2, VH / 2, 60, VW / 2, VH / 2, 200);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(20,10,40,0.4)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);
  } else if (G.region === 'Bosque de Bambu' || G.region === 'Floresta de Aokigahara') {
    ctx.fillStyle = 'rgba(20,60,30,0.16)';
    ctx.fillRect(0, 0, VW, VH);
    const grd = ctx.createRadialGradient(VW / 2, VH / 2, 70, VW / 2, VH / 2, 200);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(6,24,10,0.35)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);
  }
  if (!noHud) drawWorldHUD();
}

function barRect(x, y, w, h, pct, fg, bg) {
  ctx.fillStyle = '#0e0c16';
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = bg || '#3a3448';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fg;
  ctx.fillRect(x, y, Math.round(w * clamp(pct, 0, 1)), h);
}

function drawWorldHUD() {
  // painel
  ctx.fillStyle = 'rgba(12,10,20,0.82)';
  ctx.fillRect(3, 3, 96, 40);
  ctx.strokeStyle = '#5a4a8a'; ctx.lineWidth = 1;
  ctx.strokeRect(3.5, 3.5, 95, 39);
  const E = eff();
  ctx.font = '7px monospace';
  ctx.fillStyle = '#e8e0f0';
  ctx.fillText(className() + '  Nv.' + P.lvl, 8, 12);
  barRect(8, 16, 62, 4, P.hp / E.maxHp, P.hp / E.maxHp < 0.3 ? '#e05050' : '#50c060');
  ctx.fillStyle = '#cfc8e0'; ctx.fillText(P.hp + '/' + E.maxHp, 73, 21);
  barRect(8, 24, 62, 3, P.mp / E.maxMp, '#5080e0');
  ctx.fillStyle = '#cfc8e0'; ctx.fillText('' + P.mp, 73, 28);
  barRect(8, 31, 62, 2, P.xp / XP_NEXT(P.lvl), '#e8c050');
  ctx.fillStyle = '#b8a8d8'; ctx.fillText('XP', 73, 35);
  ctx.fillStyle = '#ffd94e';
  ctx.fillText('$' + P.gold, 8, 41);
  if (P.pts > 0) { ctx.fillStyle = '#6ee86e'; ctx.fillText('+' + P.pts + ' pts (C)', 40, 41); }
  // HP baixo: vinheta
  if (P.hp / E.maxHp < 0.25) {
    const a = 0.15 + Math.sin(G.time * 6) * 0.08;
    ctx.fillStyle = 'rgba(200,30,30,' + a + ')';
    ctx.fillRect(0, 0, VW, 3); ctx.fillRect(0, VH - 3, VW, 3);
    ctx.fillRect(0, 0, 3, VH); ctx.fillRect(VW - 3, 0, 3, VH);
  }
}

// ---------- Animações de combate ----------
// Desenha o efeito da técnica em curso. ex/ey = centro do inimigo,
// px/py = posição do herói. Tudo em coordenadas de tela (320x180).
const ENEMY_CX = 76, ENEMY_CY = 74, HERO_CX = 274, HERO_CY = 70;
function drawActionFX(b) {
  const a = b.act;
  if (!a) return;
  const k = clamp(a.t / a.dur, 0, 1);
  const marcos = ANIM_HITS[a.anim] || [0.5];

  switch (a.anim) {
    case 'slash': case 'slash2': case 'flurry': {
      // arcos de corte no inimigo, sincronizados com os impactos
      marcos.forEach((m, i) => {
        const dt2 = k - m;
        if (dt2 < 0 || dt2 > 0.22) return;
        const f = 1 - dt2 / 0.22;
        ctx.globalAlpha = f;
        ctx.strokeStyle = i % 2 ? '#ffd0d0' : '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const r = 30 + (1 - f) * 14, ang = -0.9 + i * 1.1;
        ctx.arc(ENEMY_CX, ENEMY_CY, r, ang, ang + 1.9);
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.globalAlpha = 1;
      });
      break;
    }
    case 'iai': {
      // saque relâmpago: carrega e corta a tela na horizontal
      if (k < 0.55) {
        ctx.globalAlpha = k * 1.2;
        ctx.fillStyle = '#ffd94e';
        ctx.fillRect(HERO_CX - 8, HERO_CY - 2, 16, 3);
      } else if (k < 0.8) {
        const f = (k - 0.55) / 0.25;
        ctx.globalAlpha = 1 - f * 0.4;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, ENEMY_CY - 2, VW * (1 - f * 0.2), 4);
        ctx.fillStyle = '#ffd94e';
        ctx.fillRect(0, ENEMY_CY - 1, VW * (1 - f * 0.2), 2);
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'fire': {
      // bola de fogo viajando e explodindo
      if (k < 0.6) {
        const f = k / 0.6;
        const fx = lerp(HERO_CX - 20, ENEMY_CX, f), fy = lerp(HERO_CY, ENEMY_CY, f);
        const r = 5 + Math.sin(G.time * 30) * 1.5;
        ctx.fillStyle = '#ff8a3a'; ctx.beginPath(); ctx.arc(fx, fy, r + 2, 0, 6.3); ctx.fill();
        ctx.fillStyle = '#ffd040'; ctx.beginPath(); ctx.arc(fx, fy, r, 0, 6.3); ctx.fill();
        ctx.fillStyle = '#fff8c0'; ctx.beginPath(); ctx.arc(fx, fy, r * 0.5, 0, 6.3); ctx.fill();
        if (Math.random() < 0.6) spawnParticle({ screen: true, x: fx, y: fy, vx: rnd(-20, 20), vy: rnd(-10, 25), life: 0.35, size: 2, color: pick(['#ff8a3a', '#ffd040']), shrink: true });
      } else {
        const f = (k - 0.6) / 0.4;
        ctx.globalAlpha = 1 - f;
        ctx.fillStyle = '#ffd040';
        ctx.beginPath(); ctx.arc(ENEMY_CX, ENEMY_CY, 12 + f * 30, 0, 6.3); ctx.fill();
        ctx.fillStyle = '#ff8a3a';
        ctx.beginPath(); ctx.arc(ENEMY_CX, ENEMY_CY, 8 + f * 22, 0, 6.3); ctx.fill();
        ctx.globalAlpha = 1;
      }
      break;
    }
    case 'ice': {
      // cristais caindo sobre o inimigo
      for (let i = 0; i < 5; i++) {
        const off = i * 0.08;
        const f = clamp((k - off) / 0.6, 0, 1);
        if (f <= 0) continue;
        const ix = ENEMY_CX - 24 + i * 12;
        const iy = lerp(-10, ENEMY_CY + 4, f);
        ctx.globalAlpha = f < 0.9 ? 1 : (1 - f) * 10;
        ctx.fillStyle = '#8ac0ff';
        ctx.beginPath();
        ctx.moveTo(ix, iy - 7); ctx.lineTo(ix + 4, iy); ctx.lineTo(ix, iy + 7); ctx.lineTo(ix - 4, iy);
        ctx.fill();
        ctx.fillStyle = '#dcf0ff';
        ctx.fillRect(ix - 1, iy - 4, 2, 8);
        ctx.globalAlpha = 1;
      }
      break;
    }
    case 'thunder': {
      // raio descendo em ziguezague
      if (k > 0.4 && k < 0.85) {
        const f = (k - 0.4) / 0.45;
        ctx.globalAlpha = f < 0.7 ? 1 : (1 - f) / 0.3;
        ctx.strokeStyle = '#fff8c0'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(ENEMY_CX, 0);
        for (let y = 0; y < ENEMY_CY; y += 12) {
          ctx.lineTo(ENEMY_CX + Math.sin(y * 0.7 + a.t * 40) * 9, y);
        }
        ctx.lineTo(ENEMY_CX, ENEMY_CY);
        ctx.stroke();
        ctx.strokeStyle = '#8ac0ff'; ctx.lineWidth = 1;
        ctx.stroke();
        ctx.globalAlpha = 1;
        // clarão
        if (f < 0.25) { ctx.fillStyle = 'rgba(255,255,220,' + (0.4 * (1 - f * 4)) + ')'; ctx.fillRect(0, 0, VW, VH); }
      }
      break;
    }
    case 'holy': {
      // coluna de luz solar
      if (k > 0.35) {
        const f = clamp((k - 0.35) / 0.6, 0, 1);
        const w = 44 * Math.sin(f * Math.PI);
        const grd = ctx.createLinearGradient(0, 0, 0, VH);
        grd.addColorStop(0, 'rgba(255,248,200,0.9)');
        grd.addColorStop(1, 'rgba(255,200,80,0.15)');
        ctx.fillStyle = grd;
        ctx.fillRect(ENEMY_CX - w / 2, 0, w, 130);
        ctx.fillStyle = 'rgba(255,255,255,' + (0.5 * Math.sin(f * Math.PI)) + ')';
        ctx.fillRect(ENEMY_CX - w / 4, 0, w / 2, 130);
      }
      break;
    }
    case 'drain': {
      // partículas de vida indo do inimigo ao herói
      if (k > 0.5 && Math.random() < 0.8) {
        spawnParticle({
          screen: true, x: ENEMY_CX + rnd(-14, 14), y: ENEMY_CY + rnd(-14, 14),
          vx: (HERO_CX - ENEMY_CX) * 0.9, vy: (HERO_CY - ENEMY_CY) * 0.9 + rnd(-20, 20),
          life: 0.4, size: 2, color: pick(['#b06ae8', '#6ee86e', '#d8a0ff'])
        });
      }
      if (k > 0.3 && k < 0.7) {
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = '#b06ae8'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(ENEMY_CX, ENEMY_CY); ctx.lineTo(HERO_CX - 16, HERO_CY); ctx.stroke();
        ctx.lineWidth = 1; ctx.globalAlpha = 1;
      }
      break;
    }
    case 'poison': {
      if (k > 0.35) {
        const f = (k - 0.35) / 0.65;
        ctx.globalAlpha = (1 - f) * 0.7;
        ctx.fillStyle = '#7ac04a';
        ctx.beginPath(); ctx.ellipse(ENEMY_CX, ENEMY_CY + 6, 24 + f * 10, 16 + f * 6, 0, 0, 6.3); ctx.fill();
        ctx.globalAlpha = 1;
        if (Math.random() < 0.5) spawnParticle({ screen: true, x: ENEMY_CX + rnd(-20, 20), y: ENEMY_CY + rnd(-8, 12), vx: rnd(-8, 8), vy: rnd(-24, -8), life: 0.6, size: 2, color: '#a0e84e' });
      }
      break;
    }
    case 'arrow': case 'arrows': {
      // flechas voando do herói ao inimigo
      marcos.forEach((m, i) => {
        const inicio = m - 0.3;
        const f = (k - inicio) / 0.3;
        if (f < 0 || f > 1) return;
        const ax = lerp(HERO_CX - 18, ENEMY_CX + 6, f);
        const ay = lerp(HERO_CY - 4 + i * 5, ENEMY_CY + (i - 1) * 6, f) - Math.sin(f * Math.PI) * 10;
        ctx.fillStyle = '#c9a86a';
        ctx.fillRect(ax, ay, 12, 2);
        ctx.fillStyle = '#e8e4d0';
        ctx.fillRect(ax - 2, ay - 1, 4, 4);   // ponta
        ctx.fillStyle = '#e05548';
        ctx.fillRect(ax + 10, ay - 1, 3, 4);  // penas
      });
      break;
    }
    case 'guard': case 'buff': {
      // aura ao redor do herói
      const f = Math.sin(k * Math.PI);
      ctx.globalAlpha = f * 0.8;
      ctx.strokeStyle = a.anim === 'guard' ? '#8ac0ff' : '#ffd94e';
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const r = 14 + i * 9 + f * 8;
        ctx.beginPath(); ctx.ellipse(HERO_CX, HERO_CY, r, r * 1.25, 0, 0, 6.3); ctx.stroke();
      }
      ctx.lineWidth = 1; ctx.globalAlpha = 1;
      if (Math.random() < 0.7) spawnParticle({
        screen: true, x: HERO_CX + rnd(-20, 20), y: HERO_CY + 24, vx: rnd(-6, 6), vy: rnd(-60, -30),
        life: 0.5, size: 2, color: a.anim === 'guard' ? '#8ac0ff' : '#ffd94e', shrink: true
      });
      break;
    }
  }
}
// deslocamento do herói durante a animação (dash de investida)
function heroLunge(b) {
  if (!b.act) return 0;
  const a = b.act, k = clamp(a.t / a.dur, 0, 1);
  const corpoACorpo = ['slash', 'slash2', 'flurry', 'iai'].includes(a.anim);
  if (!corpoACorpo) return k < 0.3 ? -Math.sin(k / 0.3 * Math.PI) * 5 : 0;
  // avança rápido, segura, volta
  if (k < 0.35) return -Math.pow(k / 0.35, 0.6) * 98;
  if (k < 0.75) return -98;
  return -98 * (1 - (k - 0.75) / 0.25);
}

// ---------- Desenho: batalha ----------
function drawBattle() {
  const b = G.battle;
  const cave = G.map.name === 'cave';
  const dusk = !cave && G.region === 'Templo Abandonado';
  // fundo
  const grd = ctx.createLinearGradient(0, 0, 0, VH);
  if (cave) { grd.addColorStop(0, '#1c1626'); grd.addColorStop(1, '#2e2440'); }
  else if (dusk) { grd.addColorStop(0, '#2a2040'); grd.addColorStop(1, '#6a4058'); }
  else { grd.addColorStop(0, '#4a86c6'); grd.addColorStop(1, '#8ab6e0'); }
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, VW, VH);
  // chão
  ctx.fillStyle = cave ? '#3a3446' : (dusk ? '#38583a' : '#3f7a3a');
  ctx.fillRect(0, 118, VW, 62);
  ctx.fillStyle = cave ? '#443e52' : (dusk ? '#446444' : '#4c8a44');
  for (let i = 0; i < 20; i++) {
    const vx = (i * 53) % VW, vy = 122 + (i * 31) % 50;
    ctx.fillRect(vx, vy, 4, 2);
  }
  if (dusk) {
    // lua e lápides ao fundo
    ctx.fillStyle = '#d8d4c0'; ctx.beginPath(); ctx.arc(260, 30, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a4456';
    ctx.fillRect(40, 104, 10, 14); ctx.fillRect(42, 101, 6, 4);
    ctx.fillRect(240, 106, 9, 12); ctx.fillRect(242, 103, 5, 4);
  } else if (!cave) {
    // nuvens
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    const cx1 = (G.time * 6) % (VW + 60) - 30;
    ctx.fillRect(cx1, 22, 34, 7); ctx.fillRect(cx1 + 6, 17, 20, 6);
    const cx2 = (G.time * 4 + 150) % (VW + 60) - 30;
    ctx.fillRect(cx2, 40, 28, 6); ctx.fillRect(cx2 + 5, 36, 16, 5);
  } else {
    // cristais
    ctx.fillStyle = '#6a5a9a';
    ctx.fillRect(30, 90, 5, 14); ctx.fillRect(270, 84, 6, 18); ctx.fillRect(282, 94, 4, 10);
    ctx.fillStyle = '#8a7ac0';
    ctx.fillRect(31, 92, 2, 10); ctx.fillRect(272, 87, 2, 13);
  }

  // inimigo (esquerda-centro)
  const e = b.enemy;
  const es = enemySprite(e.type);
  const escale = e.boss ? 4.4 : 4.2;
  const ew = es.width * escale, eh = es.height * escale;
  const entrada = b.phase === 'entrada' ? clamp(b.t / 0.55, 0, 1) : 1;
  const slideE = Math.round((1 - easeOut(entrada)) * -140);
  const ex = 76 - ew / 2 + slideE + (b.phase === 'enemyAct' && b.t < 0.45 ? Math.round(b.t * 40) : 0);
  const bob = Math.sin(G.time * 2.5) * 2;
  const ey = 118 - eh + (e.boss ? 8 : 4) + bob;
  if (e.hp > 0 || b.phase !== 'result') {
    // sombra
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(76, 118 + (e.boss ? 6 : 2), ew * 0.35, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    if (b.eFlash > 0 && Math.floor(b.eFlash * 20) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }
    ctx.drawImage(es, Math.round(ex), Math.round(ey), ew, eh);
    ctx.globalAlpha = 1;
    if (b.frozen) { ctx.fillStyle = 'rgba(120,190,255,0.35)'; ctx.fillRect(ex, ey, ew, eh); }
    if (b.poison > 0) { ctx.fillStyle = '#a0e84e'; ctx.font = '8px monospace'; ctx.fillText('☠', ex + ew - 6, ey + 8); }
  }
  // jogador (direita)
  // sprite de batalha em alta resolução; troca para a pose de ataque na hora certa
  const cls = curClass();
  let pose = 'idle';
  if (b.act && b.phase === 'playerAnim') {
    const k = b.act.t / b.act.dur;
    pose = (k > 0.18 && k < 0.85) ? 'atk' : 'idle';
  }
  const bs = battleSprite(cls, pose);
  const ps = bs || heroSprite(cls, 'left', Math.floor(G.time * 3) % 2);
  const pscale = bs ? 2.1 : 4;
  const sw = bs ? 32 : 16, sh = bs ? 48 : 20;
  const slideH = Math.round((1 - easeOut(clamp((b.phase === 'entrada' ? b.t : 99) / 0.55, 0, 1))) * 150);
  // respiração sutil na pose parada
  const breath = pose === 'idle' && b.phase !== 'playerAnim' ? Math.round(Math.sin(G.time * 2.4) * 1) : 0;
  const px = 238 + Math.round(heroLunge(b)) + slideH;
  const py = 122 - sh * pscale + breath;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px + sw * pscale / 2, 122, 24, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  if (b.pFlash > 0 && Math.floor(b.pFlash * 20) % 2 === 0) ctx.globalAlpha = 0.4;
  ctx.drawImage(ps, px, py, sw * pscale, sh * pscale);
  ctx.globalAlpha = 1;
  ctx.font = '7px monospace';
  let byo = py - 3;
  if (b.atkBuff > 0) { ctx.fillStyle = '#ffd94e'; ctx.fillText('▲ATQ', px + 20, byo); byo -= 8; }
  if (b.defBuff > 0) { ctx.fillStyle = '#8ac0ff'; ctx.fillText('▲DEF', px + 20, byo); byo -= 8; }
  if (b.spdBuff > 0) { ctx.fillStyle = '#a0e84e'; ctx.fillText('▲VEL', px + 20, byo); byo -= 8; }
  if (b.pPoison > 0) { ctx.fillStyle = '#a0e84e'; ctx.fillText('☠', px + 4, py - 3); }
  // pet ao lado do herói
  if (P.activePet) {
    const pspr = petSprite(P.activePet);
    const lunge = b.petAnim > 0 ? -Math.round(b.petAnim * 60) : 0;
    const pbob = Math.round(Math.sin(G.time * 3.5) * 2);
    const petX = 198 + lunge, petY = 118 - 22 + pbob;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(petX + 12, 119, 9, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.drawImage(pspr, petX, petY, pspr.width * 2, pspr.height * 2);
  }

  // barra HP inimigo (some durante a cinemática de entrada)
  ctx.globalAlpha = b.phase === 'entrada' ? clamp((b.t - 0.9) / 0.35, 0, 1) : 1;
  ctx.fillStyle = 'rgba(12,10,20,0.85)';
  ctx.fillRect(8, 6, 130, 26);
  ctx.strokeStyle = e.boss ? '#c04040' : '#5a4a8a';
  ctx.strokeRect(8.5, 6.5, 129, 25);
  ctx.font = '7px monospace';
  ctx.fillStyle = '#f0e8f8';
  ctx.fillText(e.name + '  Nv.' + e.lvl, 13, 15);
  // fantasma (dano recente) atrás da barra real
  barRect(13, 19, 110, 5, b.hpShown / e.maxHp, '#8a2a2a');
  ctx.fillStyle = e.boss ? '#e05050' : '#e08040';
  ctx.fillRect(13, 19, Math.round(110 * clamp(e.hp / e.maxHp, 0, 1)), 5);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(13, 19, Math.round(110 * clamp(e.hp / e.maxHp, 0, 1)), 1);
  ctx.fillStyle = '#cfc8e0'; ctx.fillText(e.hp + '/' + e.maxHp, 13, 31);
  ctx.globalAlpha = 1;

  // efeitos da técnica em curso
  if (b.phase === 'playerAnim') drawActionFX(b);

  // rastro do golpe sobre o inimigo
  if (b.slash) {
    const k = 1 - b.slash.t / 0.28;
    ctx.globalAlpha = k;
    ctx.strokeStyle = b.slash.crit ? '#ffd94e' : '#ffffff';
    ctx.lineWidth = b.slash.crit ? 3 : 2;
    ctx.beginPath();
    const sw = 46 * (1.15 - k * 0.35);
    ctx.moveTo(76 - sw / 2, 74 - sw / 2 + (1 - k) * 12);
    ctx.lineTo(76 + sw / 2, 74 + sw / 2 - (1 - k) * 12);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.globalAlpha = 1;
  }
  // partículas da batalha (camada de tela)
  drawParticles(true);

  // popups de dano
  for (const p of b.dmgPops) {
    const t = p.t;
    const bx = p.who === 'enemy' ? 76 : 268;
    const by = (p.who === 'enemy' ? 60 : 62) - t * 26;
    ctx.font = 'bold 10px monospace';
    ctx.globalAlpha = t > 0.7 ? (1 - t) / 0.3 : 1;
    ctx.fillStyle = '#0e0c16';
    ctx.fillText('' + p.val, bx + 1, by + 1);
    ctx.fillStyle = p.color;
    ctx.fillText('' + p.val, bx, by);
    ctx.globalAlpha = 1;
  }

  // cinemática de entrada: speed lines e cartão com o nome
  if (b.phase === 'entrada') {
    const k = b.t;
    // linhas de velocidade radiais (estilo anime)
    if (k < 0.75) {
      const f = 1 - k / 0.75;
      ctx.globalAlpha = f * 0.85;
      ctx.strokeStyle = b.enemy.boss ? '#ffb0b0' : '#ffffff';
      ctx.lineWidth = 1;
      for (let i = 0; i < 26; i++) {
        const ang = (i / 26) * Math.PI * 2 + k * 0.6;
        const r0 = 40 + f * 90, r1 = r0 + 40 + f * 70;
        ctx.beginPath();
        ctx.moveTo(VW / 2 + Math.cos(ang) * r0, VH / 2 + Math.sin(ang) * r0 * 0.7);
        ctx.lineTo(VW / 2 + Math.cos(ang) * r1, VH / 2 + Math.sin(ang) * r1 * 0.7);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    // cartão com o nome do youkai deslizando
    if (k > 0.45) {
      const f = clamp((k - 0.45) / 0.3, 0, 1);
      const cw = 150, cx0 = lerp(-cw, VW / 2 - cw / 2, easeOut(f));
      const sair = k > 1.1 ? (k - 1.1) / 0.25 : 0;
      ctx.globalAlpha = 1 - sair;
      ctx.fillStyle = b.enemy.boss ? 'rgba(90,10,20,0.95)' : 'rgba(20,14,34,0.95)';
      ctx.fillRect(cx0, 52, cw, 22);
      ctx.strokeStyle = b.enemy.boss ? '#e05050' : '#ffd94e';
      ctx.strokeRect(cx0 + 0.5, 52.5, cw - 1, 21);
      ctx.font = 'bold 9px monospace';
      ctx.fillStyle = b.enemy.boss ? '#ff8a8a' : '#ffd94e';
      ctx.textAlign = 'center';
      ctx.fillText(b.enemy.name, cx0 + cw / 2, 63);
      ctx.font = '7px monospace';
      ctx.fillStyle = '#c8b8e0';
      ctx.fillText(b.enemy.boss ? '— chefe youkai —' : 'Nível ' + b.enemy.lvl, cx0 + cw / 2, 71);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
  }
  // clarão de entrada
  if (G.battleFlash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (G.battleFlash * 0.55) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
  // painel inferior
  ctx.fillStyle = 'rgba(10,8,18,0.94)';
  ctx.fillRect(0, 126, VW, 54);
  ctx.strokeStyle = '#5a4a8a';
  ctx.strokeRect(0.5, 126.5, VW - 1, 53);

  // status do jogador (direita)
  const PE = eff();
  ctx.font = '7px monospace';
  ctx.fillStyle = '#e8e0f0';
  ctx.fillText(className() + ' Nv.' + P.lvl, 216, 138);
  barRect(216, 142, 72, 5, b.pHpShown / PE.maxHp, '#8a2a2a');
  ctx.fillStyle = P.hp / PE.maxHp < 0.3 ? '#e05050' : '#50c060';
  ctx.fillRect(216, 142, Math.round(72 * clamp(P.hp / PE.maxHp, 0, 1)), 5);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(216, 142, Math.round(72 * clamp(P.hp / PE.maxHp, 0, 1)), 1);
  ctx.fillStyle = '#cfc8e0'; ctx.fillText('HP ' + P.hp + '/' + PE.maxHp, 216, 155);
  barRect(216, 159, 72, 4, P.mp / PE.maxMp, '#5080e0');
  ctx.fillStyle = '#cfc8e0'; ctx.fillText('MP ' + P.mp + '/' + PE.maxMp, 216, 172);

  // faixa de mensagem: mostra a descrição da ação em foco durante o menu
  ctx.fillStyle = 'rgba(10,8,18,0.8)';
  ctx.fillRect(0, 112, VW, 14);
  ctx.font = '8px monospace';
  if (b.phase === 'menu' && b.sub === null) {
    const foco = battleActions()[b.menuIdx];
    ctx.fillStyle = '#b8a8d8';
    if (foco) ctx.fillText(foco.desc, 10, 122);
  } else if (b.phase === 'menu' && b.sub === 'extra') {
    ctx.fillStyle = '#b8a8d8';
    ctx.fillText(b.subIdx === 0 ? 'Usar um item da bolsa' : 'Tentar escapar da batalha', 10, 122);
  } else {
    ctx.fillStyle = '#f0e8c8';
    ctx.fillText(b.log, 10, 122);
  }

  if (b.phase === 'menu') {
    if (b.sub === null || b.sub === 'extra') {
      // coluna 1: ataque + técnicas equipadas
      const acts = battleActions();
      acts.forEach((a, i) => {
        const oy = 137 + i * 9;
        const sel = b.sub === null && i === b.menuIdx;
        const podeMp = a.mp === 0 || P.mp >= a.mp;
        if (sel) { ctx.fillStyle = '#ffd94e'; ctx.fillText('▶', 8, oy); }
        ctx.fillStyle = sel ? (podeMp ? '#fff' : '#e07070') : (podeMp ? '#a89ac0' : '#6a5a70');
        ctx.fillText(a.name, 17, oy);
        if (a.mp > 0) {
          ctx.fillStyle = podeMp ? '#6ea8ff' : '#5a5070';
          ctx.fillText(a.mp + 'MP', 122, oy);
        }
      });
      // coluna 2: Item / Fugir
      ['Item', 'Fugir'].forEach((t, i) => {
        const oy = 137 + i * 9;
        const sel = b.sub === 'extra' && i === b.subIdx;
        if (sel) { ctx.fillStyle = '#ffd94e'; ctx.fillText('▶', 152, oy); }
        ctx.fillStyle = sel ? '#fff' : '#8a7ab0';
        ctx.fillText(t, 161, oy);
      });
      if (b.sub === null) { ctx.fillStyle = '#5a4a70'; ctx.fillText('◀▶', 152, 137 + 2 * 9); }
    } else if (b.sub === 'item') {
      const its = Object.keys(ITEMS).filter(k => P.items[k] > 0);
      const show = 4;
      const first = clamp(b.subIdx - 2, 0, Math.max(0, its.length - show));
      its.slice(first, first + show).forEach((id, j) => {
        const i = first + j;
        const oy = 138 + j * 9;
        if (i === b.subIdx) { ctx.fillStyle = '#ffd94e'; ctx.fillText('▶', 10, oy); }
        ctx.fillStyle = i === b.subIdx ? '#fff' : '#a89ac0';
        ctx.fillText(ITEMS[id].name + ' x' + P.items[id], 20, oy);
      });
      if (first > 0) { ctx.fillStyle = '#8a7ab0'; ctx.fillText('▲', 100, 138); }
      if (first + show < its.length) { ctx.fillStyle = '#8a7ab0'; ctx.fillText('▼', 100, 165); }
      if (its[b.subIdx]) { ctx.fillStyle = '#8a7ab0'; ctx.fillText(ITEMS[its[b.subIdx]].desc, 114, 138); }
    }
  } else if (b.phase === 'result' && b.rewards) {
    const r = b.rewards;
    ctx.fillStyle = '#ffd94e';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('VITÓRIA!', 10, 140);
    ctx.font = '7px monospace';
    ctx.fillStyle = '#e8e0f0';
    ctx.fillText('+' + r.xp + ' XP   +' + r.gold + ' ouro' + (r.frags ? '   +' + r.frags + '◆' : ''), 10, 151);
    if (r.dropTxt) {
      ctx.fillStyle = r.dropColor || '#c8c8d0';
      ctx.fillText('Loot: ' + r.dropTxt, 118, 151);
    }
    if (r.matTxt) {
      ctx.fillStyle = '#9aa0b0';
      ctx.fillText(r.matTxt, 118, 161);
    }
    if (r.ups.length) {
      ctx.fillStyle = '#6ee86e';
      ctx.fillText('NÍVEL ' + r.ups[r.ups.length - 1] + '!  +' + (r.ups.length * PTS_PER_LEVEL) + ' pontos (C)', 10, 161);
      if (r.newSkill) { ctx.fillStyle = '#6ea8ff'; ctx.fillText('Nova técnica: ' + r.newSkill, 130, 171); }
    }
    if (r.petTxt) {
      ctx.fillStyle = r.petColor;
      ctx.fillText('♥ Novo espírito: ' + r.petTxt + '!', 10, 171);
    }
    if (b.t > 0.6 && Math.floor(G.time * 2) % 2) {
      ctx.fillStyle = '#a89ac0';
      ctx.fillText('Z para continuar', 220, 174);
    }
  } else if (b.phase === 'entrada') {
    ctx.fillStyle = '#a89ac0';
    ctx.font = '7px monospace';
    if (b.t > 0.9) ctx.fillText('Prepare-se...', 10, 140);
  }
}

// ---------- Telas: título, classes, menus ----------
function drawTitle() {
  const grd = ctx.createLinearGradient(0, 0, 0, VH);
  grd.addColorStop(0, '#141024');
  grd.addColorStop(0.6, '#2a1c46');
  grd.addColorStop(1, '#4a2c58');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, VW, VH);
  // estrelas
  for (let i = 0; i < 40; i++) {
    const sx = (i * 97) % VW, sy = (i * 53) % 100;
    const tw = Math.sin(G.time * 2 + i) * 0.5 + 0.5;
    ctx.fillStyle = 'rgba(255,255,240,' + (0.2 + tw * 0.5) + ')';
    ctx.fillRect(sx, sy, 1, 1);
  }
  // lua
  ctx.fillStyle = '#e8e4d0'; ctx.beginPath(); ctx.arc(270, 34, 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d0ccb8'; ctx.fillRect(265, 28, 4, 4); ctx.fillRect(273, 38, 3, 3);
  // silhueta de montanhas
  ctx.fillStyle = '#0e0a18';
  ctx.beginPath();
  ctx.moveTo(0, 140);
  for (let x = 0; x <= VW; x += 20) ctx.lineTo(x, 140 - Math.abs(Math.sin(x * 0.05)) * 45 - (x % 40 === 0 ? 10 : 0));
  ctx.lineTo(VW, VH); ctx.lineTo(0, VH);
  ctx.fill();
  // pétalas de sakura caindo
  for (let i = 0; i < 22; i++) {

function updateTitle() {
  const n = hasSave() ? 2 : 1;

function updatePauseMenu() {
  const wt = weaponType();
  const repLen = wt ? WEAPON_SKILLS[wt].length : 0;
  const listLen = G.menuTab === 0 ? ALLOC.length
    : G.menuTab === 1 ? Math.max(1, (wt ? curSkills().length : 0) + repLen)
    : G.menuTab === 2 ? Math.max(1, P.equipInv.length)
    : G.menuTab === 4 ? Math.max(1, P.pets.length)
    : Object.keys(ITEMS).length;
  if (tap('left')) { G.menuTab = (G.menuTab + 4) % 5; G.menuIdx = 0; AU.sfx('menu'); }
  if (tap('right')) { G.menuTab = (G.menuTab + 1) % 5; G.menuIdx = 0; AU.sfx('menu'); }
  // Q desmonta a peça em foco na mochila
  if (tap('alt')) {
    if (G.menuTab === 2 && P.equipInv[G.menuIdx]) {
      const idx = G.menuIdx;
      askConfirm('Desmontar ' + eqName(P.equipInv[idx]) + '?', dismantleYield(P.equipInv[idx]), () => {
        desmontar(idx);
        G.menuIdx = Math.max(0, Math.min(G.menuIdx, P.equipInv.length - 1));
      });
    } else AU.sfx('back');
  }
  if (tap('up')) { G.menuIdx = (G.menuIdx + listLen - 1) % listLen; AU.sfx('menu'); }
  if (tap('down')) { G.menuIdx = (G.menuIdx + 1) % listLen; AU.sfx('menu'); }
  if (tap('ok')) {
    if (G.menuTab === 0) {
      // aplicar ponto de status
      if (P.pts > 0) {
        const a = ALLOC[G.menuIdx];
        P.pts--;
        P[a.key] += a.gain || 1;
        if (a.key === 'maxHp') P.hp += a.gain;
        if (a.key === 'maxMp') P.mp += a.gain;
        AU.sfx('ok');
      } else AU.sfx('back');
    } else if (G.menuTab === 1) {
      // equipar/trocar técnica
      const t2 = weaponType();
      const rep = t2 ? WEAPON_SKILLS[t2] : [];
      const eqs = t2 ? curSkills() : [];
      if (G.menuIdx >= eqs.length && rep.length) {
        const [id, lvl] = rep[G.menuIdx - eqs.length];
        if (P.lvl < lvl) { toast('Requer nível ' + lvl); AU.sfx('back'); }
        else if (eqs.includes(id)) { toast('Já equipada'); AU.sfx('back'); }
        else if (eqs.length < MAX_SKILLS) { equipSkill(id); AU.sfx('ok'); toast(SKILLS[id].name + ' equipada!'); saveGame(); }
        else { G.learnQueue.push(id); G.state = 'learn'; G.learnIdx = 0; AU.sfx('ok'); }
      } else AU.sfx('back');
    } else if (G.menuTab === 2) {
      if (P.equipInv[G.menuIdx]) {
        equipFromInv(G.menuIdx);
        G.menuIdx = Math.min(G.menuIdx, Math.max(0, P.equipInv.length - 1));
        AU.sfx('ok');
      } else AU.sfx('back');
    } else if (G.menuTab === 4) {
      const id = P.pets[G.menuIdx];
      if (id) {
        P.activePet = P.activePet === id ? null : id;
        clampVitals();
        AU.sfx('ok');
      } else AU.sfx('back');
    } else {
      const its = Object.keys(ITEMS);
      const id = its[G.menuIdx];
      const it = ITEMS[id];
      const E = eff();
      const hurt = P.hp < E.maxHp, drained = P.mp < E.maxMp;
      if (P.items[id] > 0 && !it.battleOnly) {
        let used = true;
        if (id === 'pocao' && hurt) { P.hp = Math.min(E.maxHp, P.hp + Math.round(E.maxHp * 0.45)); addFloater(P.x + 8, P.y - 4, '+HP', '#6ee86e'); }
        else if (id === 'pocaoG' && hurt) { P.hp = Math.min(E.maxHp, P.hp + Math.round(E.maxHp * 0.8)); addFloater(P.x + 8, P.y - 4, '+HP', '#6ee86e'); }
        else if (id === 'pao' && (hurt || drained)) {
          P.hp = Math.min(E.maxHp, P.hp + Math.round(E.maxHp * 0.2));
          P.mp = Math.min(E.maxMp, P.mp + Math.round(E.maxMp * 0.2));
          addFloater(P.x + 8, P.y - 4, '+HP/MP', '#6ee86e');
        }
        else if (id === 'eter' && drained) { P.mp = Math.min(E.maxMp, P.mp + Math.round(E.maxMp * 0.4)); addFloater(P.x + 8, P.y - 4, '+MP', '#6ea8ff'); }
        else if (id === 'elixir' && (hurt || drained)) { P.hp = E.maxHp; P.mp = E.maxMp; addFloater(P.x + 8, P.y - 4, 'MAX!', '#ffd94e'); }
        else used = false;
        if (used) {
          P.items[id]--;
          AU.sfx('heal');
          burst(P.x + 8, P.y + 8, 10, { color: ['#6ee86e', '#a0f0a0', '#dcffdc'], spdMax: 40, lifeMax: 0.6, size: 1, lift: 20 });
        } else AU.sfx('back');
      } else AU.sfx('back');
    }
  }
  if (tap('back') || tap('menu')) { G.state = 'world'; AU.sfx('back'); saveGame(); }
}

const SHOP_STOCK = {
  aldeia: ['i:pocao', 'i:pao', 'i:eter', 'i:antidoto', 'esp2', 'caj2', 'ada2', 'arc2',
           'arm2', 'arm9', 'bot2', 'elm2', 'elm6', 'luv2', 'amu2'],

           'arm3', 'arm4', 'arm10', 'elm3', 'elm4', 'bot3', 'luv3', 'luv4', 'amu3', 'amu6', 'amu7']
};
function shopEntry(s) {
  if (s.startsWith('i:')) {
    const id = s.slice(2);
    return { kind: 'item', id, name: ITEMS[id].name, desc: ITEMS[id].desc, price: ITEMS[id].price, color: '#c8c8d0' };
  }
  const eq = EQUIP[s];
  return { kind: 'equip', id: s, name: eq.name, desc: RARITY[eq.rar].name + ' · ' + SLOT_NAMES[eq.slot], price: equipPrice(s), color: RARITY[eq.rar].color };
}
function drawShop() {
  drawWorld(true);
  ctx.fillStyle = 'rgba(8,6,16,0.8)';
  ctx.fillRect(0, 0, VW, VH);
  const x = 44, y = 16, w = VW - 88, h = VH - 40;
  ctx.fillStyle = 'rgba(24,18,44,0.97)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#5a4a8a';
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

  const stock = SHOP_STOCK[G.shopId];

  const first = clamp(G.shopIdx - 4, 0, Math.max(0, stock.length - maxShow));
  stock.slice(first, first + maxShow).forEach((s, j) => {
    const i = first + j;
    const e = shopEntry(s);
    const sel = i === G.shopIdx;
    const oy = y + 36 + j * 10;
    const owned = e.kind === 'item' ? P.items[e.id] : (P.equipInv.includes(e.id) ? 1 : 0) + (Object.values(P.equip).includes(e.id) ? 1 : 0);
    const can = P.gold >= e.price;
    if (sel) { ctx.fillStyle = '#ffd94e'; ctx.fillText('▶', x + 6, oy); }

  if (first + maxShow < stock.length) { ctx.fillStyle = '#8a7ab0'; ctx.fillText('▼', x + w - 14, y + 36 + (maxShow - 1) * 10); }
  const cur = shopEntry(stock[G.shopIdx]);
  ctx.fillStyle = cur.color;

}
function updateShop() {
  const stock = SHOP_STOCK[G.shopId];
  if (tap('up')) { G.shopIdx = (G.shopIdx + stock.length - 1) % stock.length; AU.sfx('menu'); }
  if (tap('down')) { G.shopIdx = (G.shopIdx + 1) % stock.length; AU.sfx('menu'); }
  if (tap('ok')) {
    const e = shopEntry(stock[G.shopIdx]);
    if (P.gold >= e.price) {
      if (e.kind === 'item') {
        if (P.items[e.id] < 9) { P.gold -= e.price; P.items[e.id]++; AU.sfx('coin'); saveGame(); }
        else AU.sfx('back');
      } else {
        if (P.equipInv.length < 18) { P.gold -= e.price; P.equipInv.push(e.id); AU.sfx('coin'); saveGame(); }
        else { toast('Mochila cheia!'); AU.sfx('back'); }
      }
    } else AU.sfx('back');
  }
  if (tap('back')) { G.state = 'world'; AU.sfx('back'); }
}

// modo 0 = encantar (equipados + mochila), modo 1 = desmontar (só mochila)
function altarList() {
  const out = [];

    for (const s of SLOTS) if (P.equip[s]) out.push({ id: P.equip[s], where: SLOT_NAMES[s] });
  }
  P.equipInv.forEach((id, i) => out.push({ id, where: 'mochila', idx: i }));
  return out;
}

function encantar(id) {
  P.frags -= enchCost(id);
  const mc = enchMatCost(id);
  if (mc) P.mats[mc.mat] -= mc.n;
  P.ench[id] = enchLvl(id) + 1;
  AU.sfx('level');
  addFloater(P.x + 8, P.y - 4, '+' + P.ench[id], '#d8a0ff');
  burstScreen(VW / 2, VH / 2, 30, { color: ['#b06ae8', '#d8a0ff', '#e0b8ff'], spdMax: 100, lifeMax: 0.9, size: 2, drag: 2.5 });
  clampVitals();
  saveGame();
}
function desmontar(idx) {
  const id = P.equipInv[idx];
  const yl = dismantleFromInv(idx);
  if (!yl) return;
  AU.sfx('ok');
  toast(EQUIP[id].name + ' → ◆' + yl.frags + ' · ' + matsText(yl.mats));
  burstScreen(VW / 2, VH / 2, 24, { color: ['#9aa0b0', '#d8d0b0', '#e0a0c8'], spdMax: 90, lifeMax: 0.7, size: 2, g: 90 });
  saveGame();
}
function updateEnchant() {
  const lista = altarList();
  const n = Math.max(1, lista.length);
  if (tap('left') || tap('right')) { G.altarMode = G.altarMode ? 0 : 1; G.menuIdx = 0; AU.sfx('menu'); }
  if (tap('up')) { G.menuIdx = (G.menuIdx + n - 1) % n; AU.sfx('menu'); }
  if (tap('down')) { G.menuIdx = (G.menuIdx + 1) % n; AU.sfx('menu'); }
  if (tap('ok')) {
    const foco = lista[G.menuIdx];
    if (!foco) { AU.sfx('back'); }
    else if (G.altarMode === 0) {
      if (canEnchant(foco.id)) encantar(foco.id);
      else AU.sfx('back');
    } else {
      askConfirm('Desmontar ' + eqName(foco.id) + '?', dismantleYield(foco.id), () => {
        desmontar(foco.idx);
        G.menuIdx = Math.max(0, Math.min(G.menuIdx, altarList().length - 1));
      });
    }
  }
  if (tap('back')) { G.state = 'world'; AU.sfx('back'); saveGame(); }
}

  if (t) {
    ctx.fillStyle = '#ffd94e';
    ctx.fillText('Z para continuar explorando', VW / 2, 166);
  }
  ctx.textAlign = 'left';
}
function updateVictory() {
  if (tap('ok')) {
    fadeTo(() => {
      G.state = 'world';
      AU.setTrack(G.map.name === 'cave' ? AU.CAVE : AU.WORLD);
      showMsg('Você pode continuar explorando\no mundo. Obrigado por jogar!');
    });
  }
}

// ---------- Diálogo ----------
function drawDialog() {
  const txt = G.msgQueue[0];
  const lines = txt.split('\n');
  const h = 16 + lines.length * 10;
  const y = VH - h - 6;
  ctx.fillStyle = 'rgba(12,10,22,0.94)';
  ctx.fillRect(8, y, VW - 16, h);
  ctx.strokeStyle = '#7a6aa8';
  ctx.strokeRect(8.5, y + 0.5, VW - 17, h - 1);
  ctx.font = '8px monospace';
  G.msgChar += 1.6;
  let shown = 0;
  for (let i = 0; i < lines.length; i++) {
    const avail = Math.max(0, Math.floor(G.msgChar) - shown);
    ctx.fillStyle = '#f0e8f8';
    ctx.fillText(lines[i].slice(0, avail), 16, y + 13 + i * 10);
    shown += lines[i].length;
  }
  if (G.msgChar >= shown && Math.floor(G.time * 3) % 2) {
    ctx.fillStyle = '#ffd94e';
    ctx.fillText('▼', VW - 24, y + h - 5);
  }
}
function updateDialog() {
  const txt = G.msgQueue[0];
  const total = txt.replace(/\n/g, '').length;
  if (tap('ok') || tap('back')) {
    if (G.msgChar < total) G.msgChar = total;
    else { G.msgQueue.shift(); G.msgChar = 0; AU.sfx('menu'); }
  }
}

// ---------- Loop principal ----------
let lastT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  G.time += dt;
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, overlay.width, overlay.height);

  AU.update(dt);
  updateFade(dt);

  // update
  if (G.fadeDir === 0 || G.fade < 1) {
    if (G.msgQueue.length && (G.state === 'world')) {
      updateDialog();
    } else {
      switch (G.state) {
        case 'title': updateTitle(); break;
        case 'world': if (G.fadeDir === 0) updateWorld(dt); break;
        case 'battle': updateBattle(dt); break;
        case 'menu': updatePauseMenu(); break;
        case 'shop': updateShop(); break;
        case 'enchant': updateEnchant(); break;
        case 'confirm': updateConfirm(); break;
        case 'learn': updateLearn(); break;
        case 'create': updateCreate(); break;
        case 'gameover': updateGameOver(); break;
        case 'victory': updateVictory(); break;
      }
    }
  }
  if (G.battleFlash > 0) G.battleFlash = Math.max(0, G.battleFlash - dt * 3.2);
  // partículas e ambiente
  updateParticles(dt);
  if (G.state === 'world' && G.map) updateAmbient(dt);

  // floaters
  for (const f of G.floaters) f.t += dt;
  G.floaters = G.floaters.filter(f => f.t < 1.2);
  for (const t of G.toasts) t.t += dt;
  G.toasts = G.toasts.filter(t => t.t < 2);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);

  // draw
  ctx.save();
  if (G.shake > 0.5) ctx.translate(irnd(-G.shake, G.shake) * 0.5, irnd(-G.shake, G.shake) * 0.5);
  switch (G.state) {
    case 'title': drawTitle(); break;
    case 'world': drawWorld(); break;
    case 'battle': drawBattle(); break;
    case 'menu': drawPauseMenu(); break;
    case 'shop': drawShop(); break;
    case 'enchant': drawEnchant(); break;
    case 'confirm': drawConfirm(); break;
    case 'learn': drawLearn(); break;
    case 'create': drawCreate(); break;
    case 'gameover': drawGameOver(); break;
    case 'victory': drawVictory(); break;
  }
  // floaters do mundo
  if (G.state === 'world' || G.state === 'menu') {
    for (const f of G.floaters) {
      ctx.font = 'bold 8px monospace';
      ctx.globalAlpha = f.t > 0.8 ? (1.2 - f.t) / 0.4 : 1;
      ctx.fillStyle = '#0e0c16';
      ctx.fillText(f.txt, f.x - G.camX + 1, f.y - G.camY - f.t * 18 + 1);
      ctx.fillStyle = f.color;
      ctx.fillText(f.txt, f.x - G.camX, f.y - G.camY - f.t * 18);
      ctx.globalAlpha = 1;
    }
  }
  if (G.msgQueue.length && G.state === 'world') drawDialog();
  // toasts
  if (G.state !== 'battle') G.toasts.forEach((t, i) => {
    ctx.font = '7px monospace';
    ctx.globalAlpha = t.t > 1.5 ? (2 - t.t) / 0.5 : 1;
    ctx.fillStyle = 'rgba(12,10,22,0.9)';
    const tw = ctx.measureText(t.txt).width;
    ctx.fillRect(VW / 2 - tw / 2 - 4, 6 + i * 14, tw + 8, 11);
    ctx.fillStyle = '#f0e8f8';
    ctx.fillText(t.txt, VW / 2 - tw / 2, 14 + i * 14);
    ctx.globalAlpha = 1;
  });
  ctx.restore();

  // fade (também sobre a camada de texto)
  if (G.fade > 0) {
    ctx.fillStyle = 'rgba(6,4,12,' + G.fade + ')';
    ctx.fillRect(0, 0, VW, VH);
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.fillStyle = 'rgba(6,4,12,' + G.fade + ')';
    octx.fillRect(0, 0, overlay.width, overlay.height);
  }

  // blit para tela
  mainCtx.imageSmoothingEnabled = false;
  mainCtx.clearRect(0, 0, cv.width, cv.height);
  mainCtx.drawImage(buf, 0, 0, cv.width, cv.height);
  mainCtx.drawImage(overlay, 0, 0);

  // limpa taps não consumidos
  for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Hooks de depuração/teste (não usados no jogo normal) ----------
window.DBG = {
  get G() { return G; },
  get P() { return P; },
  start() {
    P = newPlayer();
    MAPS.overworld = genOverworld(); MAPS.cave = genCave();
    enterMap('overworld', START.x, START.y);
    G.state = 'world';
  },
  teleport(tx, ty) { P.x = tx * TILE; P.y = ty * TILE; },
  battle(type, lvl) {
    const e = makeEntity(type || 'slime', P.x + 20, P.y, lvl || 1, ENEMIES[type] && ENEMIES[type].boss);
    G.entities.push(e);
    startBattle(e);
  },
  addXP(n) { return gainXP(n); },
  addFrags(n) { P.frags += n; },
  addMats(m) { addMats(m); },
  mats() { return P.mats; },
  matCatalog() { return MATS; },
  dismantleYield(id) { return dismantleYield(id); },
  dismantle(idx) { return dismantleFromInv(idx); },
  enchLvl(id) { return enchLvl(id); },
  enchCost(id) { return enchCost(id); },
  enchMatCost(id) { return enchMatCost(id); },
  canEnchant(id) { return canEnchant(id); },
  altarList() { return altarList(); },
  setAltarMode(m) { G.altarMode = m; G.menuIdx = 0; },
  enemies() { return ENEMIES; },
  rollMats(type, lvl) { return rollMats(type, lvl); },
  givePet(id) { if (!P.pets.includes(id)) P.pets.push(id); },
  setPet(id) { P.activePet = id; clampVitals(); },
  eff() { return eff(); },
  equip(idx) { equipFromInv(idx); },
  giveEquip(id) { return addEquipToInv(id); },
  loot(type) { return rollLoot(type); },
  shopStock(id) { return SHOP_STOCK[id]; },
  items() { return ITEMS; },
  tileCache() { return tileVarCache.size; },
  actions() { return battleActions(); },
  clearSprites() { spriteCache.clear(); },
  save() { saveGame(); },
  curSkills() { return curSkills(); },
  setSkills(arr) { const t = weaponType(); if (t) P.skillSets[t] = arr.slice(); },
  battleSprite(c,p) { return battleSprite(c,p); },
  skills() { return SKILLS; },
  weaponSkills() { return WEAPON_SKILLS; },
  heroSprite(cls, dir, frame) { return heroSprite(cls, dir, frame); },
  pets() { return PETS; },
  equipCatalog() { return EQUIP; },
  applyEnemyHit(b) { return applyEnemyHit(b); },
  clearEnemies() { G.entities = G.entities.filter(e => e.isBoss); G.spawnTimer = 60; },
  clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
};
</script>
