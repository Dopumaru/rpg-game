// avanço por tipo de objetivo
function questMatou(tipo) {
  if (!P.quests) return;
  for (const id of questAtivas()) {
    const q = QUESTS[id];
    if (q.tipo !== 'matar' || q.alvo !== tipo) continue;
    const a = P.quests.ativas[id];
    if (a.prog >= q.qtd) continue;
    a.prog++;
    if (a.prog >= q.qtd) { toast('Missão pronta: ' + q.nome); AU.sfx('level'); }
  }
}
function questColetou() {
  if (!P.quests) return;
  for (const id of questAtivas()) {
    const q = QUESTS[id];
    if (q.tipo !== 'coletar') continue;
    const a = P.quests.ativas[id];
    const tinha = a.prog;
    a.prog = Math.min(q.qtd, matQty(q.alvo));
    if (a.prog > tinha && a.prog >= q.qtd) { toast('Missão pronta: ' + q.nome); AU.sfx('level'); }
  }
}
// missão em foco no HUD: a que está pronta primeiro, senão a mais antiga
function questFoco() {

// ---------- Conversa com NPC ----------
// Mestre de missão: oferece, cobra progresso ou entrega. Mascate: abre a loja
// dele. Morador: solta uma fala da região, diferente a cada vez.
function conversaNPC(n) {
  P.dir = n.y < P.y - 4 ? 'up' : n.y > P.y + 4 ? 'down' : (n.x < P.x ? 'left' : 'right');
  AU.sfx('menu');
  if (n.tipo === 'quest') {
    // 1) alguma missão dele já está pronta para entregar?
    const pronta = questAtivas().find(id => QUESTS[id].npc === n.id && questCompleta(id));
    if (pronta) { entregaQuest(pronta); return; }
    // 2) alguma em andamento?
    const andando = questAtivas().find(id => QUESTS[id].npc === n.id);
    if (andando) {
      const q = QUESTS[andando], a = P.quests.ativas[andando];
      const alvoNome = q.tipo === 'coletar' ? MATS[q.alvo].name : ENEMIES[q.alvo].name;
      showMsg(n.nome + ':\n' + q.nome + ' — ' + a.prog + '/' + q.qtd + ' ' + alvoNome + '.\n' + q.dica + '.');
      return;
    }
    // 3) tem missão nova para oferecer?
    const nova = questOferecida(n.id);
    if (nova) {
      const q = QUESTS[nova];
      if (P.lvl < q.nivel) {
        showMsg(n.nome + ':\nVocê ainda é verde para o que preciso.\nVolte com nível ' + q.nivel + '.');
        return;
      }
      G.questOferta = nova;
      G.state = 'quest';
      return;
    }
    showMsg((n.linha ? n.linha : n.nome + ':\nNada por ora.') + '\n\n(Nenhuma missão no momento.)');
    return;
  }
  if (n.tipo === 'viajante') { abreMascate(n); return; }
  showMsg(falaAleatoria(n));
}

// ---------- Mascates ----------
// Estoque sorteado por semente guardada no save: comum sai mais barato que na
// loja fixa, raro sai bem mais caro. A carga troca a cada punhado de batalhas.
function sementeMascate(n) {
  if (!P.mercSeed) P.mercSeed = {};
  const rodada = Math.floor((G.stats.battles || 0) / 12);
  const chave = n.id;
  if (!P.mercSeed[chave] || P.mercSeed[chave].rodada !== rodada) {
    P.mercSeed[chave] = { rodada, s: (Math.random() * 1e9) | 0 };
  }
  return P.mercSeed[chave].s;
}
function estoqueMascate(n) {
  const r = seeded(sementeMascate(n) >>> 0);
  const esc = arr => arr[Math.floor(r() * arr.length)];
  const out = [];
  const nItens = 6 + Math.floor(r() * 4);
  const consumiveis = Object.keys(ITEMS);
  for (let i = 0; i < nItens; i++) {
    if (r() < 0.34) { out.push('i:' + esc(consumiveis)); continue; }
    // quanto maior a margem do mascate, mais ele mexe com coisa rara
    const sorte = r();
    const rar = sorte < 0.3 + n.margem * 0.2 ? esc(['comum', 'incomum'])
      : sorte < 0.85 ? 'raro' : esc(['epico', 'lendario']);
    const pool = Object.keys(EQUIP).filter(k => EQUIP[k].rar === rar && !NO_DROP.includes(k));
    if (pool.length) out.push(esc(pool));
  }
  return [...new Set(out)];
}
// preço do mascate: barganha no comum, ágio no raro
function precoMascate(entrada, margem) {
  const base = entrada.price;
  const raro = entrada.kind === 'equip' && ['raro', 'epico', 'lendario'].includes(EQUIP[entrada.id].rar);
  const f = raro ? 1.45 + (1 - margem) * 0.6 : 0.55 + margem * 0.2;
  return Math.max(2, Math.round(base * f));
}
function abreMascate(n) {
  G.shopId = 'mascate';
  G.shopNPC = n;
  G.shopStock = estoqueMascate(n);
  G.shopIdx = 0;
  G.state = 'shop';
  AU.sfx('ok');
  toast(n.nome);
}

// ---------- Ampliação do pixel art (EPX / Scale2x) ----------
// Dobra a resolução de um sprite preservando as bordas: cada pixel vira quatro,
// e as diagonais deixam de ser degraus grosseiros. A arte muda um pouco (os
// cantos arredondam), em troca de aguentar ser ampliada na tela sem virar
// bloco. É a mesma ideia dos filtros de emulador.
const _epxCache = new Map();
function escala2x(spr) {
  let c = _epxCache.get(spr);
  if (c) return c;
  const w = spr.width, h = spr.height;
  const gi = spr.getContext('2d').getImageData(0, 0, w, h).data;
  c = document.createElement('canvas');
  c.width = w * 2; c.height = h * 2;
  const g = c.getContext('2d');
  const saida = g.createImageData(w * 2, h * 2);
  const px = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return -1;
    const i = (y * w + x) * 4;
    return (gi[i] << 24 | gi[i + 1] << 16 | gi[i + 2] << 8 | gi[i + 3]) >>> 0;
  };
  const poe = (x, y, cor) => {
    const i = (y * w * 2 + x) * 4;
    saida.data[i] = (cor >>> 24) & 255;
    saida.data[i + 1] = (cor >>> 16) & 255;
    saida.data[i + 2] = (cor >>> 8) & 255;
    saida.data[i + 3] = cor & 255;

          if (map.tiles[yy][xx] === 14) loja = true;
          // a porta continua sendo desenhada, para aparecer na fachada
          if (map.tiles[yy][xx] !== 19) dono.set(xx + ',' + yy, 1);
        }
        y1 = yy;
      }
      casas.push({ x0, x1, y0, y1, loja });
    }
    this.casas = casas;
    const SS = 2;   // supersample da textura do chão
    const cvT = document.createElement('canvas');
    cvT.width = CH * TILE * SS; cvT.height = CH * TILE * SS;
    for (let cz = 0; cz * CH < map.h; cz++) {
      for (let cx = 0; cx * CH < map.w; cx++) {
        const g2 = cvT.getContext('2d');
        g2.imageSmoothingEnabled = false;
        g2.clearRect(0, 0, cvT.width, cvT.height);
        const altos = new Map();
        for (let y = 0; y < CH; y++) for (let x = 0; x < CH; x++) {
          const tx = cx * CH + x, ty = cz * CH + y;
          if (tx >= map.w || ty >= map.h) continue;
          const t = map.tiles[ty][tx];
          // sob uma peça alta vai o chão da região, não a arte dela
          this.pinta(g2, (alto(t) || dono.has(tx + ',' + ty)) ? base : t, tx, ty, map, x * TILE * SS, y * TILE * SS, SS);
          if (dono.has(tx + ',' + ty)) continue;
          if (alto(t)) {
            const vv = varTile3(t, tx, ty);
            const ch = t + '#' + vv;
            if (!altos.has(ch)) { const a2 = []; a2.t = t; a2.v = vv; altos.set(ch, a2); }
            altos.get(ch).push([tx, ty]);
          }
        }
        const c2 = document.createElement('canvas');
        c2.width = cvT.width; c2.height = cvT.height;
        c2.getContext('2d').drawImage(cvT, 0, 0);
        const tex = new THREE.CanvasTexture(c2);
        tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
        tex.generateMipmaps = false;
        const plano = new THREE.Mesh(
          new THREE.PlaneGeometry(CH, CH),
          new THREE.MeshLambertMaterial({ map: tex })
        );
        plano.rotation.x = -Math.PI / 2;
        plano.position.set(cx * CH + CH / 2 - 0.5, 0.5, cz * CH + CH / 2 - 0.5);
        plano.receiveShadow = true;
        const pedaco = new THREE.Group();
        pedaco.add(plano);
        // peças altas: cada tipo vira um modelo de verdade (tronco + copa,
        // telhado inclinado, pedra facetada...), uma InstancedMesh por parte
        const m4 = new THREE.Matrix4();
        const _q = new THREE.Quaternion(), _e = new THREE.Euler();
        const _p = new THREE.Vector3(), _s = new THREE.Vector3();
        for (const [chave, lista] of altos) {
          const t = lista.t, vv = lista.v;
          const modelo = MODELOS3[t] ? MODELOS3[t](vv) : null;
          if (!modelo) {   // sem modelo próprio: bloco com a arte, como antes
            const alt = ALT3[t];
            const tx3 = this.tex(t, lista[0][0], lista[0][1], map);
            const lado = new THREE.MeshLambertMaterial({ map: tx3, color: 0xb8b8c4 });
            const mesh = new THREE.InstancedMesh(geo3('caixa'),
              [lado, lado, new THREE.MeshLambertMaterial({ map: tx3 }),
               new THREE.MeshLambertMaterial({ color: 0x1a1626 }), lado, lado], lista.length);
            mesh.castShadow = true; mesh.receiveShadow = true;
            lista.forEach(([x, y], k) => {
              m4.makeScale(1, alt, 1); m4.setPosition(x, 0.5 + alt / 2, y);
              mesh.setMatrixAt(k, m4);
            });
            mesh.instanceMatrix.needsUpdate = true;
            pedaco.add(mesh);
            continue;
          }
          modelo.forEach((parte, pi) => {
            const mesh = new THREE.InstancedMesh(geo3(parte.k),
              new THREE.MeshLambertMaterial({ color: parte.c, flatShading: parte.k === 'pedra' || parte.k === 'lasca' }),
              lista.length);
            mesh.castShadow = true; mesh.receiveShadow = true;
            lista.forEach(([x, y], k) => {
              // variação por tile: gira e redimensiona um pouco, senão a
              // floresta vira uma fileira de clones
              const h1 = hash2(x * 13 + 5, y * 11 + 2), h2b = hash2(x * 3 + 9, y * 17 + 4);
              const giro = MODELOS3_GIRA.has(t) ? h1 * Math.PI * 2 : 0;
              const esc = 1 + (MODELOS3_VARIA.has(t) ? (h2b - 0.5) * 0.34 : 0);
              _e.set(parte.r ? parte.r[0] : 0, (parte.r ? parte.r[1] : 0) + giro, parte.r ? parte.r[2] : 0);
              _q.setFromEuler(_e);
              _p.set(x + (parte.p[0]) * esc, 0.5 + parte.p[1] * esc, y + (parte.p[2]) * esc);
              _s.set(parte.s[0] * esc, parte.s[1] * esc, parte.s[2] * esc);
              m4.compose(_p, _q, _s);
              mesh.setMatrixAt(k, m4);
            });
            mesh.instanceMatrix.needsUpdate = true;
            pedaco.add(mesh);
          });
        }
        for (const c of casas) {
          if (c.x0 < cx * CH || c.x0 >= (cx + 1) * CH || c.y0 < cz * CH || c.y0 >= (cz + 1) * CH) continue;
          pedaco.add(this.constroiCasa(c));
        }
        pedaco.userData.centro = new THREE.Vector2(cx * CH + CH / 2, cz * CH + CH / 2);
        this.chunks.push(pedaco);
        grupo.add(pedaco);
      }
    }
    this.grupoMapa = grupo;
    this.cena.add(grupo);
    this.ambiente(map);
  },
  // Uma construção japonesa: embasamento de pedra, parede de shikkui com
  // travamento de madeira aparente, engawa na frente e telhado de kawara com
  // beiral saliente e cumeeira. A loja se distingue de longe: telhado
  // vermelho, noren na porta, lanternas acesas e placa.
  constroiCasa(c) {
    const g = new THREE.Group();
    const larg = c.x1 - c.x0 + 1, prof = c.y1 - c.y0 + 1;
    const mx = (c.x0 + c.x1) / 2, mz = (c.y0 + c.y1) / 2;
    const frente = c.y1 + 0.5;                 // fachada voltada para o sul
    const cai = (geo, cor, x, y, z, sx, sy, sz, ry) => {
      const m = new THREE.Mesh(geo, cor);
      m.position.set(x, y, z);
      m.scale.set(sx, sy, sz);
      if (ry) m.rotation.y = ry;
      m.castShadow = true; m.receiveShadow = true;
      g.add(m);
      return m;
    };
    const CX = geo3('caixa'), CIL = geo3('cil');
    const matPedra  = new THREE.MeshLambertMaterial({ color: 0x6f6a72 });
    const matParede = new THREE.MeshLambertMaterial({ color: 0xe6dfcd });
    const matMad    = new THREE.MeshLambertMaterial({ color: 0x4a3524 });
    const matMadC   = new THREE.MeshLambertMaterial({ color: 0x6b5136 });
    const matTelha  = new THREE.MeshLambertMaterial({ color: c.loja ? 0x9c3a30 : 0x4e5768 });
    const matCume   = new THREE.MeshLambertMaterial({ color: c.loja ? 0x6d241d : 0x333a49 });
    const matPapel  = new THREE.MeshLambertMaterial({ color: 0xf2ead2 });

    const hEmb = 0.22, hPar = 1.35;
    const yEmb = 0.5 + hEmb / 2, yPar = 0.5 + hEmb + hPar / 2;
    // embasamento de pedra
    cai(CX, matPedra, mx, yEmb, mz, larg + 0.16, hEmb, prof + 0.16);
    // corpo em shikkui
    cai(CX, matParede, mx, yPar, mz, larg, hPar, prof);
    // travamento de madeira: pilares nos cantos e viga de amarração
    const topoPar = 0.5 + hEmb + hPar;
    for (const sx of [-1, 1]) for (const sz of [-1, 1])
      cai(CX, matMad, mx + sx * (larg / 2 - 0.06), yPar, mz + sz * (prof / 2 - 0.06), 0.13, hPar, 0.13);
    // pilares intermediários a cada tile na fachada
    for (let k = 1; k < larg; k++)
      cai(CX, matMad, c.x0 - 0.5 + k, yPar, frente - 0.04, 0.1, hPar, 0.1);
    cai(CX, matMad, mx, topoPar - 0.07, mz, larg + 0.04, 0.13, prof + 0.04);
    cai(CX, matMadC, mx, 0.5 + hEmb + hPar * 0.42, mz, larg + 0.03, 0.08, prof + 0.03);

    // engawa: tábua corrida na frente, com degrau
    cai(CX, matMadC, mx, 0.5 + hEmb * 0.9, frente + 0.28, larg - 0.2, 0.12, 0.58);
    cai(CX, matPedra, mx, 0.5 + hEmb * 0.35, frente + 0.6, 0.9, 0.14, 0.2);

    // telhado: beiral saliente, duas águas de kawara e cumeeira
    const yBeiral = topoPar + 0.06;
    cai(CX, matCume, mx, yBeiral, mz, larg + 0.5, 0.12, prof + 0.5);
    const altT = 0.5 + Math.min(larg, prof) * 0.24;
    const teto = new THREE.Mesh(geo3('cone4'), matTelha);
    teto.geometry = teto.geometry.clone();
    teto.geometry.rotateY(Math.PI / 4);
    teto.scale.set((larg + 0.44) / 0.7071, altT, (prof + 0.44) / 0.7071);
    teto.position.set(mx, yBeiral + 0.06 + altT / 2, mz);
    teto.castShadow = true; teto.receiveShadow = true;
    g.add(teto);
    // cumeeira no topo, no sentido mais longo
    const deitado = larg >= prof;
    cai(CX, matCume, mx, yBeiral + 0.04 + altT * 0.97, mz,
        deitado ? larg * 0.55 : 0.22, 0.14, deitado ? 0.22 : prof * 0.55);

    if (c.loja) {
      // noren na porta, lanternas e placa: dá para saber o que é de longe
      const matNoren = new THREE.MeshLambertMaterial({ color: 0xd8483a });
      cai(CX, matNoren, mx, 0.5 + hEmb + hPar * 0.78, frente + 0.03, larg * 0.62, hPar * 0.42, 0.05);
      cai(CX, new THREE.MeshLambertMaterial({ color: 0xf4e7cf }),
          mx, 0.5 + hEmb + hPar * 0.86, frente + 0.06, larg * 0.24, hPar * 0.16, 0.02);
      const matLant = new THREE.MeshLambertMaterial({ color: 0xffd06a });
      for (const sx of [-1, 1]) {
        cai(CIL, matLant, mx + sx * (larg / 2 - 0.18), yBeiral - 0.24, frente + 0.22, 0.28, 0.34, 0.28);
        cai(CX, matMad, mx + sx * (larg / 2 - 0.18), yBeiral - 0.05, frente + 0.22, 0.05, 0.22, 0.05);
      }
      // nobori: bandeira alta na frente da loja, o marco mais visível de cima
      for (const sx of [-1, 1]) {
        const bx = mx + sx * (larg / 2 + 0.35);
        cai(CX, matMad, bx, 0.5 + 1.15, frente + 0.5, 0.07, 2.3, 0.07);
        cai(CX, matMad, bx + sx * 0.16, 0.5 + 2.24, frente + 0.5, 0.32, 0.07, 0.07);
        cai(CX, matNoren, bx + sx * 0.2, 0.5 + 1.62, frente + 0.5, 0.04, 1.2, 0.34);
        cai(CX, matPapel, bx + sx * 0.23, 0.5 + 1.62, frente + 0.5, 0.02, 0.86, 0.16);
      }
    } else {
      // janela de papel na fachada
      cai(CX, matMad, mx - larg * 0.28, 0.5 + hEmb + hPar * 0.66, frente + 0.02, larg * 0.3, hPar * 0.42, 0.05);
      cai(CX, matPapel, mx - larg * 0.28, 0.5 + hEmb + hPar * 0.66, frente + 0.04, larg * 0.26, hPar * 0.36, 0.02);
    }
    return g;
  },
  // desenha um tile num contexto qualquer, reaproveitando a arte 2D do jogo
  pinta(g2, t, tx, ty, map, dx, dy, ss) {
    const k = ss || 1;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, TILE, TILE);
    try { drawTile(t, 0, 0, tx, ty, map); } catch (e) {}
    ctx.restore();
    g2.drawImage(buf, 0, 0, TILE, TILE, dx, dy, TILE * k, TILE * k);
    if (k > 1) this.detalhe(g2, t, tx, ty, dx, dy, TILE * k);
  },
  // Grão fino por cima da arte: em resolução cheia o chão em pixel puro vira
  // um xadrez de quadrados chapados. Este ruído sutil devolve textura sem
  // apagar o desenho original.
  detalhe(g2, t, tx, ty, dx, dy, lado) {
    const grao = GRAO3[t];
    if (!grao) return;
    const rnd = seeded(((tx * 73856093) ^ (ty * 19349663)) >>> 0);
    const n = grao.n;
    g2.globalAlpha = grao.a;
    for (let i = 0; i < n; i++) {
      const px2 = Math.floor(rnd() * lado), py2 = Math.floor(rnd() * lado);
      const c = grao.cores[Math.floor(rnd() * grao.cores.length)];
      const w2 = grao.alto ? 1 : 1 + Math.floor(rnd() * 2);
      const h2 = grao.alto ? 2 + Math.floor(rnd() * 2) : 1;
      g2.fillStyle = c;
      g2.fillRect(dx + px2, dy + py2, w2, h2);
    }
    g2.globalAlpha = 1;
  },
  // só os chunks por perto ficam na cena
  culling(wx, wz) {
    if (!this.chunks) return;
    for (const p of this.chunks) {
      const d = Math.hypot(p.userData.centro.x - wx, p.userData.centro.y - wz);
      p.visible = d < 30;
    }
  },

  // céu, névoa e luz mudam conforme a região
  ambiente(map) {
    let ceu = '#2a3a56', luz = '#ffe6c0', forca = 1.85, hemiC = '#bcd0ff', hemiF = 1.35, perto = 34, longe = 82;
    if (map.name === 'cave') { ceu = '#120e1e'; luz = '#8a6ad0'; forca = 0.7; hemiC = '#6a5a9a'; hemiF = 0.55; perto = 12; longe = 38; }
    else if (G.region === 'Templo Abandonado') { ceu = '#2a2440'; luz = '#c8b0ff'; forca = 1.1; hemiC = '#9a8ad0'; hemiF = 1.0; perto = 24; longe = 62; }
    else if (G.region === 'Bosque de Bambu' || G.region === 'Floresta de Aokigahara') { ceu = '#1e3a2a'; luz = '#d8f0b0'; forca = 1.4; hemiC = '#9ad0a0'; hemiF = 1.15; perto = 22; longe = 58; }
    this.ceu.set(ceu);
    this.cena.fog.color.set(ceu);
    this.cena.fog.near = perto; this.cena.fog.far = longe;
    this.sol.color.set(luz); this.sol.intensity = forca;
    this.hemi.color.set(hemiC); this.hemi.intensity = hemiF;
  },

  // billboard: o canvas do sprite 2D vira textura, sem alterar o paper doll
  sprite(canvasSpr, chave) {
    let sp = this.bill.get(chave);
    if (!sp) {
      const tex = new THREE.CanvasTexture(canvasSpr);
      tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
      tex.generateMipmaps = false;
      sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, alphaTest: 0.35, fog: true }));
      sp.userData.src = canvasSpr;
      this.cena.add(sp);
      // manchinha de sombra: Sprite não projeta sombra própria
      const som = new THREE.Mesh(
        new THREE.CircleGeometry(0.34, 10),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false })
      );
      som.rotation.x = -Math.PI / 2;
      this.cena.add(som);
      sp.userData.sombra = som;
      this.bill.set(chave, sp);
    } else if (sp.userData.src !== canvasSpr) {
      sp.material.map.dispose();
      const tex = new THREE.CanvasTexture(canvasSpr);
      tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
      tex.generateMipmaps = false;
      sp.material.map = tex;
      sp.material.needsUpdate = true;
      sp.userData.src = canvasSpr;
    }
    sp.material.map.needsUpdate = true;
    this.usados.add(chave);
    return sp;
  },
  por(chave, spr0, wx, wz, alturaTiles, sub) {
    const canvasSpr = escala2x(spr0);
    const sp = this.sprite(canvasSpr, chave);
    const larg = canvasSpr.width / (TILE * 2), altu = canvasSpr.height / (TILE * 2);
    sp.scale.set(larg, altu, 1);
    sp.position.set(wx, 0.5 + altu / 2 - (sub || 0), wz);
    sp.visible = true;
    sp.userData.sombra.position.set(wx, 0.505, wz);
    sp.userData.sombra.scale.setScalar(Math.max(0.6, larg));
    sp.userData.sombra.visible = true;
    return sp;
  },
  escondeNaoUsados() {
    for (const [k, sp] of this.bill) {
      if (!this.usados.has(k)) { sp.visible = false; sp.userData.sombra.visible = false; }
    }
    this.usados.clear();
  },

  camPara(wx, wz) {
    this.alvo.set(wx, 0.5, wz);
    const h = Math.sin(this.inc) * this.dist, d = Math.cos(this.inc) * this.dist;
    this.cam.position.set(wx, 0.5 + h, wz + d);
    this.cam.lookAt(this.alvo);
    this.sol.position.set(wx + 13, 15, wz + 9);
    this.sol.target.position.copy(this.alvo);
    this.sol.target.updateMatrixWorld();
  },
  aplicaZoom(f) { this.dist = f; },
  mostra(v) {
    if (this.forcado2D) v = false;
    const cvGl = document.getElementById('gl');
    if (cvGl) cvGl.style.visibility = v ? 'visible' : 'hidden';
    this.ligado = v;
  },
  desenha() { if (this.ok) this.rend.render(this.cena, this.cam); },
  // acompanha o tamanho da janela: a cena 3D roda na resolução real da tela
  redimensiona() {
    GL3.W = cv.width; GL3.H = cv.height;
    this.rend.setSize(GL3.W, GL3.H, false);
    const asp = GL3.W / GL3.H;
    if (this.cam) { this.cam.aspect = asp; this.cam.updateProjectionMatrix(); }
    if (this.camBat) { this.camBat.aspect = asp; this.camBat.updateProjectionMatrix(); }
  },
  // leva um ponto do mundo para a tela 2D, para partículas e rótulos
  // continuarem alinhados com a cena 3D
  projeta(wx, wy, wz) {
    _v3.set(wx, wy, wz).project(this.cam);
    return { x: (_v3.x * 0.5 + 0.5) * VW, y: (-_v3.y * 0.5 + 0.5) * VH, atras: _v3.z > 1 };
  }
};
const _v3 = new THREE.Vector3();

// ---------- Desenho: mundo ----------
function desenhaPersonagens2D(sx, sy) {

  // sombra elíptica reutilizável
  const shadow = (cx, cy, rx, alpha) => {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, Math.max(1.5, rx * 0.38), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  };

  // pet seguidor (atrás das entidades)
  if (P.activePet && G.petX !== undefined) {
    const spr = petSprite(P.activePet);
    const pex = Math.round(G.petX - sx) + 2, pey = Math.round(G.petY - sy) + 2;
    const pbob = Math.round(Math.sin(G.time * 4) * 1.5);
    shadow(pex + 6, pey + 12, 5, 0.22);
    ctx.drawImage(spr, pex, pey - pbob);
  }

  for (const n of (G.npcs || [])) {
    const nx = Math.round(n.x) - sx, ny = Math.round(n.y) - sy;
    if (nx < -24 || ny < -24 || nx > VW + 24 || ny > VH + 24) continue;
    shadow(nx + 8, ny + 15, 5.5, 0.26);
    ctx.drawImage(npcSprite(n, n.dir, n.frame), nx, ny - 4);
    const d = Math.hypot(n.x - P.x, n.y - P.y);
    if (d < TILE * 7) desenhaMarcaNPC(n, nx + 8, ny - 8, d);
  }
  // entidades ordenadas por y (profundidade)
  const ents = [...G.entities, P].sort((a, b) => a.y - b.y);
  for (const e of ents) {
    const ex = Math.round(e.x) - sx, ey = Math.round(e.y) - sy;
    if (ex < -24 || ey < -24 || ex > VW + 24 || ey > VH + 24) continue;
    if (e === P) {
      // respiração quando parado; leve inclinação ao correr
      const idleBob = P.moving ? 0 : Math.round(Math.sin(G.time * 2.2) * 0.5);
      shadow(ex + 8, ey + 15, P.moving ? 6 : 5.5, 0.28);
      ctx.drawImage(heroSprite(curClass(), P.dir, P.frame), ex, ey - 4 + idleBob);
    } else {
      const bob = e.type === 'morcego' ? Math.round(Math.sin(e.animT * 6) * 2)
        : e.isBoss ? Math.round(Math.sin(e.animT * 2) * 1.5)
        : (Math.floor(e.animT * 4) % 2);
      shadow(ex + 8, ey + 15, e.isBoss ? 9 : 6, 0.28);
      // chefes pulsam com uma aura
      if (e.isBoss) {
        const aura = 0.12 + Math.sin(G.time * 3) * 0.06;
        ctx.globalAlpha = aura;
        ctx.fillStyle = e.type === 'dragao' ? '#e05050' : e.type === 'necromante' ? '#b06ae8' : '#4ec065';
        ctx.beginPath();
        ctx.ellipse(ex + 8, ey + 8, 16, 14, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.drawImage(enemySprite(e.type), ex, ey - (e.isBoss ? 6 : 0) - bob);
      // indicador de nível para inimigos próximos
      const dist = Math.hypot(e.x - P.x, e.y - P.y);
      if (dist < TILE * 5.5) {
        const alerta = dist < TILE * 4.5;
        ctx.globalAlpha = alerta ? 1 : 0.65;
        ctx.fillStyle = e.lvl > P.lvl + 1 ? '#ff6a5a' : (e.lvl < P.lvl ? '#8a8a9a' : '#e8e060');
        ctx.font = '7px monospace';
        ctx.fillText('Nv' + e.lvl, ex + 1, ey - 2);
        ctx.globalAlpha = 1;
        // "!" quando o inimigo está perseguindo
        if (alerta) {
          ctx.fillStyle = '#ff5a5a';
          ctx.font = 'bold 8px monospace';
          ctx.fillText('!', ex + 18, ey - 2 + Math.round(Math.sin(G.time * 8) * 1));
        }
      }
    }
  }
}

// ---------- Arena de batalha em 3D ----------
// Os combatentes continuam sendo os mesmos sprites 2D, agora billboards numa
// arena com volume. As posições 3D são obtidas desprojetando as coordenadas de
// tela que o layout 2D sempre usou, então HUD, barras, números de dano e os
// efeitos das técnicas continuam encaixando pixel a pixel.
Object.assign(R3, {
  cenaBat: null, camBat: null, arenaRegiao: null, billBat: new Map(),

  // ponto do mundo que cai numa coordenada de tela, sobre o chão da arena
  pontoNoChao(sx, sy, cam) {
    _v3.set((sx / VW) * 2 - 1, -((sy / VH) * 2 - 1), 0.5).unproject(cam);
    const dir = _v3.sub(cam.position).normalize();
    const t = (0.5 - cam.position.y) / dir.y;
    return cam.position.clone().add(dir.multiplyScalar(t));
  },
  // quantas unidades de mundo valem N pixels de altura naquele ponto
  unidadesPorPixel(pos, cam) {
    const a = pos.clone().project(cam), b2 = pos.clone().setY(pos.y + 1).project(cam);
    const dPix = Math.abs(b2.y - a.y) * 0.5 * VH;
    return dPix > 0.0001 ? 1 / dPix : 0.02;
  },

  montarArena(regiao, cave) {
    if (this.arenaRegiao === regiao) return;
    this.arenaRegiao = regiao;
    if (this.cenaBat) {
      this.cenaBat.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
      });
      this.billBat.clear();
    }
    const dusk = !cave && regiao === 'Templo Abandonado';
    const mata = !cave && (regiao === 'Bosque de Bambu' || regiao === 'Floresta de Aokigahara');
    const cena = new THREE.Scene();
    const ceu = cave ? '#1c1626' : dusk ? '#3a2848' : mata ? '#2e4a34' : '#5a92cc';
    cena.background = new THREE.Color(ceu);
    cena.fog = new THREE.Fog(ceu, 16, 44);
    const luz = new THREE.DirectionalLight(cave ? '#a488e8' : dusk ? '#e0b0d0' : '#fff0d0', cave ? 1.0 : 2.0);
    luz.position.set(7, 11, 9);
    luz.castShadow = true;
    luz.shadow.mapSize.set(2048, 2048);
    const sc = luz.shadow.camera;
    sc.left = -14; sc.right = 14; sc.top = 14; sc.bottom = -14; sc.near = 1; sc.far = 40;
    sc.updateProjectionMatrix();
    luz.shadow.bias = -0.0015; luz.shadow.normalBias = 0.05;
    cena.add(luz, luz.target);
    cena.add(new THREE.HemisphereLight(cave ? '#7a6ab0' : '#cfe0ff', '#3a4a2a', cave ? 0.6 : 1.25));

    // chão da arena: um plano só, com a arte do bioma assada de uma vez.
    // Blocos lado a lado deixavam uma grade de emendas bem visível.
    const mapaFake = { name: cave ? 'cave' : 'overworld' };
    const tChao = cave ? 9 : 0;
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const nx = 30, nz = 22, SSA = 2;
    const cvA = document.createElement('canvas');
    cvA.width = nx * TILE * SSA; cvA.height = nz * TILE * SSA;
    const gA = cvA.getContext('2d');
    gA.imageSmoothingEnabled = false;
    for (let z = 0; z < nz; z++) for (let x = 0; x < nx; x++)
      this.pinta(gA, tChao, x, z, mapaFake, x * TILE * SSA, z * TILE * SSA, SSA);
    const texA = new THREE.CanvasTexture(cvA);
    texA.magFilter = THREE.NearestFilter; texA.minFilter = THREE.LinearFilter;
    const chao = new THREE.Mesh(
      new THREE.PlaneGeometry(nx, nz),
      new THREE.MeshLambertMaterial({ map: texA })
    );
    chao.rotation.x = -Math.PI / 2;
    chao.position.set(-0.5, 0.5, -0.5);
    chao.receiveShadow = true;
    cena.add(chao);
    const m4 = new THREE.Matrix4();

    // cenário ao fundo com os MESMOS modelos do mundo: mata de matsu ou bambu,
    // lápides no templo, rocha bruta na caverna. Nada de bloco com PNG colado.
    const tDeco = cave ? 10 : dusk ? 20 : (regiao === 'Bosque de Bambu' ? 1 : 1);
    const vDeco = cave ? 1 : dusk ? 0 : (regiao === 'Bosque de Bambu' ? 1 : 2);
    const partes = MODELOS3[tDeco] ? MODELOS3[tDeco](vDeco) : null;
    const N = 110;
    const rr = (a2, b3) => { const h = Math.sin(a2 * 127.1 + b3 * 311.7) * 43758.5; return h - Math.floor(h); };
    // posições sorteadas nas laterais e ao fundo, longe da faixa de combate
    const pontos = [];
    for (let k = 0; k < N; k++) {
      const lado = k % 2 ? 1 : -1;
      const fundo = k % 5 === 0;
      const zz = fundo ? -nz / 2 + 1 + rr(k, 11) * 4 : -nz / 2 + 2 + rr(k, 3) * (nz - 4);
      const xx = fundo ? (rr(k, 7) - 0.5) * nx * 0.9 : lado * (7.2 + rr(k, 9) * (nx / 2 - 8));
      pontos.push([xx, zz - 4.5, 0.8 + rr(k, 5) * 0.7, rr(k, 13) * Math.PI * 2]);
    }
    if (partes) {
      const _q2 = new THREE.Quaternion(), _e2 = new THREE.Euler();
      const _p2 = new THREE.Vector3(), _s2 = new THREE.Vector3();
      for (const parte of partes) {
        const mesh = new THREE.InstancedMesh(geo3(parte.k),
          new THREE.MeshLambertMaterial({ color: parte.c, flatShading: parte.k === 'pedra' || parte.k === 'lasca' }),
          pontos.length);
        mesh.castShadow = true; mesh.receiveShadow = true;
        pontos.forEach(([px2, pz2, esc, giro], k) => {
          _e2.set(parte.r ? parte.r[0] : 0, (parte.r ? parte.r[1] : 0) + giro, parte.r ? parte.r[2] : 0);
          _q2.setFromEuler(_e2);
          _p2.set(px2 + parte.p[0] * esc, 0.5 + parte.p[1] * esc, pz2 + parte.p[2] * esc);
          _s2.set(parte.s[0] * esc, parte.s[1] * esc, parte.s[2] * esc);
          m4.compose(_p2, _q2, _s2);
          mesh.setMatrixAt(k, m4);
        });
        mesh.instanceMatrix.needsUpdate = true;
        cena.add(mesh);
      }
    }
    // pedras soltas espalhando o chão da arena
    const pedras = MODELOS3[23](1);
    for (const parte of pedras) {
      const mesh = new THREE.InstancedMesh(geo3(parte.k),
        new THREE.MeshLambertMaterial({ color: parte.c, flatShading: true }), 26);
      mesh.castShadow = true; mesh.receiveShadow = true;
      for (let k = 0; k < 26; k++) {
        const px2 = (rr(k, 21) - 0.5) * nx * 0.85;
        const pz2 = -nz / 2 + 3 + rr(k, 23) * (nz - 6) - 4.5;
        const esc = 0.6 + rr(k, 27) * 0.7;
        m4.makeScale(parte.s[0] * esc, parte.s[1] * esc, parte.s[2] * esc);
        m4.setPosition(px2 + parte.p[0] * esc, 0.5 + parte.p[1] * esc, pz2 + parte.p[2] * esc);
        mesh.setMatrixAt(k, m4);
      }
      mesh.instanceMatrix.needsUpdate = true;
      cena.add(mesh);
    }

    this.cenaBat = cena;
    // câmera baixa, quase à altura dos lutadores, para a arena ter profundidade
    this.camBat = new THREE.PerspectiveCamera(34, GL3.W / GL3.H, 0.5, 120);
    this.camBat.position.set(0, 4.4, 12.5);
    this.camBat.lookAt(0, 1.5, 0);
    this.camBat.updateMatrixWorld();
  },

  // um billboard da arena, com sombra no chão
  billB(chave, canvasSpr) {
    let sp = this.billBat.get(chave);
    if (!sp || sp.userData.src !== canvasSpr) {
      if (sp) { sp.material.map.dispose(); this.cenaBat.remove(sp); this.cenaBat.remove(sp.userData.sombra); }
      const tex = new THREE.CanvasTexture(canvasSpr);
      tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
      tex.generateMipmaps = false;
      sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, alphaTest: 0.3, fog: true }));
      sp.userData.src = canvasSpr;
      const som = new THREE.Mesh(new THREE.CircleGeometry(1, 14),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32, depthWrite: false }));
      som.rotation.x = -Math.PI / 2;
      sp.userData.sombra = som;
      this.cenaBat.add(sp, som);
      this.billBat.set(chave, sp);
    }
    sp.material.map.needsUpdate = true;
    return sp;
  },

  // posiciona um combatente pela coordenada de tela que o layout 2D usa
  poeCombatente(chave, spr0, telaX, telaBaseY, alturaPx, opacidade) {
    const canvasSpr = escala4x(spr0);   // o sprite ocupa muita tela na batalha
    const cam = this.camBat;
    const chao = this.pontoNoChao(telaX, telaBaseY, cam);
    const upp = this.unidadesPorPixel(chao, cam);
    const altW = alturaPx * upp;
    const largW = altW * (canvasSpr.width / canvasSpr.height);
    const sp = this.billB(chave, canvasSpr);
    sp.scale.set(largW, altW, 1);
    sp.position.set(chao.x, chao.y + altW / 2, chao.z);
    sp.material.opacity = opacidade === undefined ? 1 : opacidade;
    sp.visible = true;
    sp.userData.sombra.position.set(chao.x, chao.y + 0.012, chao.z);
    sp.userData.sombra.scale.setScalar(Math.max(0.5, largW * 0.42));
    sp.userData.sombra.visible = true;
    return sp;
  },
  desenhaBat() { if (this.ok && this.cenaBat) this.rend.render(this.cenaBat, this.camBat); }
});

// telas que aparecem por cima do mundo 3D; as demais (título, criação,
// game over) são puramente 2D e escondem a cena
const ESTADOS_3D = new Set(['world', 'menu', 'shop', 'enchant', 'learn', 'confirm', 'quest', 'battle']);
// marcador flutuante do NPC: ◈ missão nova, ✓ pronta para entregar, $ mascate
function desenhaMarcaNPC(n, sx, sy, dist) {
  let marca = null, cor = '#a89ac0';
  if (n.tipo === 'quest') {
    const pronta = questAtivas().some(id => QUESTS[id].npc === n.id && questCompleta(id));
    const nova = questOferecida(n.id);
    if (pronta) { marca = '✓'; cor = '#ffd94e'; }
    else if (nova && P.lvl >= QUESTS[nova].nivel) { marca = '◈'; cor = '#6ee86e'; }
    else marca = '·';
  } else if (n.tipo === 'viajante') { marca = '$'; cor = '#ffd94e'; }
  const flut = Math.round(Math.sin(G.time * 3 + n.x) * 1.5);
  ctx.textAlign = 'center';
  if (marca && marca !== '·') {
    ctx.font = 'bold 9px monospace';
    ctx.fillStyle = cor;
    ctx.fillText(marca, Math.round(sx), Math.round(sy) + flut);
  }
  if (dist < TILE * 1.6) {
    ctx.font = '7px monospace';
    ctx.fillStyle = '#e8e0f0';
    ctx.fillText(n.nome, Math.round(sx), Math.round(sy) + 12);
    ctx.fillStyle = '#8a7ab0';
    ctx.fillText('Z falar', Math.round(sx), Math.round(sy) + 20);
  }
  ctx.textAlign = 'left';
}
let _bidSeq = 0;
// Desenha o mundo pela cena 3D. A camada 2D fica transparente e só recebe
// HUD, rótulos e partículas — que são projetados pela câmera 3D.
function desenhaMundo3D(m) {
  ctx.clearRect(0, 0, VW, VH);
  if (R3.mapaNome !== m.name) { R3.montarMapa(m); R3.regiaoAtual = null; }
  if (R3.regiaoAtual !== G.region) { R3.regiaoAtual = G.region; R3.ambiente(m); }

  const hx = P.x / TILE, hz = P.y / TILE;
  const respira = P.moving ? 0 : Math.sin(G.time * 2.2) * 0.03;
  R3.por('P', heroSprite(curClass(), P.dir, P.frame), hx, hz + 0.2, 0, -respira);

  if (P.activePet && G.petX !== undefined) {
    R3.por('pet', petSprite(P.activePet), G.petX / TILE, G.petY / TILE + 0.2, 0,
      -Math.abs(Math.sin(G.time * 4)) * 0.06);
  }
  for (const n of (G.npcs || [])) {
    if (Math.hypot(n.x - P.x, n.y - P.y) > TILE * 24) continue;
    R3.por('n_' + n.id, npcSprite(n, n.dir, n.frame), n.x / TILE, n.y / TILE + 0.2, 0, 0);
  }
  for (const e of G.entities) {
    if (e._bid === undefined) e._bid = 'e' + (++_bidSeq);
    if (Math.hypot(e.x - P.x, e.y - P.y) > TILE * 24) continue;
    const flut = e.type === 'morcego' ? Math.sin(e.animT * 6) * 0.12
      : e.isBoss ? 0.2 + Math.sin(e.animT * 2) * 0.08 : 0;
    R3.por(e._bid, enemySprite(e.type), e.x / TILE, e.y / TILE + 0.2, 0, -flut);
  }
  R3.escondeNaoUsados();
  R3.culling(hx, hz);
  R3.camPara(hx, hz + 0.2);
  R3.desenha();

  // marcador acima dos NPCs: missão nova, missão pronta, mascate
  for (const n of (G.npcs || [])) {
    const d = Math.hypot(n.x - P.x, n.y - P.y);
    if (d > TILE * 7) continue;
    const q = R3.projeta(n.x / TILE, 1.95, n.y / TILE + 0.2);
    if (q.atras) continue;
    desenhaMarcaNPC(n, q.x, q.y, d);
  }
  // rótulos de nível e alerta, projetados por cima dos youkai
  for (const e of G.entities) {
    const dist = Math.hypot(e.x - P.x, e.y - P.y);
    if (dist >= TILE * 5.5) continue;
    const q = R3.projeta(e.x / TILE, 1.9, e.y / TILE + 0.2);
    if (q.atras) continue;
    const alerta = dist < TILE * 4.5;
    ctx.globalAlpha = alerta ? 1 : 0.65;
    ctx.fillStyle = e.lvl > P.lvl + 1 ? '#ff6a5a' : (e.lvl < P.lvl ? '#8a8a9a' : '#e8e060');
    ctx.font = '7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Nv' + e.lvl, Math.round(q.x), Math.round(q.y));
    if (alerta) {
      ctx.fillStyle = '#ff5a5a';
      ctx.font = 'bold 8px monospace';
      ctx.fillText('!', Math.round(q.x) + 12, Math.round(q.y) + Math.round(Math.sin(G.time * 8)));
    }
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
}

function drawWorld(noHud) {
  const m = G.map;
  const sx = G.camX, sy = G.camY;
  if (R3.ligado) { desenhaMundo3D(m); }
  else {
    const tx0 = Math.floor(sx / TILE), ty0 = Math.floor(sy / TILE);
    ctx.fillStyle = m.name === 'cave' ? '#221e2e' : '#3f7a3a';
    ctx.fillRect(0, 0, VW, VH);
    for (let ty = ty0; ty <= ty0 + Math.ceil(VH / TILE); ty++) {
      for (let tx = tx0; tx <= tx0 + Math.ceil(VW / TILE); tx++) {
        const t = tileAt(m, tx, ty);
        drawTile(t, tx * TILE - sx, ty * TILE - sy, tx, ty, m);
      }
    }
    desenhaPersonagens2D(sx, sy);
  }
  // partículas na frente dos personagens
  drawParticles(false);

  // atmosfera por região: escurecimento e tinta de cor (no 3D quem faz isso
  // são a névoa e a luz da cena)
  if (R3.ligado) { /* névoa 3D */ }
  else if (m.name === 'cave') {
    const grd = ctx.createRadialGradient(VW / 2, VH / 2, 46, VW / 2, VH / 2, 190);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(4,2,16,0.62)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, VW, VH);
  } else if (!R3.ligado && G.region === 'Templo Abandonado') {
    ctx.fillStyle = 'rgba(50,35,80,0.34)';
    ctx.fillRect(0, 0, VW, VH);
    const grd = ctx.createRadialGradient(VW / 2, VH / 2, 60, VW / 2, VH / 2, 200);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(20,10,40,0.4)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);
  } else if (!R3.ligado && (G.region === 'Bosque de Bambu' || G.region === 'Floresta de Aokigahara')) {
    ctx.fillStyle = 'rgba(20,60,30,0.16)';
    ctx.fillRect(0, 0, VW, VH);
    const grd = ctx.createRadialGradient(VW / 2, VH / 2, 70, VW / 2, VH / 2, 200);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(6,24,10,0.35)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);
  }
  if (!noHud) { drawWorldHUD(); drawQuestHUD(); drawSetaGuia(); }
}

function barRect(x, y, w, h, pct, fg, bg) {
  ctx.fillStyle = '#0e0c16';
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = bg || '#3a3448';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fg;
  ctx.fillRect(x, y, Math.round(w * clamp(pct, 0, 1)), h);
}

function drawWorldHUD() {

// ---------- Animações de combate ----------
// Desenha o efeito da técnica em curso. ex/ey = centro do inimigo,
// px/py = posição do herói. Tudo em coordenadas de tela (320x180).
const ENEMY_CX = 76, ENEMY_CY = 74, HERO_CX = 274, HERO_CY = 70;
function drawActionFX(b) {
  const a = b.act;
  if (!a) return;
  const k = clamp(a.t / a.dur, 0, 1);
  const marcos = ANIM_HITS[a.anim] || [0.5];

  switch (a.anim) {
    case 'slash': case 'slash2': case 'flurry': {
      // arcos de corte no inimigo, sincronizados com os impactos
      marcos.forEach((m, i) => {
        const dt2 = k - m;
        if (dt2 < 0 || dt2 > 0.22) return;
        const f = 1 - dt2 / 0.22;
        ctx.globalAlpha = f;
        ctx.strokeStyle = i % 2 ? '#ffd0d0' : '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const r = 30 + (1 - f) * 14, ang = -0.9 + i * 1.1;
        ctx.arc(ENEMY_CX, ENEMY_CY, r, ang, ang + 1.9);
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.globalAlpha = 1;
      });
      break;
    }
    case 'iai': {
      // saque relâmpago: carrega e corta a tela na horizontal
      if (k < 0.55) {
        ctx.globalAlpha = k * 1.2;
        ctx.fillStyle = '#ffd94e';
        ctx.fillRect(HERO_CX - 8, HERO_CY - 2, 16, 3);
      } else if (k < 0.8) {
        const f = (k - 0.55) / 0.25;
        ctx.globalAlpha = 1 - f * 0.4;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, ENEMY_CY - 2, VW * (1 - f * 0.2), 4);
        ctx.fillStyle = '#ffd94e';
        ctx.fillRect(0, ENEMY_CY - 1, VW * (1 - f * 0.2), 2);
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'fire': {
      // bola de fogo viajando e explodindo
      if (k < 0.6) {
        const f = k / 0.6;
        const fx = lerp(HERO_CX - 20, ENEMY_CX, f), fy = lerp(HERO_CY, ENEMY_CY, f);
        const r = 5 + Math.sin(G.time * 30) * 1.5;
        ctx.fillStyle = '#ff8a3a'; ctx.beginPath(); ctx.arc(fx, fy, r + 2, 0, 6.3); ctx.fill();
        ctx.fillStyle = '#ffd040'; ctx.beginPath(); ctx.arc(fx, fy, r, 0, 6.3); ctx.fill();
        ctx.fillStyle = '#fff8c0'; ctx.beginPath(); ctx.arc(fx, fy, r * 0.5, 0, 6.3); ctx.fill();
        if (Math.random() < 0.6) spawnParticle({ screen: true, x: fx, y: fy, vx: rnd(-20, 20), vy: rnd(-10, 25), life: 0.35, size: 2, color: pick(['#ff8a3a', '#ffd040']), shrink: true });
      } else {
        const f = (k - 0.6) / 0.4;
        ctx.globalAlpha = 1 - f;
        ctx.fillStyle = '#ffd040';
        ctx.beginPath(); ctx.arc(ENEMY_CX, ENEMY_CY, 12 + f * 30, 0, 6.3); ctx.fill();
        ctx.fillStyle = '#ff8a3a';
        ctx.beginPath(); ctx.arc(ENEMY_CX, ENEMY_CY, 8 + f * 22, 0, 6.3); ctx.fill();
        ctx.globalAlpha = 1;
      }
      break;
    }
    case 'ice': {
      // cristais caindo sobre o inimigo
      for (let i = 0; i < 5; i++) {
        const off = i * 0.08;
        const f = clamp((k - off) / 0.6, 0, 1);
        if (f <= 0) continue;
        const ix = ENEMY_CX - 24 + i * 12;
        const iy = lerp(-10, ENEMY_CY + 4, f);
        ctx.globalAlpha = f < 0.9 ? 1 : (1 - f) * 10;
        ctx.fillStyle = '#8ac0ff';
        ctx.beginPath();
        ctx.moveTo(ix, iy - 7); ctx.lineTo(ix + 4, iy); ctx.lineTo(ix, iy + 7); ctx.lineTo(ix - 4, iy);
        ctx.fill();
        ctx.fillStyle = '#dcf0ff';
        ctx.fillRect(ix - 1, iy - 4, 2, 8);
        ctx.globalAlpha = 1;
      }
      break;
    }
    case 'thunder': {
      // raio descendo em ziguezague
      if (k > 0.4 && k < 0.85) {
        const f = (k - 0.4) / 0.45;
        ctx.globalAlpha = f < 0.7 ? 1 : (1 - f) / 0.3;
        ctx.strokeStyle = '#fff8c0'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(ENEMY_CX, 0);
        for (let y = 0; y < ENEMY_CY; y += 12) {
          ctx.lineTo(ENEMY_CX + Math.sin(y * 0.7 + a.t * 40) * 9, y);
        }
        ctx.lineTo(ENEMY_CX, ENEMY_CY);
        ctx.stroke();
        ctx.strokeStyle = '#8ac0ff'; ctx.lineWidth = 1;
        ctx.stroke();
        ctx.globalAlpha = 1;
        // clarão
        if (f < 0.25) { ctx.fillStyle = 'rgba(255,255,220,' + (0.4 * (1 - f * 4)) + ')'; ctx.fillRect(0, 0, VW, VH); }
      }
      break;
    }
    case 'holy': {
      // coluna de luz solar
      if (k > 0.35) {
        const f = clamp((k - 0.35) / 0.6, 0, 1);
        const w = 44 * Math.sin(f * Math.PI);
        const grd = ctx.createLinearGradient(0, 0, 0, VH);
        grd.addColorStop(0, 'rgba(255,248,200,0.9)');
        grd.addColorStop(1, 'rgba(255,200,80,0.15)');
        ctx.fillStyle = grd;
        ctx.fillRect(ENEMY_CX - w / 2, 0, w, 130);
        ctx.fillStyle = 'rgba(255,255,255,' + (0.5 * Math.sin(f * Math.PI)) + ')';
        ctx.fillRect(ENEMY_CX - w / 4, 0, w / 2, 130);
      }
      break;
    }
    case 'drain': {
      // partículas de vida indo do inimigo ao herói
      if (k > 0.5 && Math.random() < 0.8) {
        spawnParticle({
          screen: true, x: ENEMY_CX + rnd(-14, 14), y: ENEMY_CY + rnd(-14, 14),
          vx: (HERO_CX - ENEMY_CX) * 0.9, vy: (HERO_CY - ENEMY_CY) * 0.9 + rnd(-20, 20),
          life: 0.4, size: 2, color: pick(['#b06ae8', '#6ee86e', '#d8a0ff'])
        });
      }
      if (k > 0.3 && k < 0.7) {
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = '#b06ae8'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(ENEMY_CX, ENEMY_CY); ctx.lineTo(HERO_CX - 16, HERO_CY); ctx.stroke();
        ctx.lineWidth = 1; ctx.globalAlpha = 1;
      }
      break;
    }
    case 'poison': {
      if (k > 0.35) {
        const f = (k - 0.35) / 0.65;
        ctx.globalAlpha = (1 - f) * 0.7;
        ctx.fillStyle = '#7ac04a';
        ctx.beginPath(); ctx.ellipse(ENEMY_CX, ENEMY_CY + 6, 24 + f * 10, 16 + f * 6, 0, 0, 6.3); ctx.fill();
        ctx.globalAlpha = 1;
        if (Math.random() < 0.5) spawnParticle({ screen: true, x: ENEMY_CX + rnd(-20, 20), y: ENEMY_CY + rnd(-8, 12), vx: rnd(-8, 8), vy: rnd(-24, -8), life: 0.6, size: 2, color: '#a0e84e' });
      }
      break;
    }
    case 'arrow': case 'arrows': {
      // flechas voando do herói ao inimigo
      marcos.forEach((m, i) => {
        const inicio = m - 0.3;
        const f = (k - inicio) / 0.3;
        if (f < 0 || f > 1) return;
        const ax = lerp(HERO_CX - 18, ENEMY_CX + 6, f);
        const ay = lerp(HERO_CY - 4 + i * 5, ENEMY_CY + (i - 1) * 6, f) - Math.sin(f * Math.PI) * 10;
        ctx.fillStyle = '#c9a86a';
        ctx.fillRect(ax, ay, 12, 2);
        ctx.fillStyle = '#e8e4d0';
        ctx.fillRect(ax - 2, ay - 1, 4, 4);   // ponta
        ctx.fillStyle = '#e05548';
        ctx.fillRect(ax + 10, ay - 1, 3, 4);  // penas
      });
      break;
    }
    case 'guard': case 'buff': {
      // aura ao redor do herói
      const f = Math.sin(k * Math.PI);
      ctx.globalAlpha = f * 0.8;
      ctx.strokeStyle = a.anim === 'guard' ? '#8ac0ff' : '#ffd94e';
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const r = 14 + i * 9 + f * 8;
        ctx.beginPath(); ctx.ellipse(HERO_CX, HERO_CY, r, r * 1.25, 0, 0, 6.3); ctx.stroke();
      }
      ctx.lineWidth = 1; ctx.globalAlpha = 1;
      if (Math.random() < 0.7) spawnParticle({
        screen: true, x: HERO_CX + rnd(-20, 20), y: HERO_CY + 24, vx: rnd(-6, 6), vy: rnd(-60, -30),
        life: 0.5, size: 2, color: a.anim === 'guard' ? '#8ac0ff' : '#ffd94e', shrink: true
      });
      break;
    }
  }
}
// deslocamento do herói durante a animação (dash de investida)
function heroLunge(b) {
  if (!b.act) return 0;
  const a = b.act, k = clamp(a.t / a.dur, 0, 1);
  const corpoACorpo = ['slash', 'slash2', 'flurry', 'iai'].includes(a.anim);
  if (!corpoACorpo) return k < 0.3 ? -Math.sin(k / 0.3 * Math.PI) * 5 : 0;
  // avança rápido, segura, volta
  if (k < 0.35) return -Math.pow(k / 0.35, 0.6) * 98;
  if (k < 0.75) return -98;
  return -98 * (1 - (k - 0.75) / 0.25);
}

// ---------- Desenho: batalha ----------
function drawBattle() {
  const b = G.battle;
  const cave = G.map.name === 'cave';
  const dusk = !cave && G.region === 'Templo Abandonado';
  if (R3.ligado) {
    ctx.clearRect(0, 0, VW, VH);

  } else {
  // fundo

    ctx.fillRect(vx, vy, 4, 2);
  }
  if (dusk) {
    // lua e lápides ao fundo

    ctx.fillStyle = '#4a4456';
    ctx.fillRect(40, 104, 10, 14); ctx.fillRect(42, 101, 6, 4);
    ctx.fillRect(240, 106, 9, 12); ctx.fillRect(242, 103, 5, 4);
  } else if (!cave) {
    // nuvens
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    const cx1 = (G.time * 6) % (VW + 60) - 30;
    ctx.fillRect(cx1, 22, 34, 7); ctx.fillRect(cx1 + 6, 17, 20, 6);
    const cx2 = (G.time * 4 + 150) % (VW + 60) - 30;
    ctx.fillRect(cx2, 40, 28, 6); ctx.fillRect(cx2 + 5, 36, 16, 5);
  } else {
    // cristais
    ctx.fillStyle = '#6a5a9a';
    ctx.fillRect(30, 90, 5, 14); ctx.fillRect(270, 84, 6, 18); ctx.fillRect(282, 94, 4, 10);
    ctx.fillStyle = '#8a7ac0';

  }

  // inimigo (esquerda-centro)
  const e = b.enemy;

  const escale = e.boss ? 4.4 : 4.2;
  const ew = es.width * escale, eh = es.height * escale;

  const slideE = Math.round((1 - easeOut(entrada)) * -140);

  const bob = Math.sin(G.time * 2.5) * 2;
  const ey = 118 - eh + (e.boss ? 8 : 4) + bob;
  if (e.hp > 0 || b.phase !== 'result') {
    const piscaE = b.eFlash > 0 && Math.floor(b.eFlash * 20) % 2 === 0 ? 0.4 : 1;
    if (R3.ligado) {
      R3.poeCombatente('inimigo', es, ex + ew / 2, 118 + (e.boss ? 6 : 2), eh, piscaE);
    } else {
    // sombra
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(76, 118 + (e.boss ? 6 : 2), ew * 0.35, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = piscaE;
    ctx.drawImage(es, Math.round(ex), Math.round(ey), ew, eh);
    ctx.globalAlpha = 1;
    }
    if (b.frozen) { ctx.fillStyle = 'rgba(120,190,255,0.35)'; ctx.fillRect(ex, ey, ew, eh); }
    if (b.poison > 0) { ctx.fillStyle = '#a0e84e'; ctx.font = '8px monospace'; ctx.fillText('☠', ex + ew - 6, ey + 8); }
  }
  // jogador (direita)
  // sprite de batalha em alta resolução; troca para a pose de ataque na hora certa
  const cls = curClass();
  let pose = 'idle';
  if (b.act && b.phase === 'playerAnim') {
    const k = b.act.t / b.act.dur;
    pose = (k > 0.18 && k < 0.85) ? 'atk' : 'idle';
  }
  const bs = battleSprite(cls, pose);
  const ps = bs || heroSprite(cls, 'left', Math.floor(G.time * 3) % 2);
  const pscale = bs ? 2.1 : 4;
  const sw = bs ? 32 : 16, sh = bs ? 48 : 20;
  const slideH = Math.round((1 - easeOut(clamp((b.phase === 'entrada' ? b.t : 99) / 0.55, 0, 1))) * 150);
  // respiração sutil na pose parada
  const breath = pose === 'idle' && b.phase !== 'playerAnim' ? Math.round(Math.sin(G.time * 2.4) * 1) : 0;
  const px = 238 + Math.round(heroLunge(b)) + slideH;
  const py = 122 - sh * pscale + breath;
  const piscaP = b.pFlash > 0 && Math.floor(b.pFlash * 20) % 2 === 0 ? 0.4 : 1;
  if (R3.ligado) {
    R3.poeCombatente('heroi', ps, px + sw * pscale / 2, 122, sh * pscale, piscaP);

  } else {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';

  ctx.fillStyle = '#f0e8f8';

  ctx.fillRect(13, 19, Math.round(110 * clamp(e.hp / e.maxHp, 0, 1)), 5);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(13, 19, Math.round(110 * clamp(e.hp / e.maxHp, 0, 1)), 1);
  ctx.fillStyle = '#cfc8e0'; ctx.fillText(e.hp + '/' + e.maxHp, 13, 31);
  ctx.globalAlpha = 1;

  // efeitos da técnica em curso
  if (b.phase === 'playerAnim') drawActionFX(b);

  // rastro do golpe sobre o inimigo
  if (b.slash) {
    const k = 1 - b.slash.t / 0.28;
    ctx.globalAlpha = k;
    ctx.strokeStyle = b.slash.crit ? '#ffd94e' : '#ffffff';
    ctx.lineWidth = b.slash.crit ? 3 : 2;
    ctx.beginPath();
    const sw = 46 * (1.15 - k * 0.35);
    ctx.moveTo(76 - sw / 2, 74 - sw / 2 + (1 - k) * 12);

    ctx.lineWidth = 1;

// Desenhada ao vivo em resolução cheia: as curvas das serras, o disco solar e
// as flores saem suaves, e não ampliados a partir de um buffer pequeno.
const HORIZ = 138;                     // linha do horizonte
function serra(g, base, alt, xc, cor, comNeve) {
  g.fillStyle = cor;
  g.beginPath();
  g.moveTo(xc - alt * 2.0, base);
  g.bezierCurveTo(xc - alt * 0.9, base - alt * 0.5, xc - alt * 0.34, base - alt * 0.92, xc, base - alt);
  g.bezierCurveTo(xc + alt * 0.34, base - alt * 0.92, xc + alt * 0.9, base - alt * 0.5, xc + alt * 2.0, base);
  g.closePath();
  g.fill();
  if (!comNeve) return;
  // a neve é recortada DENTRO do contorno da montanha, então nunca descola
  g.save();
  g.clip();
  g.fillStyle = comNeve;
  g.beginPath();
  g.moveTo(xc - alt, base - alt * 0.83);
  const dentes = [[-.42, .855], [-.33, .825], [-.24, .875], [-.15, .84], [-.05, .885],
                  [.05, .845], [.15, .88], [.25, .835], [.34, .87], [.43, .84]];
  for (const [dx, dy] of dentes) g.lineTo(xc + alt * dx, base - alt * dy);
  g.lineTo(xc + alt, base - alt * 0.83);
  g.lineTo(xc + alt, base - alt * 1.2);
  g.lineTo(xc - alt, base - alt * 1.2);
  g.closePath();
  g.fill();
  g.restore();
}
function flor(g, x, y, r, cor, miolo) {
  g.fillStyle = cor;
  for (let i = 0; i < 5; i++) {
    const a = i * Math.PI * 0.4 - 0.4;
    g.beginPath();
    g.ellipse(x + Math.cos(a) * r * 0.62, y + Math.sin(a) * r * 0.62, r * 0.52, r * 0.46, a, 0, Math.PI * 2);
    g.fill();
  }
  g.fillStyle = miolo;
  g.beginPath(); g.arc(x, y, r * 0.28, 0, Math.PI * 2); g.fill();
}
// posições das flores do ramo, sorteadas uma vez só
let ramoFlores = null;
function montaRamo() {
  if (ramoFlores) return ramoFlores;
  const r = seeded(20240815);
  const out = [];
  const cachos = [[6, 8], [22, 13], [38, 16], [54, 17], [70, 15], [86, 12], [102, 9], [26, 27], [58, 31], [72, 25], [104, 24]];
  for (const [cx, cy] of cachos) {
    const n = 5 + Math.floor(r() * 4);
    for (let i = 0; i < n; i++) {
      out.push({
        x: cx + (r() - 0.5) * 13, y: cy + (r() - 0.5) * 11,
        r: 1.5 + r() * 1.4, t: r() * 6.28,
        c: ['#f7b3c6', '#ffd6e2', '#e88fa8', '#ffc2d4'][Math.floor(r() * 4)]
      });
    }
  }
  ramoFlores = out;
  return out;
}

function updateTitle() {
  const n = hasSave() ? 2 : 1;
  if (tap('up')) { G.titleIdx = (G.titleIdx + n - 1) % n; AU.sfx('menu'); }
  if (tap('down')) { G.titleIdx = (G.titleIdx + 1) % n; AU.sfx('menu'); }
  if (tap('ok')) {
    AU.sfx('ok');
    const isContinue = hasSave() && G.titleIdx === 0;
    if (isContinue && loadGame()) return;
    startNewGame();
  }

function updatePauseMenu() {
  const wt = weaponType();
  const repLen = wt ? WEAPON_SKILLS[wt].length : 0;
  const listLen = G.menuTab === 0 ? ALLOC.length
    : G.menuTab === 1 ? Math.max(1, (wt ? curSkills().length : 0) + repLen)
    : G.menuTab === 2 ? Math.max(1, P.equipInv.length)
    : G.menuTab === 4 ? Math.max(1, P.pets.length)
    : Object.keys(ITEMS).length;
  if (tap('left')) { G.menuTab = (G.menuTab + 4) % 5; G.menuIdx = 0; AU.sfx('menu'); }
  if (tap('right')) { G.menuTab = (G.menuTab + 1) % 5; G.menuIdx = 0; AU.sfx('menu'); }
  // Q desmonta a peça em foco na mochila
  if (tap('alt')) {
    if (G.menuTab === 2 && P.equipInv[G.menuIdx]) {
      const idx = G.menuIdx;
      askConfirm('Desmontar ' + eqName(P.equipInv[idx]) + '?', dismantleYield(P.equipInv[idx]), () => {
        desmontar(idx);
        G.menuIdx = Math.max(0, Math.min(G.menuIdx, P.equipInv.length - 1));
      });
    } else AU.sfx('back');
  }
  if (tap('up')) { G.menuIdx = (G.menuIdx + listLen - 1) % listLen; AU.sfx('menu'); }
  if (tap('down')) { G.menuIdx = (G.menuIdx + 1) % listLen; AU.sfx('menu'); }
  if (tap('ok')) {
    if (G.menuTab === 0) {
      // aplicar ponto de status
      if (P.pts > 0) {
        const a = ALLOC[G.menuIdx];
        P.pts--;
        P[a.key] += a.gain || 1;
        if (a.key === 'maxHp') P.hp += a.gain;
        if (a.key === 'maxMp') P.mp += a.gain;
        AU.sfx('ok');
      } else AU.sfx('back');
    } else if (G.menuTab === 1) {
      // equipar/trocar técnica
      const t2 = weaponType();
      const rep = t2 ? WEAPON_SKILLS[t2] : [];
      const eqs = t2 ? curSkills() : [];
      if (G.menuIdx >= eqs.length && rep.length) {
        const [id, lvl] = rep[G.menuIdx - eqs.length];
        if (P.lvl < lvl) { toast('Requer nível ' + lvl); AU.sfx('back'); }
        else if (eqs.includes(id)) { toast('Já equipada'); AU.sfx('back'); }
        else if (eqs.length < MAX_SKILLS) { equipSkill(id); AU.sfx('ok'); toast(SKILLS[id].name + ' equipada!'); saveGame(); }
        else { G.learnQueue.push(id); G.state = 'learn'; G.learnIdx = 0; AU.sfx('ok'); }
      } else AU.sfx('back');
    } else if (G.menuTab === 2) {
      if (P.equipInv[G.menuIdx]) {
        equipFromInv(G.menuIdx);
        G.menuIdx = Math.min(G.menuIdx, Math.max(0, P.equipInv.length - 1));
        AU.sfx('ok');
      } else AU.sfx('back');
    } else if (G.menuTab === 4) {
      const id = P.pets[G.menuIdx];
      if (id) {
        P.activePet = P.activePet === id ? null : id;
        clampVitals();
        AU.sfx('ok');
      } else AU.sfx('back');
    } else {
      const its = Object.keys(ITEMS);
      const id = its[G.menuIdx];
      const it = ITEMS[id];
      const E = eff();
      const hurt = P.hp < E.maxHp, drained = P.mp < E.maxMp;
      if (P.items[id] > 0 && !it.battleOnly) {
        let used = true;
        if (id === 'pocao' && hurt) { P.hp = Math.min(E.maxHp, P.hp + Math.round(E.maxHp * 0.45)); addFloater(P.x + 8, P.y - 4, '+HP', '#6ee86e'); }
        else if (id === 'pocaoG' && hurt) { P.hp = Math.min(E.maxHp, P.hp + Math.round(E.maxHp * 0.8)); addFloater(P.x + 8, P.y - 4, '+HP', '#6ee86e'); }
        else if (id === 'pao' && (hurt || drained)) {
          P.hp = Math.min(E.maxHp, P.hp + Math.round(E.maxHp * 0.2));
          P.mp = Math.min(E.maxMp, P.mp + Math.round(E.maxMp * 0.2));
          addFloater(P.x + 8, P.y - 4, '+HP/MP', '#6ee86e');
        }
        else if (id === 'eter' && drained) { P.mp = Math.min(E.maxMp, P.mp + Math.round(E.maxMp * 0.4)); addFloater(P.x + 8, P.y - 4, '+MP', '#6ea8ff'); }
        else if (id === 'elixir' && (hurt || drained)) { P.hp = E.maxHp; P.mp = E.maxMp; addFloater(P.x + 8, P.y - 4, 'MAX!', '#ffd94e'); }
        else used = false;
        if (used) {
          P.items[id]--;
          AU.sfx('heal');
          burst(P.x + 8, P.y + 8, 10, { color: ['#6ee86e', '#a0f0a0', '#dcffdc'], spdMax: 40, lifeMax: 0.6, size: 1, lift: 20 });
        } else AU.sfx('back');
      } else AU.sfx('back');
    }
  }
  if (tap('back') || tap('menu')) { G.state = 'world'; AU.sfx('back'); saveGame(); }
}

           'arm2', 'arm9', 'bot2', 'elm2', 'elm6', 'luv2', 'amu2'],

};
// estoque em exibição: fixo da vila ou a carga do mascate
function estoqueLoja() { return G.shopId === 'mascate' ? G.shopStock : SHOP_STOCK[G.shopId]; }
function shopEntry(s) {
  const e = shopEntryBase(s);
  if (G.shopId === 'mascate' && G.shopNPC) e.price = precoMascate(e, G.shopNPC.margem);
  return e;
}
function shopEntryBase(s) {
  if (s.startsWith('i:')) {
    const id = s.slice(2);
    return { kind: 'item', id, name: ITEMS[id].name, desc: ITEMS[id].desc, price: ITEMS[id].price, color: '#c8c8d0' };
  }
  const eq = EQUIP[s];
  return { kind: 'equip', id: s, name: eq.name, desc: RARITY[eq.rar].name + ' · ' + SLOT_NAMES[eq.slot], price: equipPrice(s), color: RARITY[eq.rar].color };
}

function updateShop() {
  const stock = estoqueLoja();
  if (tap('up')) { G.shopIdx = (G.shopIdx + stock.length - 1) % stock.length; AU.sfx('menu'); }
  if (tap('down')) { G.shopIdx = (G.shopIdx + 1) % stock.length; AU.sfx('menu'); }
  if (tap('ok')) {
    const e = shopEntry(stock[G.shopIdx]);
    if (P.gold >= e.price) {
      if (e.kind === 'item') {
        if (P.items[e.id] < 9) { P.gold -= e.price; P.items[e.id]++; AU.sfx('coin'); saveGame(); }
        else AU.sfx('back');
      } else {
        if (P.equipInv.length < 18) { P.gold -= e.price; P.equipInv.push(e.id); AU.sfx('coin'); saveGame(); }
        else { toast('Mochila cheia!'); AU.sfx('back'); }
      }
    } else AU.sfx('back');
  }
  if (tap('back')) { G.state = 'world'; AU.sfx('back'); }
}

// ---------- Altar: encantar e desmontar ----------
// modo 0 = encantar (equipados + mochila), modo 1 = desmontar (só mochila)
function altarList() {
  const out = [];
  if (G.altarMode === 0) {
    for (const s of SLOTS) if (P.equip[s]) out.push({ id: P.equip[s], where: SLOT_NAMES[s] });
  }
  P.equipInv.forEach((id, i) => out.push({ id, where: 'mochila', idx: i }));
  return out;
}
function drawMatBar(x, y) {
  ctx.fillStyle = '#b06ae8';

    mx += t.length * 4.4 + 6;

}
function drawEnchant() {
  drawWorld(true);
  ctx.fillStyle = 'rgba(8,6,16,0.85)';

  if (foco) {
    if (G.altarMode === 0) {
      const mc = enchMatCost(foco.id);
      if (enchLvl(foco.id) >= ENCH_MAX) { ctx.fillStyle = '#ffd94e'; ctx.fillText('Encanto no máximo', x + 14, y + 128); }
      else if (mc) {

function encantar(id) {
  P.frags -= enchCost(id);
  const mc = enchMatCost(id);
  if (mc) P.mats[mc.mat] -= mc.n;
  P.ench[id] = enchLvl(id) + 1;
  AU.sfx('level');
  addFloater(P.x + 8, P.y - 4, '+' + P.ench[id], '#d8a0ff');
  burstScreen(VW / 2, VH / 2, 30, { color: ['#b06ae8', '#d8a0ff', '#e0b8ff'], spdMax: 100, lifeMax: 0.9, size: 2, drag: 2.5 });
  clampVitals();
  saveGame();
}
function desmontar(idx) {
  const id = P.equipInv[idx];
  const yl = dismantleFromInv(idx);
  if (!yl) return;
  AU.sfx('ok');
  toast(EQUIP[id].name + ' → ◆' + yl.frags + ' · ' + matsText(yl.mats));
  burstScreen(VW / 2, VH / 2, 24, { color: ['#9aa0b0', '#d8d0b0', '#e0a0c8'], spdMax: 90, lifeMax: 0.7, size: 2, g: 90 });
  saveGame();
}
function updateEnchant() {
  const lista = altarList();
  const n = Math.max(1, lista.length);
  if (tap('left') || tap('right')) { G.altarMode = G.altarMode ? 0 : 1; G.menuIdx = 0; AU.sfx('menu'); }
  if (tap('up')) { G.menuIdx = (G.menuIdx + n - 1) % n; AU.sfx('menu'); }
  if (tap('down')) { G.menuIdx = (G.menuIdx + 1) % n; AU.sfx('menu'); }
  if (tap('ok')) {
    const foco = lista[G.menuIdx];
    if (!foco) { AU.sfx('back'); }
    else if (G.altarMode === 0) {
      if (canEnchant(foco.id)) encantar(foco.id);
      else AU.sfx('back');
    } else {
      askConfirm('Desmontar ' + eqName(foco.id) + '?', dismantleYield(foco.id), () => {
        desmontar(foco.idx);
        G.menuIdx = Math.max(0, Math.min(G.menuIdx, altarList().length - 1));
      });
    }
  }
  if (tap('back')) { G.state = 'world'; AU.sfx('back'); saveGame(); }
}

// ---------- Diálogo ----------
function drawDialog() {
  const txt = G.msgQueue[0];
  const lines = txt.split('\n');
  const h = 16 + lines.length * 10;
  const y = VH - h - 6;
  ctx.fillStyle = 'rgba(12,10,22,0.94)';
  ctx.fillRect(8, y, VW - 16, h);
  ctx.strokeStyle = '#7a6aa8';
  ctx.strokeRect(8.5, y + 0.5, VW - 17, h - 1);
  ctx.font = '8px monospace';
  G.msgChar += 1.6;
  let shown = 0;
  for (let i = 0; i < lines.length; i++) {
    const avail = Math.max(0, Math.floor(G.msgChar) - shown);
    ctx.fillStyle = '#f0e8f8';
    ctx.fillText(lines[i].slice(0, avail), 16, y + 13 + i * 10);
    shown += lines[i].length;
  }
  if (G.msgChar >= shown && Math.floor(G.time * 3) % 2) {
    ctx.fillStyle = '#ffd94e';
    ctx.fillText('▼', VW - 24, y + h - 5);
  }
}
function updateDialog() {
  const txt = G.msgQueue[0];
  const total = txt.replace(/\n/g, '').length;
  if (tap('ok') || tap('back')) {
    if (G.msgChar < total) G.msgChar = total;
    else { G.msgQueue.shift(); G.msgChar = 0; AU.sfx('menu'); }
  }
}

// ---------- Loop principal ----------
let lastT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  G.time += dt;
  AU.update(dt);
  updateFade(dt);

  // update
  if (G.fadeDir === 0 || G.fade < 1) {
    if (G.msgQueue.length && (G.state === 'world')) {
      updateDialog();
    } else {
      switch (G.state) {
        case 'title': updateTitle(); break;
        case 'world': if (G.fadeDir === 0) updateWorld(dt); break;
        case 'battle': updateBattle(dt); break;
        case 'menu': updatePauseMenu(); break;
        case 'shop': updateShop(); break;
        case 'enchant': updateEnchant(); break;
        case 'confirm': updateConfirm(); break;
        case 'quest': updateQuestOferta(); break;
        case 'learn': updateLearn(); break;
        case 'create': updateCreate(); break;
        case 'gameover': updateGameOver(); break;
        case 'victory': updateVictory(); break;
      }
    }
  }
  if (G.battleFlash > 0) G.battleFlash = Math.max(0, G.battleFlash - dt * 3.2);
  // partículas e ambiente
  updateParticles(dt);
  if (G.state === 'world' && G.map) { updateAmbient(dt); updateNPCs(dt); }

  // floaters
  for (const f of G.floaters) f.t += dt;
  G.floaters = G.floaters.filter(f => f.t < 1.2);
  for (const t of G.toasts) t.t += dt;
  G.toasts = G.toasts.filter(t => t.t < 2);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);

  // draw
  if (R3.ok) R3.mostra(ESTADOS_3D.has(G.state));
  ctx.save();
  if (G.shake > 0.5) ctx.translate(irnd(-G.shake, G.shake) * 0.5, irnd(-G.shake, G.shake) * 0.5);
  switch (G.state) {
    case 'title': drawTitle(); break;
    case 'world': drawWorld(); break;
    case 'battle': drawBattle(); break;
    case 'menu': drawPauseMenu(); break;
    case 'shop': drawShop(); break;
    case 'enchant': drawEnchant(); break;
    case 'confirm': drawConfirm(); break;
    case 'quest': drawQuestOferta(); break;
    case 'learn': drawLearn(); break;
    case 'create': drawCreate(); break;
    case 'gameover': drawGameOver(); break;
    case 'victory': drawVictory(); break;
  }
  // floaters do mundo
  if (G.state === 'world' || G.state === 'menu') {
    for (const f of G.floaters) {
      ctx.font = 'bold 8px monospace';
      ctx.globalAlpha = f.t > 0.8 ? (1.2 - f.t) / 0.4 : 1;
      ctx.fillStyle = '#0e0c16';
      ctx.fillText(f.txt, f.x - G.camX + 1, f.y - G.camY - f.t * 18 + 1);
      ctx.fillStyle = f.color;
      ctx.fillText(f.txt, f.x - G.camX, f.y - G.camY - f.t * 18);
      ctx.globalAlpha = 1;
    }
  }
  if (G.msgQueue.length && G.state === 'world') drawDialog();
  // toasts
  if (G.state !== 'battle') G.toasts.forEach((t, i) => {
    ctx.font = '7px monospace';
    ctx.globalAlpha = t.t > 1.5 ? (2 - t.t) / 0.5 : 1;
    ctx.fillStyle = 'rgba(12,10,22,0.9)';
    const tw = ctx.measureText(t.txt).width;
    ctx.fillRect(VW / 2 - tw / 2 - 4, 6 + i * 14, tw + 8, 11);
    ctx.fillStyle = '#f0e8f8';
    ctx.fillText(t.txt, VW / 2 - tw / 2, 14 + i * 14);
    ctx.globalAlpha = 1;
  });
  ctx.restore();

  if (G.fade > 0) {
    ctx.fillStyle = 'rgba(6,4,12,' + G.fade + ')';
    ctx.fillRect(0, 0, VW, VH);
  }

  // blit para tela
  mainCtx.imageSmoothingEnabled = false;
  mainCtx.clearRect(0, 0, cv.width, cv.height);
  mainCtx.drawImage(buf, 0, 0);

  // toques que ninguém consumiu envelhecem e caem fora, para uma tecla que a
  // tela atual ignora não travar a fila
  for (const e of filaToques) e.idade++;
  filaToques = filaToques.filter(e => e.idade < 8);
  requestAnimationFrame(frame);
}
// Liga a cena 3D. Se o navegador não tiver WebGL, o jogo segue no
// renderizador 2D original sem perder nada.
if (!R3.init()) console.warn('WebGL indisponível: usando o renderizador 2D');
requestAnimationFrame(frame);

  save() { saveGame(); },
  curSkills() { return curSkills(); },
  setSkills(arr) { const t = weaponType(); if (t) P.skillSets[t] = arr.slice(); },
  battleSprite(c,p) { return battleSprite(c,p); },
  skills() { return SKILLS; },
  weaponSkills() { return WEAPON_SKILLS; },
  heroSprite(cls, dir, frame) { return heroSprite(cls, dir, frame); },
  pets() { return PETS; },
  equipCatalog() { return EQUIP; },
  applyEnemyHit(b) { return applyEnemyHit(b); },
  clearEnemies() { G.entities = G.entities.filter(e => e.isBoss); G.spawnTimer = 60; },
  clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
  r3() { return { ok: R3.ok, ligado: R3.ligado, mapa: R3.mapaNome,
    malhas: R3.grupoMapa ? R3.grupoMapa.children.length : 0,
    billboards: [...R3.bill.keys()].filter(k => R3.bill.get(k).visible),
    chamadas: R3.rend ? R3.rend.info.render.calls : 0,
    triangulos: R3.rend ? R3.rend.info.render.triangles : 0,
    cam: R3.cam ? [+R3.cam.position.x.toFixed(2), +R3.cam.position.y.toFixed(2), +R3.cam.position.z.toFixed(2)] : null }; },
  r3Zoom(f) { R3.zoom = f; R3.aplicaZoom(f); },
  r3Inc(v) { R3.inc = v; },
  r3Force2D(v) { R3.forcado2D = v; if (v) R3.mostra(false); },
  filaVazia() { return filaToques.length === 0; },
  npcs() { return G.npcs; },
  npcPerto() { return npcPerto(); },
  quests() { return QUESTS; },
  questAtivas() { return P.quests.ativas; },
  questFeitas() { return P.quests.feitas; },
  questOferecida(id) { return questOferecida(id); },
  aceitaQuest(id) { aceitaQuest(id); },
  questMatou(t) { questMatou(t); },
  questFoco() { return questFoco(); },
  alvoDaQuest(id) { return alvoDaQuest(id); },
  estoqueMascate(id) { const n = G.npcs.find(v => v.id === id); return n ? estoqueMascate(n) : null; },
  precoMascate(s2, m) { return precoMascate(shopEntryBase(s2), m); },
  shopEntry(s2) { return shopEntry(s2); },
  irPara(id) { const n = G.npcs.find(v => v.id === id); if (n) { P.x = n.x; P.y = n.y + TILE; P.dir = 'up'; } return !!n; }
};
</script>
