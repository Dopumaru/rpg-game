<!DOCTYPE html>

<head>

<script>
'use strict';
/* ============================================================
   CRÔNICAS DE PIXEL — um RPG em pixels
   Classes, níveis, progressão de status, combate por turnos.
   ============================================================ */

// ---------- Constantes ----------
const VW = 320, VH = 180, TILE = 16;
const cv = document.getElementById('screen');
const mainCtx = cv.getContext('2d');
// camada de texto em resolução cheia (texto nítido sobre a arte em pixels)
// Tudo é desenhado num único buffer em RESOLUÇÃO CHEIA, com as coordenadas
// lógicas de sempre (320×180) aplicadas por transform. Assim painéis, barras,
// degradês e texto saem nítidos no tamanho real da tela, enquanto os sprites
// em pixel art continuam ampliados por vizinho mais próximo — o visual híbrido
// 2D/3D em que o pixel é escolha, não limitação.
let SCALE = 3;
const buf = document.createElement('canvas');
const ctx = buf.getContext('2d');
function resizeScreen() {
  const availW = window.innerWidth, availH = window.innerHeight - 30;
  // escala inteira para a arte em pixels continuar alinhada
  SCALE = Math.max(2, Math.min(6, Math.floor(Math.min(availW / VW, availH / VH))));
  cv.width = VW * SCALE;
  cv.height = VH * SCALE;
  buf.width = cv.width;
  buf.height = cv.height;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const fit = Math.max(1, Math.min(availW / VW, availH / VH));
  cv.style.width = Math.round(VW * fit) + 'px';
  cv.style.height = Math.round(VH * fit) + 'px';
  const cvGl = document.getElementById('gl');
  if (cvGl) {
    cvGl.style.width = cv.style.width;
    cvGl.style.height = cv.style.height;
  }
  mainCtx.imageSmoothingEnabled = false;
  // R3 é declarado bem depois; na primeira chamada ainda não existe
  try { if (R3.ok) R3.redimensiona(); } catch (e) {}
}
window.addEventListener('resize', resizeScreen);
resizeScreen();
// caixas que cobrem outra tela: agora é um fillRect comum, porque não há mais
// duas camadas para sincronizar
function coverRect(x, y, w, h, fill) {
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
}

// ---------- Utilidades ----------
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
// hash determinístico p/ variação de tiles
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >> 13)) * 1274126177 | 0;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}

// ---------- Entrada ----------
const keys = {};
const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  W: 'up', S: 'down', A: 'left', D: 'right',
  z: 'ok', Z: 'ok', Enter: 'ok', ' ': 'ok',
  x: 'back', X: 'back', Escape: 'back',
  c: 'menu', C: 'menu', m: 'mute', M: 'mute',
  q: 'alt', Q: 'alt',
  Shift: 'run'
};
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (k) {
    e.preventDefault();
    // Fila ordenada de toques: nada se perde quando vários caem no mesmo
    // quadro, e a ORDEM é respeitada — apertar ↓↓↓ e Z depressa não faz o Z
    // valer antes das setas.
    if (!keys[k] && filaToques.length < 10) filaToques.push({ k, idade: 0 });
    keys[k] = true;
    AU.init();
    if (k === 'mute') { AU.muted = !AU.muted; toast(AU.muted ? 'Som desligado' : 'Som ligado'); }
  }
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
// só consome se for o toque mais antigo pendente, para manter a ordem
function tap(k) {
  if (!filaToques.length || filaToques[0].k !== k) return false;
  filaToques.shift();
  return true;
}
// espia o próximo toque sem consumir
function proxToque() { return filaToques.length ? filaToques[0].k : null; }

// consulta sem consumir (para distinguir esquerda/direita no mesmo quadro)
let ultimaDir = null;
function tap2(k) { return ultimaDir === k; }

const AU = {
  ctx: null, muted: false, musicTimer: 0, musicStep: 0, track: null,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } },
  tone(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();

    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);

    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  sfx(name) {
    switch (name) {
      case 'menu':    this.tone(660, 0.05, 'square', 0.04); break;
      case 'ok':      this.tone(784, 0.06, 'square', 0.05); this.tone(1046, 0.08, 'square', 0.04); break;
      case 'back':    this.tone(392, 0.07, 'square', 0.04); break;
      case 'hit':     this.tone(180, 0.12, 'sawtooth', 0.08, -120); break;
      case 'crit':    this.tone(240, 0.16, 'sawtooth', 0.1, -180); this.tone(120, 0.2, 'square', 0.07, -60); break;
      case 'hurt':    this.tone(140, 0.18, 'sawtooth', 0.09, -90); break;
      case 'heal':    this.tone(523, 0.09, 'triangle', 0.06); setTimeout(() => this.tone(784, 0.12, 'triangle', 0.06), 90); break;
      case 'magic':   this.tone(880, 0.2, 'sine', 0.06, 500); this.tone(440, 0.15, 'triangle', 0.05, 300); break;
      case 'coin':    this.tone(988, 0.06, 'square', 0.05); setTimeout(() => this.tone(1319, 0.1, 'square', 0.05), 60); break;
      case 'level':   [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.14, 'square', 0.06), i * 100)); break;
      case 'battle':  this.tone(220, 0.3, 'sawtooth', 0.07, 400); break;
      case 'flee':    this.tone(600, 0.2, 'triangle', 0.05, -300); break;
      case 'die':     [392, 330, 262, 196].forEach((f, i) => setTimeout(() => this.tone(f, 0.2, 'triangle', 0.06), i * 160)); break;
      case 'victory': [659, 659, 659, 880].forEach((f, i) => setTimeout(() => this.tone(f, i === 3 ? 0.4 : 0.12, 'square', 0.06), i * 130)); break;
      case 'boss':    this.tone(110, 0.5, 'sawtooth', 0.09, -40); break;
      case 'chest':   [523, 659, 784].forEach((f, i) => setTimeout(() => this.tone(f, 0.1, 'square', 0.05), i * 70)); break;
    }
  },
  // trilhas: [semitom midi ou 0=pausa]
  // Escala hirajoshi (D F G A C) — sonoridade tradicional japonesa
  WORLD: { notes: [62, 65, 67, 69, 72, 69, 67, 65, 62, 65, 69, 67, 65, 62, 60, 62], step: 0.32, type: 'triangle', vol: 0.030, bass: [50, 0, 45, 0] },
  // Escala in-sen, tensa e rápida para o combate
  BATTLE: { notes: [62, 63, 67, 62, 69, 67, 63, 62, 67, 69, 70, 69, 67, 63, 62, 60], step: 0.15, type: 'square', vol: 0.028, bass: [50, 50, 46, 48] },
  // Kumoi esparsa e sombria para a caverna
  CAVE: { notes: [62, 0, 63, 0, 67, 0, 69, 0, 67, 0, 63, 0, 62, 0, 58, 0], step: 0.36, type: 'triangle', vol: 0.028, bass: [50, 0, 46, 0] },
  setTrack(t) { if (this.track !== t) { this.track = t; this.musicStep = 0; this.musicTimer = 0; } },
  update(dt) {
    if (!this.ctx || this.muted || !this.track) return;
    this.musicTimer -= dt;
    if (this.musicTimer <= 0) {
      const tr = this.track;
      this.musicTimer = tr.step;
      const n = tr.notes[this.musicStep % tr.notes.length];
      if (n) this.tone(440 * Math.pow(2, (n - 69) / 12), tr.step * 0.9, tr.type, tr.vol);
      const b = tr.bass[Math.floor(this.musicStep / 4) % tr.bass.length];
      if (b && this.musicStep % 2 === 0) this.tone(440 * Math.pow(2, (b - 69) / 12), tr.step * 0.8, 'triangle', tr.vol * 0.9);
      this.musicStep++;
    }
  }
};

// ---------- Sprites (pixel art por strings) ----------
// Cada sprite: linhas de chars; paleta mapeia char->cor. '.' = transparente
const spriteCache = new Map();
function makeSprite(rows, pal, id) {
  if (id && spriteCache.has(id)) return spriteCache.get(id);
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x];
    if (ch !== '.' && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
  }
  if (id) spriteCache.set(id, c);
  return c;
}
function flipSprite(spr, id) {
  if (id && spriteCache.has(id)) return spriteCache.get(id);
  const c = document.createElement('canvas'); c.width = spr.width; c.height = spr.height;
  const g = c.getContext('2d');
  g.translate(spr.width, 0); g.scale(-1, 1); g.drawImage(spr, 0, 0);
  if (id) spriteCache.set(id, c);
  return c;
}

// Sprite do mapa (16x20): usa a aparência escolhida e o que está equipado.
// A cabeça varia com o elmo (se houver) ou com o estilo de cabelo.
function mapHeadKind() {
  const elmo = P && P.equip && P.equip.elmo;
  if (elmo) {
    const n = EQUIP[elmo] && EQUIP[elmo].name || '';
    if (n.includes('Eboshi')) return 'onmyoji';
    if (n.includes('Zukin') || n.includes('Menpo')) return 'shinobi';
  }
  const est = (P && P.look ? P.look.cabelo : 0) % ESTILO_CABELO.length;
  // longo e rabo caem dos lados; os demais ficam presos ao alto
  return (est === 2 || est === 4) ? 'kyudoka' : 'samurai';
}
function heroSprite(cls, dir, frame) {
  const step = WALK_CYCLE[(frame | 0) % WALK_CYCLE.length];
  const lk = (P && P.look) || defaultLook();
  const kind = mapHeadKind();
  const corpoId = P && P.equip && P.equip.corpo;
  const id = `hero_${kind}_${lk.pele}_${lk.corCabelo}_${lk.olhos}_${corpoId || 'x'}_${dir}_${step}`;
  if (spriteCache.has(id)) return spriteCache.get(id);
  const pal = lookPal();
  const heads = HEADS[kind] || HEADS.samurai;
  const headDir = (dir === 'left' || dir === 'right') ? 'side' : dir;
  const bodyDir = (dir === 'left' || dir === 'right') ? 'side' : 'down';
  const rows = heads[headDir].concat(BODIES[bodyDir + step]);
  let spr = makeSprite(rows, pal);
  if (dir === 'left') spr = flipSprite(spr);
  spriteCache.set(id, spr);
  return spr;
}

function defaultLook() {
  return { corpo: 0, pele: 0, cabelo: 0, corCabelo: 0, olhos: 0 };
}
// paleta montada a partir da aparência + equipamento atual
function lookPal() {
  const lk = (P && P.look) || defaultLook();
  const pele = PELE[lk.pele % PELE.length];
  const cab = COR_CABELO[lk.corCabelo % COR_CABELO.length];
  const olho = COR_OLHOS[lk.olhos % COR_OLHOS.length];
  // cores do peitoral: do equipamento, com fallback para roupa simples
  const corpoId = P && P.equip && P.equip.corpo;
  const arte = corpoId && ARMOR_ART[EQUIP[corpoId].atype] ? ARMOR_ART[EQUIP[corpoId].atype] : ARMOR_ART.none;
  return {
    O: '#1a1420',
    S: pele.S, s: pele.s, b: pele.b, m: '#c4756a',
    H: cab.H, h: cab.h, d: cab.d,
    E: '#1a1420', I: olho.I, W: '#ffffff',
    A: arte.A, a: arte.a, c: arte.c, B: arte.B, L: arte.L,
    M: '#d8dce8', G: '#8a6a42', Y: '#e8c050', R: '#c0392b', P: '#e8e4ee'
  };
}

// --- composição: monta o sprite completo em camadas ---
function composeSprite(pose) {
  const lk = (P && P.look) || defaultLook();
  const wt = weaponType() || 'katana';
  const corpoId = P && P.equip && P.equip.corpo;
  const atype = corpoId ? (EQUIP[corpoId].atype || 'none') : 'none';
  const elmoId = P && P.equip && P.equip.elmo;
  const helm = elmoId ? HELM_OF[elmoId] : null;
  const key = ['bt', pose, lk.corpo, lk.pele, lk.cabelo, lk.corCabelo, lk.olhos, wt, atype, helm || '-'].join('_');
  if (spriteCache.has(key)) return spriteCache.get(key);

  const pal = lookPal();
  const W = 32, H = 48;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const stamp = (rows, oy, palOverride) => {
    if (!rows) return;
    const p = palOverride ? Object.assign({}, pal, palOverride) : pal;
    for (let y = 0; y < rows.length; y++) {
      const yy = y + (oy || 0);
      if (yy < 0 || yy >= H) continue;
      for (let x = 0; x < rows[y].length && x < W; x++) {
        const ch = rows[y][x];
        if (ch !== '.' && p[ch]) { g.fillStyle = p[ch]; g.fillRect(x, yy, 1, 1); }
      }
    }
  };
  // 1. corpo (rosto e pernas)
  const body = BODY_ART[CORPO[lk.corpo % CORPO.length].name.toLowerCase()] || BODY_ART.esbelto;
  stamp(body[pose] || body.idle, 0);
  // 2. peitoral por cima do torso
  const armor = ARMOR_ART[atype] || ARMOR_ART.none;
  stamp(armor.rows, pose === 'atk' ? 13 : 13);
  // 3. cabelo
  const estilo = ESTILO_CABELO[lk.cabelo % ESTILO_CABELO.length].name.toLowerCase();
  stamp(HAIR_ART[estilo] || HAIR_ART.espetado, pose === 'atk' ? 1 : 0);
  // 4. elmo/chapéu
  if (helm && HELM_ART[helm]) stamp(HELM_ART[helm], pose === 'atk' ? 1 : 0, HELM_PAL[helm]);
  // 5. arma
  const w = WEAPON_ART[wt];
  if (w) stamp(pose === 'atk' ? w.atk : w.idle, pose === 'atk' ? w.atkY : w.idleY);

  spriteCache.set(key, c);
  return c;
}
function battleSprite(cls, pose) { return composeSprite(pose === 'atk' ? 'atk' : 'idle'); }

function enemySprite(type) {
  const id = 'enemy_' + type;
  if (spriteCache.has(id)) return spriteCache.get(id);
  const a = ENEMY_ART[type];
  const s = makeSprite(a.rows, a.pal);
  spriteCache.set(id, s);
  return s;
}

function genOverworld() {
  const W = 96, H = 64;
  const t = [];
  for (let y = 0; y < H; y++) { t.push(new Array(W).fill(0)); }
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < W && y < H) t[y][x] = v; };
  const rect = (x, y, w, h, v) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) set(i, j, v); };
  // bordas de árvores
  rect(0, 0, W, 2, 1); rect(0, H - 2, W, 2, 1); rect(0, 0, 2, H, 1); rect(W - 2, 0, 2, H, 1);
  // montanhas ao norte + entrada da caverna
  rect(0, 0, W, 10, 8);
  set(48, 9, 11); set(47, 10, 3); set(48, 10, 3); set(49, 10, 3);
  set(47, 11, 25); set(48, 11, 26); // torii guardando a caverna (topo)
  set(47, 12, 29); set(48, 12, 30); // pilares
  // rio horizontal + pontes
  rect(2, 28, 92, 3, 2);
  rect(20, 28, 2, 3, 7); rect(48, 28, 2, 3, 7); rect(76, 28, 2, 3, 7);
  // FLORESTA UMBRIA (oeste) com clareira do Rei Slime
  for (let y = 32; y < 43; y++) for (let x = 6; x < 27; x++) {
    if (hash2(x, y) < 0.6) set(x, y, 1);
  }
  rect(11, 35, 7, 5, 0);
  // BOSQUE SOMBRIO (leste)
  for (let y = 34; y < 49; y++) for (let x = 56; x < 91; x++) {
    if (hash2(x + 7, y + 3) < 0.55) set(x, y, 1);
  }
  // bolsões de árvores no norte e campos
  for (let i = 0; i < 40; i++) {
    const cx = irnd(4, 91), cy = irnd(11, 60), r = irnd(1, 2);
    if (cx > 10 && cx < 30 && cy > 42) continue;      // Vila Sakuramura
    if (cx > 64 && cx < 86 && cy > 12 && cy < 26) continue; // Vila Iwamura
    if (cx > 72 && cy > 48) continue;                  // cemitério
    for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
      if (hash2(x * 3, y * 3) < 0.7 && t[y] && t[y][x] === 0) set(x, y, 1);
    }
  }
  // lagoa central
  for (let y = 35; y < 42; y++) for (let x = 31; x < 39; x++) {
    if (Math.hypot(x - 34.5, y - 38) < 3.2) set(x, y, 2);
  }
  // ALDEIA VERDE (sul)
  rect(12, 44, 17, 13, 0);
  rect(14, 45, 4, 2, 18); rect(14, 47, 4, 2, 5); set(15, 48, 19);
  rect(23, 45, 4, 2, 18); rect(23, 47, 4, 2, 5); set(24, 48, 19);
  set(20, 50, 13); // chozuya (fonte)
  rect(23, 52, 3, 1, 18); set(23, 53, 5); set(24, 53, 14); set(25, 53, 5); // loja
  rect(20, 44, 1, 13, 28); rect(13, 50, 15, 1, 28); // piso de pedra do templo
  set(20, 50, 13);
  set(16, 53, 21); // altar de encantamento
  set(19, 42, 25); set(20, 42, 26);  // torii na entrada norte (topo)
  set(19, 43, 29); set(20, 43, 30);  // pilares
  set(18, 51, 27); set(22, 51, 27);  // lanternas junto ao chozuya
  set(14, 52, 27); set(26, 52, 27);
  // VILA ROCHA (nordeste, junto às montanhas)
  rect(66, 13, 19, 12, 0);
  rect(68, 14, 4, 2, 18); rect(68, 16, 4, 2, 5); set(69, 17, 19);
  rect(80, 14, 4, 2, 18); rect(80, 16, 4, 2, 5); set(81, 17, 19);
  set(74, 20, 13); // chozuya
  rect(77, 21, 3, 1, 18); set(77, 22, 5); set(78, 22, 14); set(79, 22, 5); // loja
  rect(76, 13, 1, 12, 28); rect(67, 20, 17, 1, 28);
  set(74, 20, 13);
  set(71, 22, 21); // altar de encantamento
  set(75, 23, 25); set(76, 23, 26);  // torii ao sul (topo)
  set(75, 24, 29); set(76, 24, 30);  // pilares
  set(72, 18, 27); set(77, 18, 27);  // lanternas
  // CEMITÉRIO ANTIGO (sudeste)
  for (let y = 50; y < 61; y++) for (let x = 74; x < 91; x++) {
    if (t[y][x] === 1) set(x, y, 0);
    if (hash2(x * 11, y * 11) < 0.14 && t[y][x] === 0) set(x, y, 20);
  }
  // estradas
  rect(20, 31, 1, 13, 3);              // ponte oeste -> Sakuramura
  rect(20, 11, 1, 17, 3);              // ponte oeste -> norte
  rect(20, 11, 29, 1, 3);              // norte -> caverna
  rect(48, 11, 1, 17, 3);              // caverna -> ponte central
  rect(48, 31, 1, 19, 3);              // ponte central -> estrada sul
  rect(21, 50, 56, 1, 3);              // estrada sul: aldeia -> cemitério
  rect(76, 25, 1, 3, 3);               // Iwamura -> ponte leste
  rect(76, 31, 1, 19, 3);              // ponte leste -> estrada sul
  // placas
  set(19, 46, 15); set(19, 32, 15); set(50, 12, 15); set(73, 50, 15); set(73, 19, 15);
  // decoração: flores, arbustos, pedras e cogumelos espalhados pela grama
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
    if (t[y][x] !== 0) continue;
    const d = hash2(x * 7, y * 7);
    if (d < 0.05) set(x, y, 4);            // flor
    else if (d < 0.075) set(x, y, 22);     // arbusto
    else if (d < 0.088) set(x, y, 23);     // pedra
    else if (d < 0.095 && y > 30 && x < 30) set(x, y, 24); // cogumelo (floresta)
  }
  // baús escondidos
  set(8, 33, 16); set(88, 36, 16); set(89, 59, 16);
  return { w: W, h: H, tiles: t, name: 'overworld' };
}

function genCave() {
  const W = 36, H = 26;
  const t = [];
  for (let y = 0; y < H; y++) t.push(new Array(W).fill(9));
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < W && y < H) t[y][x] = v; };
  const rect = (x, y, w, h, v) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) set(i, j, v); };
  rect(0, 0, W, 2, 10); rect(0, H - 2, W, 2, 10); rect(0, 0, 2, H, 10); rect(W - 2, 0, 2, H, 10);
  // cogumelos luminosos decorativos
  for (let i = 0; i < 14; i++) {
    const cx = irnd(3, W - 4), cy = irnd(3, H - 4);
    if (t[cy][cx] === 9) set(cx, cy, 24);
  }
  // formações rochosas
  for (let i = 0; i < 22; i++) {
    const cx = irnd(3, W - 4), cy = irnd(3, H - 4), r = irnd(1, 2);
    if (Math.abs(cx - 18) < 5 && cy < 9) continue; // não no covil
    if (Math.abs(cx - 18) < 3 && cy > H - 7) continue; // não na entrada
    for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
      if (hash2(x * 5, y * 5) < 0.65) set(x, y, 10);
    }
  }
  // covil do dragão
  rect(13, 2, 11, 7, 9);
  // saída
  set(18, 23, 12); set(17, 23, 9); set(19, 23, 9); set(18, 22, 9);
  // baús
  set(4, 4, 16); set(31, 20, 16);
  return { w: W, h: H, tiles: t, name: 'cave' };
}

// ---------- Encantamento ----------
const ENCH_MAX = 5;
function enchLvl(id) { return (P.ench && P.ench[id]) || 0; }
function enchCost(id) { return (RAR_KEYS.indexOf(EQUIP[id].rar) + 1) * (enchLvl(id) + 1) * 4; }
// a partir de +3 o encanto também pede material de forja
function enchMatCost(id) {
  const l = enchLvl(id);
  if (l < 2) return null;
  if (l === 2) return { mat: MAT_BY_SLOT[EQUIP[id].slot] || 'ferro', n: 2 };
  if (l === 3) return { mat: 'jade', n: 2 };
  return { mat: 'escama', n: 1 };
}
function matQty(k) { return (P.mats && P.mats[k]) || 0; }
function addMats(m) {
  if (!P.mats) P.mats = emptyMats();
  for (const [k, v] of Object.entries(m || {})) P.mats[k] = (P.mats[k] || 0) + v;
}
function canEnchant(id) {
  if (!id || enchLvl(id) >= ENCH_MAX || P.frags < enchCost(id)) return false;
  const mc = enchMatCost(id);
  return !mc || matQty(mc.mat) >= mc.n;
}
// ---------- Desmontar equipamento ----------
// devolve fragmentos + materiais; encantos investidos voltam em parte
function dismantleYield(id) {
  const eq = EQUIP[id];
  const ri = RAR_KEYS.indexOf(eq.rar);
  const l = enchLvl(id);
  const mats = {};
  const prim = MAT_BY_SLOT[eq.slot] || 'ferro';
  mats[prim] = 1 + ri;
  if (ri >= 2) mats.jade = (mats.jade || 0) + (ri - 1);
  if (ri >= 4) mats.escama = (mats.escama || 0) + 1;
  return { frags: [1, 3, 6, 12, 24][ri] + l * 3, mats };
}
function dismantleFromInv(idx) {
  const id = P.equipInv[idx];
  if (!id) return null;
  const y = dismantleYield(id);
  P.equipInv.splice(idx, 1);
  P.frags += y.frags;
  addMats(y.mats);
  // o encanto só some se não sobrar nenhuma outra cópia da peça
  const resta = P.equipInv.includes(id) || SLOTS.some(s => P.equip[s] === id);
  if (!resta && P.ench) delete P.ench[id];
  return y;
}
function matsText(m) {
  return Object.entries(m).filter(([, v]) => v > 0).map(([k, v]) => MATS[k].short + ' x' + v).join(' · ');
}
function eqName(id) { const l = enchLvl(id); return EQUIP[id].name + (l ? ' +' + l : ''); }
// bônus do item multiplicado por 1 + 0.15 por nível de encantamento
function enchBonus(id) {
  const f = 1 + 0.15 * enchLvl(id);
  const out = {};
  for (const [k, v] of Object.entries(EQUIP[id].bonus)) {
    out[k] = k === 'crit' ? v * f : Math.ceil(v * f);
  }
  return out;
}

// status efetivos = base (pontos) + equipamentos (com encantos) + bônus de conjunto
function eff() {
  const e = { atk: P.atk, def: P.def, mag: P.mag, spd: P.spd, crit: P.crit, maxHp: P.maxHp, maxMp: P.maxMp };
  for (const slot of SLOTS) {
    const id = P.equip[slot];
    if (!id) continue;
    const b = enchBonus(id);
    if (b.atk) e.atk += b.atk;
    if (b.def) e.def += b.def;
    if (b.mag) e.mag += b.mag;
    if (b.spd) e.spd += b.spd;
    if (b.crit) e.crit += b.crit;
    if (b.hp) e.maxHp += b.hp;
    if (b.mp) e.maxMp += b.mp;
  }
  // bônus passivo do pet ativo
  if (P.activePet && PETS[P.activePet]) {
    const b = PETS[P.activePet].passive;
    if (b.atk) e.atk += b.atk;
    if (b.def) e.def += b.def;
    if (b.mag) e.mag += b.mag;
    if (b.spd) e.spd += b.spd;
    if (b.crit) e.crit += b.crit;
    if (b.hp) e.maxHp += b.hp;
    if (b.mp) e.maxMp += b.mp;
  }
  if (setActive()) {
    const t = weaponType();
    if (t === 'espada') { e.atk = Math.round(e.atk * 1.15); e.def = Math.round(e.def * 1.10); }
    if (t === 'cajado') { e.mag = Math.round(e.mag * 1.15); e.maxMp = Math.round(e.maxMp * 1.10); }
    if (t === 'adaga')  { e.atk = Math.round(e.atk * 1.08); e.spd += 2; e.crit += 0.05; }
    if (t === 'arco')   { e.atk = Math.round(e.atk * 1.12); e.spd += 3; }
  }
  return e;
}
function clampVitals() {
  const e = eff();
  P.hp = Math.min(P.hp, e.maxHp);
  P.mp = Math.min(P.mp, e.maxMp);
}
function addEquipToInv(id) {
  if (P.equipInv.length >= 18) {
    const g = Math.max(5, Math.round(equipPrice(id) / 2));
    P.gold += g;
    return { full: true, gold: g };
  }
  P.equipInv.push(id);
  return { full: false };
}
function equipFromInv(idx) {
  const id = P.equipInv[idx];
  if (!id) return;
  const slot = EQUIP[id].slot;
  const old = P.equip[slot];
  P.equip[slot] = id;
  P.equipInv.splice(idx, 1);
  if (old) P.equipInv.push(old);
  clampVitals();
  spriteCache.clear();   // o visual acompanha o equipamento
}

// conjunto de técnicas do caminho atual (cria vazio se ainda não existir)
function curSkills() {
  const t = weaponType();
  if (!t) return [];
  if (!P.skillSets) P.skillSets = {};
  if (!P.skillSets[t]) {
    // primeira vez com esta arma: aprende o que o nível permitir (até 4)
    P.skillSets[t] = WEAPON_SKILLS[t].filter(([, lvl]) => P.lvl >= lvl)
      .slice(0, MAX_SKILLS).map(([id]) => id);
  }
  return P.skillSets[t];
}
// técnicas equipadas que a arma atual consegue usar
function playerSkills() {
  const t = weaponType();
  if (!t) return [];
  return curSkills().filter(id => SKILLS[id]).map(id => ({ id, ...SKILLS[id] }));
}
// o que a arma atual ainda pode aprender neste nível
function learnableNow(lvl) {
  const t = weaponType();
  if (!t) return [];
  const atuais = curSkills();
  return WEAPON_SKILLS[t].filter(([id, l]) => l === lvl && !atuais.includes(id)).map(([id]) => id);
}
function knowsSkill(id) { return curSkills().includes(id); }
function equipSkill(id, replaceIdx) {
  const s = curSkills();
  if (replaceIdx !== undefined && replaceIdx !== null && s[replaceIdx]) s[replaceIdx] = id;
  else if (s.length < MAX_SKILLS) s.push(id);
  else return false;
  return true;
}
// ações disponíveis em batalha: ataque básico + técnicas equipadas
function battleActions() {
  return [BASIC_ATTACK].concat(playerSkills());
}
function gainXP(amt) {
  P.xp += amt;
  const ups = [];
  while (P.xp >= XP_NEXT(P.lvl)) {
    P.xp -= XP_NEXT(P.lvl);
    P.lvl++;
    P.maxHp += 4; P.maxMp += 2;      // crescimento básico
    P.pts += PTS_PER_LEVEL;          // pontos livres para distribuir
    const e = eff();
    P.hp = e.maxHp; P.mp = e.maxMp;  // cura total ao subir
    ups.push(P.lvl);
    // técnicas que este nível libera para a arma equipada
    for (const id of learnableNow(P.lvl)) {
      if (curSkills().length < MAX_SKILLS) {
        equipSkill(id);
        ups.newSkill = SKILLS[id].name;
      } else {
        // sem espaço: entra na fila para o jogador escolher o que esquecer
        G.learnQueue.push(id);
      }
    }
  }
  return ups;
}

// ---------- Loot por raridade ----------
// peças exclusivas de chefe/loja: nunca caem no sorteio comum
const NO_DROP = ['esp5', 'caj5', 'ada5', 'arc5', 'elm5', 'elm8', 'amu4', 'amu5', 'arm8', 'bot5', 'luv6'];
function rollRarity(maxTier) {
  let total = 0;
  for (let i = 0; i <= maxTier; i++) total += RARITY[RAR_KEYS[i]].w;
  let r = Math.random() * total;
  for (let i = 0; i <= maxTier; i++) {
    r -= RARITY[RAR_KEYS[i]].w;
    if (r <= 0) return RAR_KEYS[i];
  }
  return RAR_KEYS[0];
}
function rollLoot(type) {
  const d = ENEMIES[type];
  if (d.boss) {
    // drop assinatura: dragão dá a arma lendária do estilo atual
    if (d.sig === 'weapon') {
      const t = weaponType();
      return { shakujo: 'caj5', tanto: 'ada5', yumi: 'arc5' }[t] || 'esp5';
    }
    return d.sig;
  }
  if (Math.random() > d.drop) return null;
  // 55% consumível, 45% equipamento
  if (Math.random() < 0.55) return 'c:' + pick(['pocao', 'pocao', 'pocao', 'pao', 'pao', 'eter', 'antidoto', 'bomba']);
  const rar = rollRarity(Math.min(d.tier, RAR_KEYS.length - 1));
  // cada youkai tem sua mesa temática; o resto vem da tabela geral
  const tema = (d.loot || []).filter(k => EQUIP[k]);
  const naRar = tema.filter(k => EQUIP[k].rar === rar);
  if (naRar.length && Math.random() < 0.6) return pick(naRar);
  // sem peça temática nessa raridade: tenta uma mais barata da mesma mesa
  const ri = RAR_KEYS.indexOf(rar);
  const abaixo = tema.filter(k => RAR_KEYS.indexOf(EQUIP[k].rar) <= ri);
  if (abaixo.length && Math.random() < 0.35) return pick(abaixo);
  const pool = Object.keys(EQUIP).filter(k => EQUIP[k].rar === rar && !NO_DROP.includes(k));
  return pool.length ? pick(pool) : (tema.length ? pick(tema) : null);
}
// fragmentos arcanos: moeda de encantamento dropada por mobs
function rollFrags(type, lvl) {
  const d = ENEMIES[type];
  if (d.boss) return { reislime: 8, necromante: 12, dragao: 20 }[type] || 8;
  if (Math.random() < 0.4) return 1 + Math.floor(lvl / 3);
  return 0;
}
// materiais de forja: cada youkai deixa o material do seu tipo
function rollMats(type, lvl) {
  const d = ENEMIES[type];
  const m = d.mat || 'ferro';
  if (d.boss) return { [m]: 4, escama: 2 };
  const out = {};
  if (Math.random() < 0.45) out[m] = 1 + (Math.random() < 0.25 ? 1 : 0);
  if (d.tier >= 3 && Math.random() < 0.10) out.jade = (out.jade || 0) + 1;
  return out;
}

// ---------- Save / Load ----------
const SAVE_KEY = 'cronicas_pixel_save_v2';
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      p: { ...P }, flags: G.flags, chests: G.chests, stats: G.stats, victoryShown: G.victoryShown
    }));
  } catch (e) {}
}
function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d || !d.p || !d.p.equip) return false;
    P = d.p;
    // compatibilidade com saves antigos
    if (P.frags === undefined) P.frags = 0;
    if (!P.mats) P.mats = emptyMats();
    else for (const k of MAT_KEYS) if (P.mats[k] === undefined) P.mats[k] = 0;
    if (!P.ench) P.ench = {};
    if (!P.pets) { P.pets = []; P.activePet = null; }
    if (!P.quests) P.quests = { ativas: {}, feitas: [] };
    if (!P.mercSeed) P.mercSeed = {};
    if (!P.look) P.look = defaultLook();
    if (!P.skillSets) {
      // save antigo: monta o conjunto de cada caminho pelo nível alcançado
      P.skillSets = {};
      for (const wt2 of Object.keys(WEAPON_SKILLS)) {
        P.skillSets[wt2] = WEAPON_SKILLS[wt2].filter(([, l]) => P.lvl >= l)
          .slice(0, MAX_SKILLS).map(([id]) => id);
      }
      delete P.skills; delete P.known;
    }
    if (P.equip.botas === undefined) P.equip.botas = null;
    if (P.equip.luvas === undefined) P.equip.luvas = null;
    for (const k of Object.keys(ITEMS)) if (P.items[k] === undefined) P.items[k] = 0;
    if (!P.equipInv.includes('arc1') && P.equip.arma !== 'arc1' && !Object.keys(P.ench).some(k => k.startsWith('arc'))) {
      // saves antigos não tinham arco inicial
      if (P.equipInv.length < 18) P.equipInv.push('arc1');
    }
    G.flags = d.flags || { reislime: false, necromante: false, dragao: false };
    G.chests = d.chests || {};
    G.stats = d.stats || { kills: 0, battles: 0 };
    G.victoryShown = !!d.victoryShown;
    enterMap(P.mapName, P.x, P.y);
    G.state = 'world';
    return true;
  } catch (e) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }

// ---------- Mundo ----------
function tileAt(map, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return 1;
  return map.tiles[ty][tx];
}
function isSolid(map, tx, ty) { return SOLID.has(tileAt(map, tx, ty)); }

function enterMap(name, px, py) {
  if (!MAPS[name]) MAPS[name] = name === 'cave' ? genCave() : genOverworld();
  G.map = MAPS[name];
  P.mapName = name;
  P.x = px; P.y = py;
  G.petX = px - 14; G.petY = py;
  G.entities = [];
  spawnEnemies(true);
  if (name === 'cave') {
    if (!G.flags.dragao) G.entities.push(makeEntity('dragao', 18 * TILE, 4 * TILE, 12, true));
    G.region = 'Caverna de Orochi';
    toast('Caverna de Orochi');
  } else {
    if (!G.flags.reislime) G.entities.push(makeEntity('reislime', 14 * TILE, 37 * TILE, 5, true));
    if (!G.flags.necromante) G.entities.push(makeEntity('necromante', 82 * TILE, 55 * TILE, 8, true));
    G.region = null;
  }
  AU.setTrack(name === 'cave' ? AU.CAVE : AU.WORLD);
  spawnNPCs(G.map);
}

      exclude: [{ x1: 11, y1: 43, x2: 29, y2: 57 }, { x1: 5, y1: 31, x2: 27, y2: 43 }] },

    { x1: 6, y1: 11, x2: 90, y2: 26, types: ['lobo', 'esqueleto', 'harpia'], lv: [4, 6], count: 8,
      exclude: [{ x1: 65, y1: 12, x2: 85, y2: 25 }] },
    { x1: 56, y1: 34, x2: 90, y2: 48, types: ['esqueleto', 'aranha', 'harpia'], lv: [5, 7], count: 7 },
    { x1: 74, y1: 50, x2: 90, y2: 60, types: ['zumbi', 'fantasma', 'esqueleto'], lv: [6, 8], count: 6 }
  ],

  ]
};
function makeEntity(type, x, y, lvl, isBoss) {
  return {
    type, x, y, lvl, isBoss: !!isBoss,
    dir: pick(['up', 'down', 'left', 'right']),
    moveT: rnd(0.5, 2), vx: 0, vy: 0, animT: 0
  };
}
function spawnEnemies(initial) {
  const zones = SPAWN_ZONES[G.map.name] || [];
  for (const z of zones) {
    const cur = G.entities.filter(e => !e.isBoss && e.zone === z).length;
    const want = initial ? z.count : Math.min(z.count, cur + 1);
    for (let i = cur; i < want; i++) {
      for (let tries = 0; tries < 30; tries++) {
        const tx = irnd(z.x1, z.x2), ty = irnd(z.y1, z.y2);
        if (z.exclude && z.exclude.some(ex => tx >= ex.x1 && tx <= ex.x2 && ty >= ex.y1 && ty <= ex.y2)) continue;
        if (isSolid(G.map, tx, ty)) continue;
        const px = tx * TILE, py = ty * TILE;
        if (Math.hypot(px - P.x, py - P.y) < TILE * 7) continue;
        const e = makeEntity(pick(z.types), px, py, irnd(z.lv[0], z.lv[1]));
        e.zone = z;
        G.entities.push(e);
        break;
      }
    }
  }
}

function tryMove(ent, dx, dy) {
  // colisão por caixa (12x10 nos pés)
  const bw = 10, bh = 8, ox = 3, oy = 7;
  let nx = ent.x + dx, ny = ent.y + dy;
  const corners = (x, y) => [
    [x + ox, y + oy], [x + ox + bw, y + oy], [x + ox, y + oy + bh], [x + ox + bw, y + oy + bh]
  ];
  let okX = true;
  for (const [cx, cy] of corners(nx, ent.y)) {
    if (isSolid(G.map, Math.floor(cx / TILE), Math.floor(cy / TILE))) { okX = false; break; }
  }
  if (okX) ent.x = nx;
  let okY = true;
  for (const [cx, cy] of corners(ent.x, ny)) {
    if (isSolid(G.map, Math.floor(cx / TILE), Math.floor(cy / TILE))) { okY = false; break; }
  }
  if (okY) ent.y = ny;
  return okX || okY;
}

function facingTile() {
  const cx = P.x + 8, cy = P.y + 11;
  let tx = Math.floor(cx / TILE), ty = Math.floor(cy / TILE);
  if (P.dir === 'up') ty--;
  if (P.dir === 'down') ty++;
  if (P.dir === 'left') tx--;
  if (P.dir === 'right') tx++;
  return { tx, ty, t: tileAt(G.map, tx, ty) };
}

const SIGNS = {
  '19,46': 'Vila Sakuramura.\nQue as cerejeiras te abençoem,\nviajante.',
  '19,32': 'Bosque de Bambu a oeste.\nDizem que Nurarihyon, mestre\ndos youkai, reina na clareira.',
  '50,12': 'PERIGO! Caverna de Orochi.\nSó guerreiros de alma firme\ndevem cruzar este torii.',
  '73,50': 'Templo Abandonado.\nOs mortos não descansam...\nKagemaru os comanda.',
  '73,19': 'Vila Iwamura.\nFerreiros e bons negócios.'
};

function updateWorld(dt) {
  // movimento do jogador: aceleração suave + corrida (Shift)
  let dx = 0, dy = 0;
  if (keys.up) dy -= 1;
  if (keys.down) dy += 1;
  if (keys.left) dx -= 1;
  if (keys.right) dx += 1;
  const wantMove = !!(dx || dy);
  const running = keys.run && wantMove;
  const spdMax = running ? 122 : 76;
  // velocidade alvo, suavizada (dá peso ao personagem sem atrasar o controle)
  let tvx = 0, tvy = 0;
  if (wantMove) {
    const n = Math.hypot(dx, dy);
    tvx = dx / n * spdMax; tvy = dy / n * spdMax;
    if (dy < 0) P.dir = 'up';
    if (dy > 0) P.dir = 'down';
    if (dx < 0) P.dir = 'left';
    if (dx > 0) P.dir = 'right';
  }
  const accel = wantMove ? 16 : 22;
  P.vx = lerp(P.vx || 0, tvx, Math.min(1, dt * accel));
  P.vy = lerp(P.vy || 0, tvy, Math.min(1, dt * accel));
  const speed = Math.hypot(P.vx, P.vy);
  P.moving = speed > 6;
  if (P.moving) {
    tryMove(P, P.vx * dt, P.vy * dt);
    // ciclo de 4 frames: passo, neutro, passo oposto, neutro
    P.animT += dt * (running ? 1.5 : 1);
    if (P.animT > 0.14) { P.animT = 0; P.frame = (P.frame + 1) % 4; }
    // poeira sob os pés (mais forte correndo)
    G.dustT -= dt;
    if (G.dustT <= 0) {
      G.dustT = running ? 0.09 : 0.2;
      const cave = G.map.name === 'cave';
      spawnParticle({
        x: P.x + 8 + rnd(-2, 2), y: P.y + 15, vx: -P.vx * 0.12, vy: rnd(-10, -3),
        life: running ? 0.45 : 0.32, size: running ? 2 : 1, shrink: true,
        color: cave ? '#4a4458' : '#b8a878'
      });
    }
  } else { P.frame = 0; P.animT = 0; }

  // portais / tiles especiais
  const ptx = Math.floor((P.x + 8) / TILE), pty = Math.floor((P.y + 11) / TILE);
  const cur = tileAt(G.map, ptx, pty);
  if (cur === 11) { // entrada caverna
    fadeTo(() => { enterMap('cave', 18 * TILE, 21 * TILE); P.dir = 'up'; saveGame(); });
  } else if (cur === 12) { // saída caverna
    fadeTo(() => { enterMap('overworld', 48 * TILE, 10 * TILE); P.dir = 'down'; saveGame(); });
  }
  // toast de região
  if (G.map.name === 'overworld') {
    const rg = regionAt(ptx, pty);
    if (rg && rg !== G.region) { G.region = rg; toast(rg); }
  }

  // interação (Z)
  if (tap('ok')) {
    const f = facingTile();
    const key = f.tx + ',' + f.ty;
    const alvoNPC = npcPerto();
    if (alvoNPC && !TILES_INTERATIVOS.includes(f.t)) { conversaNPC(alvoNPC); return; }
    if (f.t === 13) { // fonte
      const E0 = eff();
      if (P.hp < E0.maxHp || P.mp < E0.maxMp) {
        P.hp = E0.maxHp; P.mp = E0.maxMp;
        AU.sfx('heal');
        addFloater(P.x + 8, P.y - 4, '+HP/MP', '#6ee86e');
        burst(P.x + 8, P.y + 8, 24, { color: ['#8ec6f0', '#c6e2f8', '#6ee86e'], spdMax: 50, lifeMax: 1.1, size: 1, lift: 30, g: 30 });
        showMsg('A água sagrada do chozuya\nrestaurou suas forças!\n(jogo salvo)');
        saveGame();
      } else showMsg('A água do chozuya reflete\nas pétalas de sakura.');
    } else if (f.t === 14) { // loja (estoque depende da cidade)
      G.shopId = f.tx < 50 ? 'aldeia' : 'rocha';
      G.state = 'shop'; G.shopIdx = 0; AU.sfx('ok');
    } else if (f.t === 21) { // altar de encantamento
      G.state = 'enchant'; G.menuIdx = 0; G.altarMode = 0; AU.sfx('magic');
    } else if (f.t === 15 && SIGNS[key]) {
      showMsg(SIGNS[key]);
    } else if (f.t === 16) { // baú
      const cid = G.map.name + ':' + key;
      if (!G.chests[cid]) {
        G.chests[cid] = true;
        G.map.tiles[f.ty][f.tx] = 17;
        AU.sfx('chest');
        burst(f.tx * TILE + 8, f.ty * TILE + 6, 26, {
          color: ['#ffd94e', '#f0d878', '#fff0a0'], spdMax: 70, lifeMax: 1, size: 2, lift: 40, g: 110
        });
        const loot = G.map.name === 'cave'
          ? pick([{ gold: 80 }, { item: 'elixir' }, { item: 'bomba', n: 2 },
                  { eq: pick(['arm5', 'esp4', 'caj4', 'ada4', 'arc4', 'bot4', 'arm11', 'luv5', 'elm7', 'amu8']) },
                  { eq: pick(['arm8', 'amu5', 'bot5', 'luv6', 'elm8']) }])
          : pick([{ item: 'pocao', n: 2 }, { gold: 45 }, { item: 'pergaminho' },
                  { eq: pick(['esp3', 'caj3', 'ada3', 'arc3', 'arm3', 'arm4', 'arm10', 'elm3', 'elm4', 'amu3', 'amu7', 'bot3', 'luv3', 'luv4']) }]);
        if (loot.gold) { P.gold += loot.gold; showMsg('Você encontrou ' + loot.gold + ' de ouro!'); }
        else if (loot.eq) {
          const r = addEquipToInv(loot.eq);
          showMsg('Você encontrou:\n' + EQUIP[loot.eq].name + ' [' + RARITY[EQUIP[loot.eq].rar].name + ']' + (r.full ? '\n(inventário cheio: +' + r.gold + ' ouro)' : ''));
        }
        else { const n = loot.n || 1; P.items[loot.item] += n; showMsg('Você encontrou ' + (n > 1 ? n + 'x ' : '') + ITEMS[loot.item].name + '!'); }
        saveGame();
      }
    } else if (f.t === 19) {
      showMsg('A porta shoji está fechada.\nOs aldeões se escondem\ndos youkai...');
    }
  }
  if (tap('menu')) { G.state = 'menu'; G.menuIdx = 0; G.menuTab = 0; AU.sfx('menu'); }

  // inimigos
  for (const e of G.entities) {
    e.animT += dt;
    const dist = Math.hypot(e.x - P.x, e.y - P.y);
    const chaseR = e.isBoss ? TILE * 4 : TILE * 4.5;
    let evx = 0, evy = 0;
    const espd = e.isBoss ? 30 : (e.type === 'morcego' || e.type === 'lobo' ? 46 : 28);
    if (dist < chaseR) {
      evx = (P.x - e.x) / dist * espd;
      evy = (P.y - e.y) / dist * espd;
    } else if (!e.isBoss) {
      e.moveT -= dt;
      if (e.moveT <= 0) {
        e.moveT = rnd(0.8, 2.4);
        const d = irnd(0, 4);
        e.vx = d === 0 ? espd * 0.6 : d === 1 ? -espd * 0.6 : 0;
        e.vy = d === 2 ? espd * 0.6 : d === 3 ? -espd * 0.6 : 0;
      }
      evx = e.vx; evy = e.vy;
    }
    if (evx || evy) tryMove(e, evx * dt, evy * dt);
    // toque = batalha
    if (dist < 13 && G.state === 'world') {
      startBattle(e);
      break;
    }
  }
  // respawn
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0) { G.spawnTimer = 6; spawnEnemies(false); }

  // pet seguidor
  if (P.activePet) {
    if (G.petX === undefined) { G.petX = P.x - 14; G.petY = P.y; }
    const off = { up: [0, 16], down: [0, -16], left: [14, 0], right: [-14, 0] }[P.dir];
    const tx = P.x + off[0], ty = P.y + off[1];
    const d = Math.hypot(tx - G.petX, ty - G.petY);
    if (d > 4) {
      G.petX = lerp(G.petX, tx, Math.min(1, dt * 5));
      G.petY = lerp(G.petY, ty, Math.min(1, dt * 5));
    }
  }

  // câmera: segue o herói travada em pixel inteiro (zero tremor ao andar)
  G.camX = clamp(Math.round(P.x) + 8 - VW / 2, 0, G.map.w * TILE - VW);
  G.camY = clamp(Math.round(P.y) + 11 - VH / 2, 0, G.map.h * TILE - VH);
}

// ---------- Batalha ----------
function enemyStats(type, lvl) {
  const d = ENEMIES[type];
  // chefes já têm stats de chefe definidos; mobs comuns escalam com o nível
  const f = d.boss ? 1 : 1 + (lvl - 1) * 0.22;
  return {
    type, lvl, name: d.name,
    hp: Math.round(d.hp * f), maxHp: Math.round(d.hp * f),
    atk: Math.round(d.atk * f), def: Math.round(d.def * f), spd: d.spd,
    xp: Math.round(d.xp * f), gold: irnd(Math.round(d.gold[0] * f), Math.round(d.gold[1] * f)),
    drop: d.drop, skill: d.skill, boss: !!d.boss
  };
}
function startBattle(ent) {
  G.stats.battles++;
  const e = enemyStats(ent.type, ent.lvl);
  G.battle = {
    enemy: e, ent,
    phase: 'entrada', t: 0,
    menuIdx: 0, sub: null, subIdx: 0,
    log: e.boss ? e.name + ' bloqueia seu caminho!' : e.name + ' (Nv.' + e.lvl + ') apareceu!',
    pAnim: 0, eAnim: 0, eFlash: 0, pFlash: 0,
    atkBuff: 0, defBuff: 0, spdBuff: 0, critBuff: 0, poison: 0, frozen: false, scrollBuff: false, pPoison: 0,
    act: null,
    hpShown: e.hp, pHpShown: P.hp, slash: null,
    petStruck: true, petAnim: 0,
    dmgPops: [], rewards: null, swirl: 0
  };
  G.state = 'battle';
  G.battleFlash = 1;
  G.shake = e.boss ? 8 : 5;
  AU.sfx(e.boss ? 'boss' : 'battle');
  AU.setTrack(AU.BATTLE);
  // entrada: faíscas convergindo para o centro
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * Math.PI * 2, r0 = 150;
    spawnParticle({
      screen: true, x: VW / 2 + Math.cos(a) * r0, y: VH / 2 + Math.sin(a) * r0,
      vx: -Math.cos(a) * 240, vy: -Math.sin(a) * 240,
      life: 0.55, size: 2, color: e.boss ? '#e05050' : '#ffd94e', shrink: true
    });
  }
}
function calcDamage(atk, def, mult, isMag) {
  const raw = atk * mult * rnd(0.9, 1.1) - def * (isMag ? 0.3 : 0.5);
  return Math.max(1, Math.round(raw));
}
function battleLog(b, txt) { b.log = txt; }
function addDmgPop(b, who, val, color) {
  b.dmgPops.push({ who, val, t: 0, color: color || '#fff' });
}

function playerAttack(b, opts) {
  const o = opts || {};
  const mult = o.mult || 1;
  const E = eff();
  let dmg;
  let crit = o.forceCrit || Math.random() < E.crit + (o.critBonus || 0);
  const atkNow = E.atk + (b.atkBuff > 0 ? Math.round(E.atk * (b.scrollBuff ? 1.0 : 0.5)) : 0);
  if (b.critBuff > 0) crit = crit || Math.random() < 0.25;
  const defNow = o.ignoreDef ? 0 : b.enemy.def;
  if (o.magic) {
    dmg = calcDamage(E.mag, defNow, mult, true);
    crit = false;
  } else {
    dmg = calcDamage(atkNow, defNow, mult);
    if (crit) dmg = Math.round(dmg * 1.8);
  }
  b.enemy.hp = Math.max(0, b.enemy.hp - dmg);
  b.eFlash = 0.25;
  G.shake = crit ? 6 : 3.5;
  addDmgPop(b, 'enemy', dmg, crit ? '#ffd94e' : '#fff');
  AU.sfx(o.magic ? 'magic' : (crit ? 'crit' : 'hit'));
  // impacto visual: faíscas mágicas ou respingo de golpe
  const ix = 76, iy = 74;
  if (o.magic) {
    burstScreen(ix, iy, crit ? 22 : 16, {
      color: ['#8ac0ff', '#b06ae8', '#dce8ff'], spdMax: 95, lifeMax: 0.6, size: 2, drag: 3
    });
  } else {
    burstScreen(ix, iy, crit ? 20 : 12, {
      color: crit ? ['#ffd94e', '#fff0a0', '#ff8a4e'] : ['#e8e8f0', '#c8c8d8'],
      spdMax: crit ? 120 : 80, lifeMax: 0.5, size: crit ? 2 : 1, g: 120
    });
    // rastro do corte
    b.slash = { t: 0, crit };
  }
  return { dmg, crit };
}

function enemyTurn(b) {
  b.phase = 'enemyAct'; b.t = 0;
  // veneno no jogador
  if (b.pPoison > 0) {
    const E = eff();
    const pd = Math.max(1, Math.round(E.maxHp * 0.05));
    P.hp = Math.max(0, P.hp - pd);
    addDmgPop(b, 'player', pd, '#a0e84e');
    b.pPoison--;
    if (P.hp <= 0) { b.phase = 'lose'; b.t = 0; AU.sfx('die'); return; }
  }
  // veneno no inimigo
  if (b.poison > 0) {
    const pd = Math.max(1, Math.round(b.enemy.maxHp * 0.06));
    b.enemy.hp = Math.max(0, b.enemy.hp - pd);
    addDmgPop(b, 'enemy', pd, '#a0e84e');
    b.poison--;
    if (b.enemy.hp <= 0) return;
  }
  if (b.frozen) {
    b.frozen = false;
    b.enemySkipped = true;
    return;
  }
  b.enemySkipped = false;
  const e = b.enemy;
  let mult = 1, skillName = null, venom = false;
  if (e.skill && Math.random() < e.skill.chance) {
    mult = e.skill.mult; skillName = e.skill.name; venom = !!e.skill.poison;
  }
  b.pendingEnemy = { mult, skillName, venom };
}
function applyEnemyHit(b) {
  const pe = b.pendingEnemy || { mult: 1 };
  const defNow = eff().def + (b.defBuff > 0 ? Math.round(eff().def * 0.6) : 0);
  const dmg = calcDamage(b.enemy.atk, defNow, pe.mult);
  P.hp = Math.max(0, P.hp - dmg);
  b.pFlash = 0.25;
  G.shake = pe.skillName ? 6 : 4;
  addDmgPop(b, 'player', dmg, pe.skillName ? '#ff8a4e' : '#ff5a5a');
  burstScreen(268, 76, pe.skillName ? 16 : 10, {
    color: ['#e05050', '#ff8a4e', '#c03030'], spdMax: 90, lifeMax: 0.5, size: 2, g: 110
  });
  AU.sfx('hurt');
  if (pe.venom && b.pPoison <= 0) {
    b.pPoison = 3;
    addDmgPop(b, 'player', 'VENENO', '#a0e84e');
  }
  battleLog(b, pe.skillName ? b.enemy.name + ' usou ' + pe.skillName + '!' : b.enemy.name + ' atacou!');
  b.pendingEnemy = null;
}

function endBattleWin(b) {
  G.stats.kills++;
  const e = b.enemy;
  const ups = gainXP(e.xp);
  P.gold += e.gold;
  // loot por raridade
  let dropTxt = null, dropColor = null;
  const loot = rollLoot(e.type);
  if (loot) {
    if (loot.startsWith('c:')) {
      const it = loot.slice(2);
      P.items[it] = Math.min(9, P.items[it] + 1);
      dropTxt = ITEMS[it].name;
      dropColor = '#c8c8d0';
    } else {
      const r = addEquipToInv(loot);
      const eq = EQUIP[loot];
      dropTxt = eq.name + ' [' + RARITY[eq.rar].name + ']' + (r.full ? ' → +' + r.gold + ' ouro' : '');
      dropColor = RARITY[eq.rar].color;
    }
  }
  const frags = rollFrags(e.type, e.lvl);
  if (frags) P.frags += frags;
  const mats = rollMats(e.type, e.lvl);
  addMats(mats);
  questMatou(e.type);
  questColetou();
  const matTxt = matsText(mats) || null;
  // pets: chefes sempre dão o seu; mobs têm chance pequena de deixar um filhote
  let petTxt = null, petColor = null;
  let newPet = null;
  const bp = BOSS_PETS[e.type], pd = PET_DROPS[e.type];
  if (bp && !P.pets.includes(bp)) newPet = bp;
  else if (pd && Math.random() < pd[1] && !P.pets.includes(pd[0])) newPet = pd[0];
  if (newPet) {
    P.pets.push(newPet);
    if (!P.activePet) P.activePet = newPet;
    petTxt = PETS[newPet].name;
    petColor = RARITY[PETS[newPet].rar].color;
  }
  b.rewards = { xp: e.xp, gold: e.gold, ups, dropTxt, dropColor, frags, matTxt, petTxt, petColor, newSkill: ups.newSkill };
  b.phase = 'result'; b.t = 0;
  if (ups.length) {
    AU.sfx('level');
    for (let i = 0; i < 26; i++) spawnParticle({
      screen: true, x: 268 + rnd(-18, 18), y: 118, vx: rnd(-8, 8), vy: rnd(-70, -35),
      life: rnd(0.7, 1.3), color: pick(['#ffd94e', '#fff0a0', '#6ee86e']), size: 2, shrink: true
    });
  } else AU.sfx('victory');
  // inimigo se desfaz em partículas
  burstScreen(76, 74, 24, { color: ['#e8e8f0', '#a89ac0', '#6a5a9a'], spdMax: 80, lifeMax: 0.8, size: 2, g: 60 });
  // remove do mapa
  const i = G.entities.indexOf(b.ent);
  if (i >= 0) G.entities.splice(i, 1);
  if (e.boss) G.flags[e.type] = true;
  saveGame();
}

function fleeBattle(b) {
  const spdNow = eff().spd + (b.spdBuff > 0 ? 6 : 0);
  const chance = clamp(0.5 + (spdNow - b.enemy.spd) * 0.06, 0.25, 0.95);
  if (b.enemy.boss) { battleLog(b, 'Não dá para fugir de um chefe!'); b.phase = 'menu'; return; }
  if (Math.random() < chance) {
    AU.sfx('flee');
    battleLog(b, 'Você fugiu!');
    b.phase = 'fled'; b.t = 0;
  } else {
    battleLog(b, 'Não conseguiu fugir!');
    b.phase = 'playerActDone'; b.t = 0.3;
  }
}

function useItemBattle(b, id) {
  if (P.items[id] <= 0) return false;
  P.items[id]--;
  const E = eff();
  const heal = pct => {
    const h = Math.round(E.maxHp * pct);
    P.hp = Math.min(E.maxHp, P.hp + h);
    addDmgPop(b, 'player', '+' + h, '#6ee86e');
    return h;
  };
  switch (id) {
    case 'pocao':  battleLog(b, 'Poção! Recuperou ' + heal(0.45) + ' HP.'); AU.sfx('heal'); break;
    case 'pocaoG': battleLog(b, 'Poção Grande! Recuperou ' + heal(0.80) + ' HP.'); AU.sfx('heal'); break;
    case 'pao': {
      const h = heal(0.20);
      const m = Math.round(E.maxMp * 0.2);
      P.mp = Math.min(E.maxMp, P.mp + m);
      battleLog(b, 'Pão! +' + h + ' HP e +' + m + ' MP.');
      AU.sfx('heal');
      break;
    }
    case 'eter': {
      const m = Math.round(E.maxMp * 0.4);
      P.mp = Math.min(E.maxMp, P.mp + m);
      addDmgPop(b, 'player', '+' + m + 'MP', '#6ea8ff');
      battleLog(b, 'Éter! Recuperou ' + m + ' MP.');
      AU.sfx('heal');
      break;
    }
    case 'elixir':
      P.hp = E.maxHp; P.mp = E.maxMp;
      addDmgPop(b, 'player', 'MAX', '#ffd94e');
      battleLog(b, 'Elixir! HP e MP restaurados!');
      AU.sfx('heal');
      break;
    case 'antidoto':
      b.pPoison = 0;
      addDmgPop(b, 'player', 'CURA', '#a0e84e');
      battleLog(b, 'Antídoto! Status negativos curados.');
      AU.sfx('heal');
      break;
    case 'bomba': {
      const dmg = 35;
      b.enemy.hp = Math.max(0, b.enemy.hp - dmg);
      b.eFlash = 0.3;
      G.shake = 7;
      addDmgPop(b, 'enemy', dmg, '#ff8a4e');
      burstScreen(76, 70, 20, { color: ['#ffd94e', '#ff8a4e', '#e05050'], spdMax: 110, lifeMax: 0.6, g: 90, size: 2 });
      battleLog(b, 'Bomba! ' + dmg + ' de dano direto!');
      AU.sfx('crit');
      break;
    }
    case 'pergaminho':
      b.atkBuff = 3; b.scrollBuff = true;
      addDmgPop(b, 'player', 'ATQ x2', '#ffd94e');
      battleLog(b, 'Pergaminho! ATQ dobrado por 3 turnos!');
      AU.sfx('magic');
      break;
    default: AU.sfx('heal');
  }
  return true;
}

// ---------- Ações do jogador com animação ----------
// Fluxo: escolha → animação (dash + efeito) → impacto → resultado
function startPlayerAction(b, skill) {
  const anim = skill ? (SKILLS[skill.id].anim || 'slash') : 'slash';
  if (skill) P.mp -= skill.mp;
  b.act = { skill, anim, t: 0, hit: false, hits: 0, dur: ANIM_DUR[anim] || 0.7 };
  b.phase = 'playerAnim';
  b.t = 0;
  b.petStruck = false;
  battleLog(b, skill ? skill.name + '!' : 'Ataque!');
  // som de conjuração para técnicas mágicas
  if (['fire', 'ice', 'thunder', 'holy', 'drain'].includes(anim)) AU.tone(300, 0.18, 'sine', 0.05, 400);
}
// duração de cada animação (segundos)
const ANIM_DUR = {
  slash: 0.55, slash2: 0.75, iai: 0.85, flurry: 0.95, guard: 0.6, buff: 0.6,
  fire: 0.85, ice: 0.85, thunder: 0.95, holy: 1.05, drain: 0.9, poison: 0.7,
  arrow: 0.75, arrows: 0.95
};
// momentos de impacto (fração da duração) por animação
const ANIM_HITS = {
  slash: [0.45], slash2: [0.4, 0.68], iai: [0.62], flurry: [0.35, 0.5, 0.65, 0.8],
  guard: [0.4], buff: [0.4], fire: [0.6], ice: [0.6], thunder: [0.62], holy: [0.7],
  drain: [0.55], poison: [0.5], arrow: [0.55], arrows: [0.4, 0.58, 0.76]
};

// aplica o efeito de um golpe (chamado nos instantes de impacto)
function applySkillHit(b, hitIndex) {
  const sk = b.act.skill;
  const E = eff();
  if (!sk) { // ataque básico
    const r = playerAttack(b, {});
    battleLog(b, r.crit ? 'Golpe CRÍTICO!' : 'Você atacou!');
    return;
  }
  switch (sk.id) {
    // --- katana ---
    case 'golpe': playerAttack(b, { mult: 1.8 }); break;
    case 'kiai': b.atkBuff = 3; addDmgPop(b, 'player', 'ATQ+', '#ffd94e'); battleLog(b, 'Kiai! ATQ elevado!'); AU.sfx('magic'); break;
    case 'tsubame': playerAttack(b, { mult: 1.1 }); break;
    case 'iai': playerAttack(b, { mult: 3 }); G.shake = 8; break;
    case 'zanshin': {
      b.defBuff = 3;
      const h = Math.round(E.maxHp * 0.15);
      P.hp = Math.min(E.maxHp, P.hp + h);
      addDmgPop(b, 'player', '+' + h, '#6ee86e');
      battleLog(b, 'Zanshin! DEF elevada e ' + h + ' HP.');
      AU.sfx('heal');
      break;
    }
    case 'hyakuretsu': playerAttack(b, { mult: 0.85 }); break;
    // --- shakujo ---
    case 'fogo': playerAttack(b, { mult: 2.2, magic: true }); break;
    case 'gelo':
      playerAttack(b, { mult: 1.8, magic: true });
      if (Math.random() < 0.45 && !b.enemy.boss) { b.frozen = true; battleLog(b, 'Hyoton! O youkai congelou!'); }
      break;
    case 'kekkai': b.defBuff = 3; addDmgPop(b, 'player', 'DEF+', '#8ac0ff'); battleLog(b, 'Kekkai! Barreira erguida!'); AU.sfx('magic'); break;
    case 'meteoro': playerAttack(b, { mult: 3.5, magic: true }); G.shake = 10; break;
    case 'kyuketsu': {
      const r = playerAttack(b, { mult: 1.6, magic: true });
      const cura = Math.round(r.dmg * 0.8);
      P.hp = Math.min(E.maxHp, P.hp + cura);
      addDmgPop(b, 'player', '+' + cura, '#6ee86e');
      battleLog(b, 'Kyuketsu! Drenou ' + cura + ' de vida.');
      break;
    }
    case 'amaterasu': playerAttack(b, { mult: 4.5, magic: true }); G.shake = 12; break;
    // --- tanto ---
    case 'duplo': playerAttack(b, { mult: 0.9 }); break;
    case 'veneno':
      playerAttack(b, { mult: 1.2 });
      b.poison = 3;
      battleLog(b, 'Dokuba! Youkai envenenado!');
      break;
    case 'kagebunshin': playerAttack(b, { mult: 0.8 }); break;
    case 'exec': playerAttack(b, { mult: 2, forceCrit: true }); break;
    case 'mikiri':
      b.spdBuff = 3; b.critBuff = 3;
      addDmgPop(b, 'player', 'VEL+', '#a0e84e');
      battleLog(b, 'Mikiri! Reflexos aguçados!');
      AU.sfx('magic');
      break;
    case 'zetsumei': {
      const baixo = P.hp / E.maxHp < 0.35;
      playerAttack(b, { mult: baixo ? 3.75 : 2.5, forceCrit: baixo });
      if (baixo) battleLog(b, 'ZETSUMEI! Golpe desesperado!');
      G.shake = 9;
      break;
    }
    // --- yumi ---
    case 'precisa': playerAttack(b, { mult: 1.7, critBonus: 0.25 }); break;
    case 'chuva': playerAttack(b, { mult: 0.7 }); break;
    case 'hibashira': playerAttack(b, { mult: 2.2, magic: true }); break;
    case 'fantasma': playerAttack(b, { mult: 2.2, ignoreDef: true }); break;
    case 'fuujin':
      playerAttack(b, { mult: 2 });
      if (hitIndex === 0) { b.spdBuff = 3; addDmgPop(b, 'player', 'VEL+', '#a0e84e'); }
      break;
    case 'tenchuu': playerAttack(b, { mult: 0.9 }); G.shake = 7; break;
  }
}

function updateBattle(dt) {
  const b = G.battle;
  b.t += dt;
  if (b.eFlash > 0) b.eFlash -= dt;
  if (b.pFlash > 0) b.pFlash -= dt;
  // barras drenam suavemente até o valor real (leitura mais clara do dano)
  b.hpShown = Math.abs(b.hpShown - b.enemy.hp) < 0.6 ? b.enemy.hp : lerp(b.hpShown, b.enemy.hp, Math.min(1, dt * 7));
  b.pHpShown = Math.abs(b.pHpShown - P.hp) < 0.6 ? P.hp : lerp(b.pHpShown, P.hp, Math.min(1, dt * 7));
  if (b.slash) { b.slash.t += dt; if (b.slash.t > 0.28) b.slash = null; }
  for (const p of b.dmgPops) p.t += dt;
  b.dmgPops = b.dmgPops.filter(p => p.t < 1);

  switch (b.phase) {
    case 'entrada':
      // cinemática: linhas de velocidade, personagens deslizam para a arena
      if (b.t > 1.35 || tap('ok')) { b.phase = 'menu'; b.menuIdx = 0; b.t = 0; }
      break;
    case 'menu': {
      if (b.sub === null) {
        // lista unificada: ataque básico + técnicas equipadas
        const acts = battleActions();
        const N = acts.length;
        if (tap('up')) { b.menuIdx = (b.menuIdx + N - 1) % N; AU.sfx('menu'); }
        if (tap('down')) { b.menuIdx = (b.menuIdx + 1) % N; AU.sfx('menu'); }
        if (tap('left') || tap('right')) { b.sub = 'extra'; b.subIdx = 0; AU.sfx('menu'); }
        if (tap('ok')) {
          const a = acts[b.menuIdx];
          if (a.id === 'basic') {
            AU.sfx('ok');
            startPlayerAction(b, null);
          } else if (P.mp >= a.mp) {
            AU.sfx('ok');
            startPlayerAction(b, a);
          } else { battleLog(b, 'MP insuficiente!'); AU.sfx('back'); }
        }
      } else if (b.sub === 'extra') {
        // segunda coluna: Item / Fugir
        const N = 2;
        if (tap('up')) { b.subIdx = (b.subIdx + N - 1) % N; AU.sfx('menu'); }
        if (tap('down')) { b.subIdx = (b.subIdx + 1) % N; AU.sfx('menu'); }
        if (tap('left') || tap('right') || tap('back')) { b.sub = null; AU.sfx('back'); }
        else if (tap('ok')) {
          AU.sfx('ok');
          if (b.subIdx === 0) { b.sub = 'item'; b.subIdx = 0; }
          else { b.sub = null; fleeBattle(b); }
        }
      } else if (b.sub === 'item') {
        const its = Object.keys(ITEMS).filter(k => P.items[k] > 0);
        if (!its.length) { b.sub = null; battleLog(b, 'Sem itens!'); break; }
        if (tap('up')) { b.subIdx = (b.subIdx + its.length - 1) % its.length; AU.sfx('menu'); }
        if (tap('down')) { b.subIdx = (b.subIdx + 1) % its.length; AU.sfx('menu'); }
        b.subIdx = Math.min(b.subIdx, its.length - 1);
        if (tap('back')) { b.sub = null; AU.sfx('back'); }
        else if (tap('ok')) {
          if (useItemBattle(b, its[b.subIdx])) { b.sub = null; b.phase = 'playerActDone'; b.t = 0; b.petStruck = false; }
        }
      }
      break;
    }
    case 'playerAnim': {
      const a = b.act;
      a.t += dt;
      const k = a.t / a.dur;
      const marcos = ANIM_HITS[a.anim] || [0.5];
      // dispara os impactos nos instantes certos
      while (a.hits < marcos.length && k >= marcos[a.hits]) {
        if (b.enemy.hp > 0 || a.hits === 0) applySkillHit(b, a.hits);
        a.hits++;
      }
      if (a.t >= a.dur) { b.phase = 'playerActDone'; b.t = 0; }
      break;
    }
    case 'playerActDone':
      // o pet ataca logo depois do herói
      if (!b.petStruck && b.t > 0.3 && P.activePet && b.enemy.hp > 0) {
        b.petStruck = true;
        b.petAnim = 0.3;
        const pd = Math.max(1, Math.round(petDmg(P.activePet) - b.enemy.def * 0.3));
        b.enemy.hp = Math.max(0, b.enemy.hp - pd);
        b.eFlash = 0.2;
        addDmgPop(b, 'enemy', pd, RARITY[PETS[P.activePet].rar].color);
        AU.tone(520, 0.07, 'square', 0.05, -160);
      }
      if (b.petAnim > 0) b.petAnim -= dt;
      if (b.t > (P.activePet ? 0.62 : 0.5)) {
        if (b.enemy.hp <= 0) endBattleWin(b);
        else {
          if (b.atkBuff > 0) b.atkBuff--;
          if (b.defBuff > 0) b.defBuff--;
          if (b.spdBuff > 0) b.spdBuff--;
          if (b.critBuff > 0) b.critBuff--;
          enemyTurn(b);
        }
      }
      break;
    case 'enemyAct':
      if (b.enemy.hp <= 0) { endBattleWin(b); break; }
      if (b.enemySkipped) {
        if (b.t > 0.5) { battleLog(b, b.enemy.name + ' está congelado!'); b.phase = 'menu'; }
        break;
      }
      if (b.pendingEnemy && b.t > 0.38) applyEnemyHit(b);
      if (!b.pendingEnemy && b.t > 0.82) {
        if (P.hp <= 0) { b.phase = 'lose'; b.t = 0; AU.sfx('die'); }
        else b.phase = 'menu';
      }
      break;
    case 'result':
      if (b.t > 0.35 && tap('ok')) {
        if (b.enemy.type === 'dragao' && !G.victoryShown) {
          G.victoryShown = true;
          G.state = 'victory'; G.battle = null;
          saveGame();
        } else {
          const wasBoss = b.enemy.boss, bossName = b.enemy.name;
          fadeTo(() => {
            G.battle = null;
            AU.setTrack(G.map.name === 'cave' ? AU.CAVE : AU.WORLD);
            if (G.learnQueue.length) { G.state = 'learn'; G.learnIdx = 0; }
            else {
              G.state = 'world';
              if (wasBoss) showMsg(bossName + ' foi derrotado!\nA região está mais segura.');
            }
          });
        }
      }
      break;
    case 'fled':
      if (b.t > 0.8) {
        // afasta o inimigo
        if (b.ent) { b.ent.x += (b.ent.x > P.x ? 40 : -40); b.ent.moveT = 3; }
        fadeTo(() => { G.state = 'world'; G.battle = null; AU.setTrack(G.map.name === 'cave' ? AU.CAVE : AU.WORLD); });
      }
      break;
    case 'lose':
      if (b.t > 1.6) {
        G.state = 'gameover'; G.battle = null;
      }
      break;
  }
}

// ---------- Partículas ----------
// Sistema leve: partículas do mundo (em coordenadas do mapa) e de tela (batalha/UI)
function spawnParticle(p) {
  G.parts.push(Object.assign({
    x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 0.5, t: 0,
    size: 1, color: '#fff', fade: true, screen: false, shrink: false
  }, p));
}
function burst(x, y, n, opts) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(opts.spdMin || 20, opts.spdMax || 60);
    spawnParticle(Object.assign({}, opts, {
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (opts.lift || 0),
      color: Array.isArray(opts.color) ? pick(opts.color) : opts.color,
      life: rnd(opts.lifeMin || 0.3, opts.lifeMax || 0.7)
    }));
  }
}
// explosão em coordenadas de tela (usada na batalha e na UI)
function burstScreen(x, y, n, opts) {
  burst(x, y, n, Object.assign({ screen: true }, opts));
}
function updateParticles(dt) {
  for (const p of G.parts) {
    p.t += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.g * dt;
    if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
  }
  G.parts = G.parts.filter(p => p.t < p.life);
  if (G.parts.length > 260) G.parts.splice(0, G.parts.length - 260);
}
function drawParticles(screenLayer) {
  for (const p of G.parts) {
    if (!!p.screen !== !!screenLayer) continue;
    const k = 1 - p.t / p.life;
    ctx.globalAlpha = p.fade ? clamp(k * 1.4, 0, 1) : 1;
    const s = p.shrink ? Math.max(1, Math.round(p.size * k)) : p.size;
    ctx.fillStyle = p.color;
    let px, py;
    if (p.screen) { px = p.x; py = p.y; }
    else if (R3.ligado) {
      const q = R3.projeta(p.x / TILE, 0.5 + (p.h || 0.35), p.y / TILE);
      if (q.atras) continue;
      px = q.x; py = q.y;
    } else { px = p.x - G.camX; py = p.y - G.camY; }
    ctx.fillRect(Math.round(px), Math.round(py), s, s);
  }
  ctx.globalAlpha = 1;
}
// ambiente: vagalumes, folhas, poeira — depende da região
function updateAmbient(dt) {
  G.ambT -= dt;
  if (G.ambT > 0) return;
  G.ambT = 0.16;
  const cave = G.map.name === 'cave';
  const forest = G.region === 'Bosque de Bambu' || G.region === 'Floresta de Aokigahara';
  const grave = G.region === 'Templo Abandonado';
  const x0 = G.camX, y0 = G.camY;
  if (cave) {
    // faíscas subindo dos cristais
    if (Math.random() < 0.5) spawnParticle({
      x: x0 + rnd(0, VW), y: y0 + rnd(0, VH), vx: rnd(-4, 4), vy: rnd(-14, -6),
      life: rnd(1.2, 2.2), color: pick(['#8a7ac0', '#6a5a9a', '#b06ae8']), size: 1
    });
  } else if (forest) {
    // vagalumes entre os bambus
    if (Math.random() < 0.45) spawnParticle({
      x: x0 + rnd(0, VW), y: y0 + rnd(0, VH), vx: rnd(-6, 6), vy: rnd(-8, -2),
      life: rnd(1.4, 2.6), color: pick(['#c8e860', '#a0d848', '#e8f090']), size: 1
    });
    // folhas de bambu caindo
    if (Math.random() < 0.25) spawnParticle({
      x: x0 + rnd(0, VW), y: y0 - 4, vx: rnd(-12, -4), vy: rnd(10, 18), g: 4,
      life: rnd(1.8, 3), color: pick(['#3a7a34', '#4c8a44', '#2f6b30']), size: 2
    });
  } else if (grave) {
    // névoa subindo
    if (Math.random() < 0.4) spawnParticle({
      x: x0 + rnd(0, VW), y: y0 + VH - rnd(0, 40), vx: rnd(-3, 3), vy: rnd(-10, -4),
      life: rnd(1.6, 3), color: pick(['#6a7a8a', '#8a94a4', '#556070']), size: 2
    });
  } else {
    // pétalas de sakura ao vento (mais densas perto das vilas)
    const vila = G.region === 'Vila Sakuramura' || G.region === 'Vila Iwamura';
    if (Math.random() < (vila ? 0.55 : 0.3)) spawnParticle({
      x: x0 + rnd(-8, VW), y: y0 - 6 + rnd(0, VH * 0.5),
      vx: rnd(8, 20), vy: rnd(6, 14), g: 2, drag: 0.4,
      life: rnd(2.4, 4), color: pick(['#f7b3c6', '#ffd6e2', '#e88fa8', '#ffc2d4']), size: 2
    });
    if (Math.random() < 0.12) spawnParticle({
      x: x0 - 4, y: y0 + rnd(0, VH), vx: rnd(10, 22), vy: rnd(-4, 4),
      life: rnd(2, 3.4), color: pick(['#e8e060', '#f0e8a0']), size: 1
    });
  }
}

// ---------- Fade / efeitos ----------
function fadeTo(cb) {
  if (G.fadeDir !== 0) return;
  G.fadeDir = 1; G.fadeCb = cb;
}
function updateFade(dt) {
  if (G.fadeDir === 1) {
    G.fade += dt * 3;
    if (G.fade >= 1) { G.fade = 1; if (G.fadeCb) G.fadeCb(); G.fadeCb = null; G.fadeDir = -1; }
  } else if (G.fadeDir === -1) {
    G.fade -= dt * 3;
    if (G.fade <= 0) { G.fade = 0; G.fadeDir = 0; }
  }
}
function addFloater(x, y, txt, color) {
  G.floaters.push({ x, y, txt, color, t: 0 });
}
function toast(txt) { G.toasts.push({ txt, t: 0 }); }
function showMsg(txt) { G.msgQueue.push(txt); G.msgChar = 0; }

// ---------- Desenho: tiles ----------
// Tiles são pré-renderizados em canvas próprios (variantes por hash) e só
// blitados no frame — muito mais barato que centenas de fillRect por quadro.
const tileVarCache = new Map();
function bakeTile(key, painter) {
  let c = tileVarCache.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = TILE; c.height = TILE;
  const g = c.getContext('2d');
  painter(g);
  tileVarCache.set(key, c);
  return c;
}
const px = (g, color, x, y, w, h) => { g.fillStyle = color; g.fillRect(x, y, w || 1, h || 1); };
// PRNG determinístico por variante: garante posições bem espalhadas dentro do tile
function seeded(seed) {
  let s = seed * 2654435761 >>> 0;
  return () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967295;
  };
}

// --- grama: 6 variantes com tufos e manchas de tom ---
// tons muito próximos: variam a textura sem deixar a grade de 16px visível
const GRASS_BASE = ['#3f7a3a', '#407b3b', '#3e793a', '#417c3c', '#3f7a39', '#407a3b'];
function bakeGrass(v) {
  return bakeTile('grass' + v, g => {
    px(g, GRASS_BASE[v % GRASS_BASE.length], 0, 0, TILE, TILE);
    const r = seeded(v * 97 + 13);
    // manchas de tom
    for (let i = 0; i < 8; i++) {
      px(g, i % 3 === 0 ? '#356e30' : '#4a8945',
        Math.floor(r() * 14), Math.floor(r() * 15), 2, 1);
    }
    // tufos de capim
    for (let i = 0; i < 3; i++) {
      const hx = 1 + Math.floor(r() * 13), hy = 2 + Math.floor(r() * 11);
      px(g, '#4d8b4a', hx, hy, 1, 2);
      px(g, '#569a56', hx + 1, hy + 1, 1, 1);
    }
  });
}
// --- caminho de terra ---
function bakeDirt(v) {
  return bakeTile('dirt' + v, g => {
    px(g, '#b5a06e', 0, 0, TILE, TILE);
    const r = seeded(v * 131 + 29);
    for (let i = 0; i < 10; i++) {
      px(g, i % 2 ? '#a89162' : '#c1ad7c', Math.floor(r() * 15), Math.floor(r() * 15), 2, 1);
    }
    for (let i = 0; i < 3; i++) {
      px(g, '#8e7a52', 1 + Math.floor(r() * 12), 1 + Math.floor(r() * 12), 2, 2);
    }
  });
}

// --- torii (portal xintoísta): 2 tiles de largura x 2 de altura ---
// topo = travessas kasagi/nuki; base = pilares
function bakeToriiTop(half) {
  return bakeTile('toriiT' + half, g => {
    g.drawImage(bakeGrass(2), 0, 0);
    // kasagi (travessa curva superior) atravessa os dois tiles
    px(g, '#8f2f28', 0, 3, TILE, 4);
    px(g, '#c0392b', 0, 3, TILE, 3);
    px(g, '#e05548', 0, 3, TILE, 1);
    // ponta erguida nas extremidades
    if (half === 0) { px(g, '#c0392b', 0, 1, 4, 2); px(g, '#e05548', 0, 1, 4, 1); }
    else { px(g, '#c0392b', 12, 1, 4, 2); px(g, '#e05548', 12, 1, 4, 1); }
    // nuki (travessa inferior)
    px(g, '#8f2f28', 0, 10, TILE, 3);
    px(g, '#c0392b', 0, 10, TILE, 2);
    px(g, '#e05548', 0, 10, TILE, 1);
    // pilares descendo
    const cx = half === 0 ? 3 : 10;
    px(g, '#8f2f28', cx, 7, 3, 9);
    px(g, '#c0392b', cx, 7, 2, 9);
    px(g, '#e05548', cx, 7, 1, 9);
  });
}
function bakeToriiBase(half) {
  return bakeTile('toriiB' + half, g => {
    g.drawImage(bakeGrass(3), 0, 0);
    const cx = half === 0 ? 3 : 10;
    px(g, '#8f2f28', cx, 0, 3, 14);
    px(g, '#c0392b', cx, 0, 2, 14);
    px(g, '#e05548', cx, 0, 1, 14);
    // base de pedra
    px(g, '#6e6e78', cx - 1, 13, 5, 3);
    px(g, '#8a8a94', cx - 1, 13, 5, 1);
  });
}

// --- piso de pedra do templo ---
function bakeTemplePath(v) {
  return bakeTile('tpath' + v, g => {
    px(g, '#9a9384', 0, 0, TILE, TILE);
    const r = seeded(v * 71 + 23);
    for (let i = 0; i < 6; i++) px(g, '#8a8375', Math.floor(r() * 14), Math.floor(r() * 15), 2, 1);
    px(g, '#7d7668', 0, 7, TILE, 1);
    px(g, '#7d7668', 7, 0, 1, TILE);
    px(g, '#a9a294', 0, 0, TILE, 1);
    px(g, '#a9a294', 0, 8, TILE, 1);
  });
}

// espécie predominante por região do mapa (com variação para não ficar uniforme)
function treeSpecies(tx, ty) {
  const r = hash2(tx * 31 + 7, ty * 17 + 3);
  // Bosque de Bambu (oeste, sul do rio): bambu com alguns pinheiros
  if (tx <= 30 && ty >= 30) return r < 0.78 ? 1 : 2;
  // Floresta de Aokigahara (leste): pinheiros densos e escuros
  if (tx >= 54 && ty >= 32) return r < 0.8 ? 2 : 1;
  // Planalto do Norte: pinheiros de montanha
  if (ty <= 28) return r < 0.6 ? 2 : (r < 0.85 ? 0 : 1);
  // Campos e vilas: sakura em flor
  return r < 0.72 ? 0 : (r < 0.9 ? 2 : 1);
}

// tiles animados/dinâmicos ficam em funções de desenho direto
function drawWaterTile(g0, x, y, tx, ty, map) {
  const v = hash2(tx, ty);
  const ph = (G.time * 1.6 + v * 3) % 2;
  ctx.fillStyle = ph < 1 ? '#2a5a9a' : '#2e62a6';
  ctx.fillRect(x, y, TILE, TILE);
  // ondas
  ctx.fillStyle = '#3d72b6';
  const w1 = Math.floor((G.time * 8 + tx * 5 + ty * 3) % 16);
  ctx.fillRect(x + w1 % 12 + 1, y + 4, 4, 1);
  ctx.fillRect(x + (w1 + 7) % 12 + 2, y + 10, 3, 1);
  if (v < 0.35) { ctx.fillStyle = '#5a92d6'; ctx.fillRect(x + (w1 + 3) % 11 + 2, y + 7, 3, 1); }
  // espuma nas margens (autotile simples contra tiles não-água)
  const isW = (ax, ay) => tileAt(map, ax, ay) === 2;
  ctx.fillStyle = '#8ec2ea';
  if (!isW(tx, ty - 1)) ctx.fillRect(x, y, TILE, 1);
  if (!isW(tx, ty + 1)) ctx.fillRect(x, y + TILE - 1, TILE, 1);
  if (!isW(tx - 1, ty)) ctx.fillRect(x, y, 1, TILE);
  if (!isW(tx + 1, ty)) ctx.fillRect(x + TILE - 1, y, 1, TILE);
}
function drawFountainTile(x, y) {
  ctx.fillStyle = '#b09a6a'; ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#8e8ea2'; ctx.fillRect(x + 1, y + 1, 14, 14);
  ctx.fillStyle = '#6e6e82'; ctx.fillRect(x + 1, y + 1, 14, 1);
  const ph = Math.floor(G.time * 3) % 2;
  ctx.fillStyle = ph ? '#4a82c6' : '#5a92d6'; ctx.fillRect(x + 3, y + 3, 10, 10);
  ctx.fillStyle = '#8ec6f0'; ctx.fillRect(x + 6 + (ph ? 1 : 0), y + 5, 3, 3);
  ctx.fillStyle = '#c6e2f8'; ctx.fillRect(x + 7, y + 7, 2, 2);
  // jato central
  const jy = Math.floor(Math.sin(G.time * 4) * 1.5);
  ctx.fillStyle = '#d8eeff'; ctx.fillRect(x + 7, y + 2 + jy, 2, 3);
}
function drawAltarTile(x, y) {
  ctx.fillStyle = '#3f7a3a'; ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#4a4458'; ctx.fillRect(x + 2, y + 10, 12, 5);
  ctx.fillStyle = '#5c5c6e'; ctx.fillRect(x + 3, y + 9, 10, 5);
  ctx.fillStyle = '#8e8ea2'; ctx.fillRect(x + 4, y + 8, 8, 2);
  const fl = Math.sin(G.time * 3) * 1.5;
  const cy = y + 2 + Math.round(fl);
  ctx.fillStyle = 'rgba(176,106,232,0.25)'; ctx.fillRect(x + 4, cy + 1, 8, 8);
  ctx.fillStyle = '#8a3ac8'; ctx.fillRect(x + 6, cy, 4, 6);
  ctx.fillStyle = '#b06ae8'; ctx.fillRect(x + 6, cy + 1, 3, 4);
  ctx.fillStyle = '#e0b8ff'; ctx.fillRect(x + 7, cy + 2, 1, 2);
}
function drawCaveExitTile(x, y) {
  ctx.drawImage(bakeCaveFloor(0), x, y);
  const gl = 0.6 + Math.sin(G.time * 2) * 0.2;
  ctx.fillStyle = '#7a8ac0'; ctx.fillRect(x + 3, y + 3, 10, 10);
  ctx.globalAlpha = gl;
  ctx.fillStyle = '#aabce0'; ctx.fillRect(x + 4, y + 4, 8, 8);
  ctx.fillStyle = '#dce6ff'; ctx.fillRect(x + 6, y + 6, 4, 4);
  ctx.globalAlpha = 1;
}

function drawTile(t, x, y, tx, ty, map) {
  const v = hash2(tx, ty);
  switch (t) {
    case 0:  ctx.drawImage(bakeGrass(Math.floor(v * 6) % 6), x, y); break;
    case 1:  ctx.drawImage(bakeTree(treeSpecies(tx, ty), Math.floor(v * 6) % 6), x, y); break;
    case 2:  drawWaterTile(null, x, y, tx, ty, map); break;
    case 3:  ctx.drawImage(bakeDirt(Math.floor(v * 4) % 4), x, y); break;
    case 4:  ctx.drawImage(bakeFlower(Math.floor(v * 4) % 4), x, y); break;
    case 5:  ctx.drawImage(bakeStoneWall(0), x, y); break;
    case 6:  ctx.drawImage(bakeDirt(2), x, y); break;
    case 7:  ctx.drawImage(bakeBridge(), x, y); break;
    case 8:  ctx.drawImage(bakeMountain(Math.floor(hash2(tx * 13 + 2, ty * 29 + 7) * 3) % 3), x, y); break;
    case 9:  ctx.drawImage(bakeCaveFloor(Math.floor(hash2(tx * 37 + 1, ty * 19 + 9) * 4) % 4), x, y); break;
    case 10: ctx.drawImage(bakeCaveWall(Math.floor(hash2(tx * 23 + 5, ty * 41 + 11) * 8) % 8), x, y); break;
    case 11: ctx.drawImage(bakeCaveMouth(), x, y); break;
    case 12: drawCaveExitTile(x, y); break;
    case 13: drawFountainTile(x, y); break;
    case 14: ctx.drawImage(bakeShop(), x, y); break;
    case 15: ctx.drawImage(bakeSign(), x, y); break;
    case 16: ctx.drawImage(bakeChest(false, map.name === 'cave'), x, y); break;
    case 17: ctx.drawImage(bakeChest(true, map.name === 'cave'), x, y); break;
    case 18: ctx.drawImage(bakeRoof(), x, y); break;
    case 19: ctx.drawImage(bakeDoor(), x, y); break;
    case 20: ctx.drawImage(bakeGrave(Math.floor(v * 3) + 1), x, y); break;
    case 21: drawAltarTile(x, y); break;
    case 22: ctx.drawImage(bakeBush(Math.floor(v * 2)), x, y); break;
    case 23: ctx.drawImage(bakeRock(Math.floor(v * 4) % 4), x, y); break;
    case 24: ctx.drawImage(bakeMushroom(Math.floor(v * 2), map.name === 'cave'), x, y); break;
    case 25: ctx.drawImage(bakeToriiTop(0), x, y); break;
    case 26: ctx.drawImage(bakeToriiTop(1), x, y); break;
    case 29: ctx.drawImage(bakeToriiBase(0), x, y); break;
    case 30: ctx.drawImage(bakeToriiBase(1), x, y); break;
    case 27: ctx.drawImage(bakeLantern(), x, y); break;
    case 28: ctx.drawImage(bakeTemplePath(Math.floor(v * 3) % 3), x, y); break;
  }
}

function npcPal(look) {
  const pele = PELE[look.pele % PELE.length];
  const cab = COR_CABELO[look.corCabelo % COR_CABELO.length];
  const olho = COR_OLHOS[look.olhos % COR_OLHOS.length];
  const r = NPC_ROUPA[look.roupa % NPC_ROUPA.length];
  return {
    O: '#1a1420',
    S: pele.S, s: pele.s, b: pele.b, m: '#c4756a',
    H: cab.H, h: cab.h, d: cab.d,
    E: '#1a1420', I: olho.I, W: '#ffffff',
    A: r.A, a: r.a, c: r.c, B: r.B, L: r.L,
    M: '#d8dce8', G: '#8a6a42', Y: '#e8c050', R: '#c0392b', P: '#e8e4ee'
  };
}
function npcSprite(npc, dir, frame) {
  const step = WALK_CYCLE[(frame | 0) % WALK_CYCLE.length];
  const lk = npc.look;
  const id = `npc_${lk.cabeca}_${lk.pele}_${lk.corCabelo}_${lk.olhos}_${lk.roupa}_${dir}_${step}`;
  if (spriteCache.has(id)) return spriteCache.get(id);
  const heads = HEADS[lk.cabeca] || HEADS.samurai;
  const headDir = (dir === 'left' || dir === 'right') ? 'side' : dir;
  const bodyDir = (dir === 'left' || dir === 'right') ? 'side' : 'down';
  const rows = heads[headDir].concat(BODIES[bodyDir + step]);
  let spr = makeSprite(rows, npcPal(lk));
  if (dir === 'left') spr = flipSprite(spr);
  spriteCache.set(id, spr);
  return spr;
}

// encontra o tile livre mais próximo, para nenhum NPC nascer dentro de parede
function tileLivrePerto(map, tx, ty) {
  if (!isSolid(map, tx, ty)) return [tx, ty];
  for (let r = 1; r <= 6; r++) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
      const nx = tx + dx, ny = ty + dy;
      if (nx > 0 && ny > 0 && nx < map.w - 1 && ny < map.h - 1 && !isSolid(map, nx, ny)) return [nx, ny];
    }
  }
  return [tx, ty];
}
function spawnNPCs(map) {
  G.npcs = [];
  if (map.name !== 'overworld') return;   // por ora, só o mundo aberto
  for (const d of NPC_DEFS) {
    const [tx, ty] = tileLivrePerto(map, d.x, d.y);
    G.npcs.push({
      ...d,
      x: tx * TILE, y: ty * TILE,
      casaX: tx * TILE, casaY: ty * TILE,
      dir: 'down', frame: 0, animT: 0, moveT: rnd(0.5, 2), vx: 0, vy: 0,
      falaIdx: Math.floor(Math.random() * 97)
    });
  }
}
function updateNPCs(dt) {
  if (!G.npcs) return;
  for (const n of G.npcs) {
    n.animT += dt;
    if (n.tipo === 'quest') { n.frame = 0; continue; }   // mestres ficam no posto
    // longe do jogador nem se mexe: não adianta simular o mapa todo
    if (Math.hypot(n.x - P.x, n.y - P.y) > TILE * 26) continue;
    n.moveT -= dt;
    if (n.moveT <= 0) {
      n.moveT = rnd(1.1, 3.2);
      const vel = n.tipo === 'viajante' ? 22 : 16;
      // volta para casa se andou demais
      const dx = n.casaX - n.x, dy = n.casaY - n.y;
      const lonje = Math.hypot(dx, dy) > (n.raio || 4) * TILE;
      if (lonje) {
        const d = Math.hypot(dx, dy) || 1;
        n.vx = dx / d * vel; n.vy = dy / d * vel;
      } else {
        const d = irnd(0, 5);
        n.vx = d === 0 ? vel : d === 1 ? -vel : 0;
        n.vy = d === 2 ? vel : d === 3 ? -vel : 0;
      }
    }
    if (n.vx || n.vy) {
      const nx = n.x + n.vx * dt, ny = n.y + n.vy * dt;
      if (!isSolid(G.map, Math.floor((nx + 8) / TILE), Math.floor((n.y + 12) / TILE))) n.x = nx;
      else n.vx = 0;
      if (!isSolid(G.map, Math.floor((n.x + 8) / TILE), Math.floor((ny + 12) / TILE))) n.y = ny;
      else n.vy = 0;
      if (Math.abs(n.vx) > Math.abs(n.vy)) n.dir = n.vx > 0 ? 'right' : 'left';
      else if (n.vy) n.dir = n.vy > 0 ? 'down' : 'up';
      n.frame = Math.floor(n.animT * 6) % WALK_CYCLE.length;
    } else n.frame = 0;
  }
}
// NPC ao alcance de conversa. Quem está na direção encarada tem preferência,
// para um morador passando por perto não roubar a conversa de quem está à
// frente.
function npcPerto() {
  if (!G.npcs) return null;
  const dx = P.dir === 'left' ? -1 : P.dir === 'right' ? 1 : 0;
  const dy = P.dir === 'up' ? -1 : P.dir === 'down' ? 1 : 0;
  let melhor = null, melhorNota = -Infinity;
  for (const n of G.npcs) {
    const d = Math.hypot(n.x - P.x, n.y - P.y);
    if (d > TILE * 1.7) continue;
    // 1 quando está exatamente na direção encarada, 0 quando está atrás
    const proj = d > 1 ? ((n.x - P.x) * dx + (n.y - P.y) * dy) / d : 1;
    const nota = proj * 2 + (1 - d / (TILE * 1.7));
    if (nota > melhorNota) { melhorNota = nota; melhor = n; }
  }
  return melhor;
}
// tiles que respondem ao Z: quando o jogador encara um deles, ele vem antes do

function falaAleatoria(n) {

  const t = pool[n.falaIdx % pool.length];
  n.falaIdx++;
  return n.nome + ':\n' + t;
}

function questsDoNPC(npcId) { return Object.keys(QUESTS).filter(q => QUESTS[q].npc === npcId); }
function questAtivas() { return P.quests ? Object.keys(P.quests.ativas) : []; }
function questFeita(id) { return !!(P.quests && P.quests.feitas.includes(id)); }
// próxima missão que este NPC tem a oferecer, respeitando cadeia e nível
function questOferecida(npcId) {
  for (const id of questsDoNPC(npcId)) {
    const q = QUESTS[id];
    if (questFeita(id) || P.quests.ativas[id]) continue;
    // só oferece se a anterior da cadeia já foi entregue
    const anterior = Object.keys(QUESTS).find(k => QUESTS[k].proxima === id);
    if (anterior && !questFeita(anterior)) continue;
    return id;
  }
  return null;
}
function aceitaQuest(id) {
  P.quests.ativas[id] = { prog: 0 };

  toast('Missão aceita: ' + QUESTS[id].nome);
  saveGame();
}
function questCompleta(id) {
  const q = QUESTS[id], a = P.quests.ativas[id];
  return a && a.prog >= q.qtd;
}
function entregaQuest(id) {
  const q = QUESTS[id];
  delete P.quests.ativas[id];
  P.quests.feitas.push(id);
  P.gold += q.ouro;

  const ups = gainXP(q.xp);

  let txt = q.fim + '\n\n+' + q.ouro + ' ouro   +' + q.xp + ' XP';
  if (q.item) txt += '\n+ ' + ITEMS[q.item].name;
  if (ups.length) txt += '\nNÍVEL ' + ups[ups.length - 1] + '!';
